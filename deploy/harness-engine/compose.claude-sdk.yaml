# Layer after docker-compose.yaml, compose.deep-agents.yaml and compose.worker-egress.yaml.
# Provider credentials belong in the deployment's .env, never agent drafts.
services:
  harness-engine:
    networks: [default, harness-workers]
    environment:
      HARNESS_ENGINE_CLAUDE_SDK_PROFILES_JSON: ${HARNESS_ENGINE_CLAUDE_SDK_PROFILES_JSON:?set local SDK profiles}
      HARNESS_ENGINE_CLAUDE_WORKER_PROFILES_JSON: ${HARNESS_ENGINE_CLAUDE_WORKER_PROFILES_JSON:?set private worker connections}
      HARNESS_ENGINE_CLAUDE_TOOL_BROKER_URL: http://caipe-ui:3000

  caipe-ui:
    networks: [default, harness-workers]

  caipe-mongodb:
    networks: [default, harness-workers]

  claude-sdk-worker:
    profiles: [harness-engine]
    build: !reset null
    image: ${HARNESS_ENGINE_IMAGE:-ghcr.io/caipe-io/caipe-harness-engine:${HARNESS_IMAGE_TAG:?set a release, prebuild or source SHA tag}}
    pull_policy: always
    command: [python, -m, harness_engine.claude_worker]
    restart: unless-stopped
    user: "65532:65532"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: ${CLAUDE_WORKER_CPUS:-2.0}
    mem_limit: ${CLAUDE_WORKER_MEMORY:-2g}
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    networks: [harness-workers]
    depends_on:
      worker-egress:
        condition: service_healthy
    environment:
      HOME: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      HTTPS_PROXY: http://worker-egress:3128
      HTTP_PROXY: http://worker-egress:3128
      NO_PROXY: localhost,127.0.0.1,::1,caipe-ui,caipe-mongodb,harness-engine
      https_proxy: http://worker-egress:3128
      http_proxy: http://worker-egress:3128
      no_proxy: localhost,127.0.0.1,::1,caipe-ui,caipe-mongodb,harness-engine
      AWS_EC2_METADATA_DISABLED: "true"
      HARNESS_ENGINE_INTERNAL_TOKEN: ${CLAUDE_WORKER_INTERNAL_TOKEN:?set a distinct private worker token}
      HARNESS_ENGINE_STORAGE_BACKEND: mongodb
      HARNESS_ENGINE_MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-changeme}@caipe-mongodb:27017/harness_engine?authSource=admin}
      HARNESS_ENGINE_MONGODB_DATABASE: ${HARNESS_ENGINE_MONGODB_DATABASE:-harness_engine}
      HARNESS_ENGINE_CLAUDE_SDK_PROFILES_JSON: ${HARNESS_ENGINE_CLAUDE_SDK_PROFILES_JSON:?set local SDK profiles}
      HARNESS_ENGINE_CLAUDE_TOOL_BROKER_URL: http://caipe-ui:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    volumes:
      - claude-sdk-workspace:/workspace
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  claude-sdk-workspace:
