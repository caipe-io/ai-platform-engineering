# Apply after docker-compose.yaml for a custom production host build.
# CAIPE_UI_IMAGE selects the same image for the BFF and its authorization artifact.
services:
  caipe-ui:
    image: ${CAIPE_UI_IMAGE:?Set CAIPE_UI_IMAGE to the host build containing your extensions}
  export-authorization-model:
    image: ${CAIPE_UI_IMAGE:?Set CAIPE_UI_IMAGE to the host build containing your extensions}
    profiles: [rbac]
    entrypoint: [node, -e, "require('fs').cpSync('/app/authorization', '/bundled', {recursive:true});"]
    volumes:
      - bundled-authorization-model:/bundled
    restart: "no"
  openfga-init:
    environment:
      OPENFGA_BUNDLE_PATH: /bundled
    volumes:
      - bundled-authorization-model:/bundled:ro
    depends_on:
      export-authorization-model:
        condition: service_completed_successfully
volumes:
  bundled-authorization-model:
