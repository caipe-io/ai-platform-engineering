# Vendored source registry.
#
# `ai_platform_engineering/llm_wrapper/` is canonical source that consumers copy
# rather than install, so each consumer pins its own provider integrations. See
# that directory's README.md for why, and docs/docs/specs/
# 2026-09-24-remove-cnoe-agent-utils/ for the spec.
#
# Enforced by `scripts/check_vendored.py` in CI. Change canonical and re-copy in
# the same PR; `--fix` does the copying.

[[vendor]]
source = "ai_platform_engineering/llm_wrapper"
target = "ai_platform_engineering/dynamic_agents/src/dynamic_agents/_vendor/llm_wrapper"
files = ["__init__.py", "providers.py", "bedrock_family.py", "build.py"]

# Deliberate divergences are exempt from the hash check. Each needs a reason.
# A sandboxed harness worker is expected to appear here eventually: it holds no
# raw provider credentials, so the shared-transport paths in build.py do not
# apply to it.
#
# [[divergence]]
# path = "ai_platform_engineering/<consumer>/_vendor/llm_wrapper/build.py"
# reason = "why this copy must differ"
