{{- if include "agent.createMcpHttpServer" . | eq "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}-mcp
  labels:
    {{- include "agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        {{- $llmData := deepCopy (default (dict) .Values.global.llmSecrets.data) }}
        {{- $llmEnabled := dig "litellm" "enabled" false (.Values.global.llmRouting | default (dict)) }}
        {{- $llmConfig := dict
          "enabled" $llmEnabled
          "createSecret" .Values.global.createLlmSecret
          "secretName" .Values.global.llmSecrets.secretName
          "data" $llmData
          "externalSecret" .Values.global.llmSecrets.externalSecrets
        }}
        {{- $podAnnotations := deepCopy (default (dict) .Values.podAnnotations) }}
        {{- $_ := set $podAnnotations "checksum/llm-config" (toYaml $llmConfig | sha256sum) }}
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "agent.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag | default (include "agent.appVersion" .) }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            {{- $llmSecretName := include "agent.llmSecrets.secretName" . | trim -}}
            {{- if $llmSecretName }}
            - secretRef:
                name: {{ $llmSecretName }}
            {{- end }}
            {{- $agentSecretName := include "agent.agentSecrets.secretName" . | trim -}}
            {{- if $agentSecretName }}
            - secretRef:
                name: {{ $agentSecretName }}
            {{- end }}
          env:
            - name: MCP_MODE
              value: {{ .Values.mcp.mode }}
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: {{ .Values.mcp.service.port | quote }}
            {{- if .Values.mcp.env }}
            {{- range $key, $value := .Values.mcp.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if dig "litellm" "enabled" false (.Values.global.llmRouting | default (dict)) }}
            - name: LLM_PROVIDER
              value: openai
            - name: OPENAI_ENDPOINT
              value: {{ printf "http://%s-litellm:4000/v1" .Release.Name | quote }}
            {{- end }}
          {{- with .Values.mcp.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcp.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcp.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcp.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.mcp.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
