{{- /*
caipe-evaluator-obo client-secret K8s Secret.

Created when evaluatorTokenExchange is enabled AND the user did NOT pre-create
a Secret via `evaluatorTokenExchange.secretRef`. When ESO is enabled the
ExternalSecret is the authoritative writer and this template is skipped.

Consumed by:
  - keycloak init-token-exchange Job (KC_EVALUATOR_CLIENT_SECRET): PUTs the
    secret onto the caipe-evaluator-obo client in Keycloak.
  - the evaluator background worker deployment (EVALUATOR_OBO_CLIENT_SECRET): used to
    authenticate the token-exchange that mints submitter bearers.
*/ -}}
{{- if and (eq (include "keycloak.shouldCreateEvaluatorOboSecret" .) "true") (not .Values.evaluatorTokenExchange.externalSecret.enabled) }}
{{- $secretName := include "keycloak.evaluatorOboSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.evaluatorTokenExchange.botClientSecret }}
  KC_EVALUATOR_CLIENT_SECRET: {{ .Values.evaluatorTokenExchange.botClientSecret | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "KC_EVALUATOR_CLIENT_SECRET") }}
  KC_EVALUATOR_CLIENT_SECRET: {{ index $existing.data "KC_EVALUATOR_CLIENT_SECRET" | quote }}
  {{- else }}
  KC_EVALUATOR_CLIENT_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
