replicaCount: 1

image:
  repository: ghcr.io/caipe-io/openfga-authz-bridge
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 9100

# Must match the organization key used by the UI and RAG server.
organizationKey: caipe

openfga:
  httpUrl: "http://openfga:8080"
  storeName: caipe-openfga
  storeId: ""
  relation: can_call
  object: mcp_gateway:list
  bypassSubs: ""

agentContext:
  # Secret shared with Dynamic Agents for signed agent_id context headers.
  # Leave empty to enforce only the coarse user mcp_gateway:list gate.
  existingSecret:
    name: ""
    key: CAIPE_AGENT_CONTEXT_HMAC_SECRET

tokenValidation:
  # The bridge validates bearer JWTs itself before calling OpenFGA. Keep this
  # pointing at an internal JWKS endpoint when Keycloak runs in-cluster.
  jwksUrl: ""
  issuer: ""
  audiences: []
  algorithms:
    - RS256

callerToolCheck:
  # When enabled, the bridge additionally verifies that the calling user/team
  # holds an explicit grant for the tool being invoked (dual-gate).
  enabled: false

# MCP server IDs that require the caller to hold `can_invoke` on the matching
# OpenFGA `mcp_server:<id>` object. This is independent of callerToolCheck.
restrictedMcpServers: []

audit:
  enabled: true
  # Release-name-derived default for the audit-service singleton. Rendered with
  # tpl, so {{ .Release.Name }} resolves at install time. Override with a literal
  # URL when audit-service runs under a different name/namespace.
  serviceUrl: "http://{{ .Release.Name }}-audit-service:8010"
  tenantId: default
  subjectSalt: caipe-098-audit

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault
