# Default values for the MongoDB-compatible persistence service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Database engine to run: mongodb (default) or documentdb.
# DocumentDB is the MIT-licensed, PostgreSQL-backed project from
# https://github.com/documentdb/documentdb. Both providers expose the MongoDB
# wire protocol, so CAIPE consumers continue to use MONGODB_URI.
provider: mongodb

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the number of old ReplicaSets to retain for rollback
# Kubernetes will automatically clean up ReplicaSets beyond this limit
revisionHistoryLimit: 3

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: mongo
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "7.0"

# DocumentDB Local image settings. Used only when provider=documentdb.
# 0.113.0 is pinned because upstream 0.114.0 has a documented two-hour
# active-connection regression.
documentdb:
  image:
    repository: ghcr.io/documentdb/documentdb/documentdb-local
    tag: "pg17-0.113.0"
    pullPolicy: IfNotPresent
  port: 10260
  postgresPort: 9712
  dataPath: /data
  tlsMode: allowTLS
  logLevel: warn
  telemetryEnabled: false

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Security contexts are set to satisfy the Kubernetes Pod Security Standards Baseline
# profile (enforced) and meet all Restricted profile requirements except
# readOnlyRootFilesystem, which is left false because MongoDB requires writable data
# directories. To enforce the policy at the namespace level:
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/warn=restricted \
#     pod-security.kubernetes.io/audit=restricted
podSecurityContext:
  fsGroup: 999
  runAsNonRoot: true

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 27017

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  exec:
    command:
      - mongosh
      - --eval
      - "db.adminCommand('ping')"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  exec:
    command:
      - mongosh
      - --eval
      - "db.adminCommand('ping')"
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

# Persistence configuration for database data
persistence:
  # Enable persistent storage
  enabled: true
  # Storage class to use for the PVC (if not set, uses the default storage class)
  storageClass: ""
  # Access modes for the volume
  accessModes:
    - ReadWriteOnce
  # Size of the persistent volume
  size: 10Gi

# MongoDB authentication
auth:
  # Root username
  rootUsername: "admin"
  # Root password - should be overridden or use external secrets.
  #
  # R3 (May 2026): If `strictPasswords` (below) is true and this value
  # equals a known placeholder, the chart fails to render. The default
  # ships as "changeme" so the docker-compose dev flow keeps working;
  # production GitOps installs should EITHER set `strictPasswords: true`
  # AND override `rootPassword`, OR set `externalSecrets.enabled: true`
  # to source credentials from Vault/AWS Secrets Manager (strict mode
  # skips its check in that case because the in-cluster Secret comes
  # from ESO, not this `rootPassword` value).
  rootPassword: "changeme"
  # Database name
  database: "caipe"

# R3: Production-safety gate for the MongoDB root password.
#
# When `strictPasswords` is `true` AND `externalSecrets.enabled` is
# `false`, the chart refuses to render if `auth.rootPassword` is in the
# known-placeholder list ("changeme", "admin", "password", "mongo",
# "root", "test", etc. — see `templates/_strict-passwords.tpl`).
#
# When `externalSecrets.enabled` is `true`, the placeholder check is
# skipped because the in-cluster MongoDB Secret is sourced from the
# external store and the chart's `auth.rootPassword` value is irrelevant.
#
# Default is `false` so the docker-compose dev flow and CI matrix runs
# (which intentionally use the placeholder) keep working. Production
# GitOps installs should set this to `true`.
# assisted-by Claude:claude-opus-4-7
strictPasswords: false

# External Secrets configuration for MongoDB credentials
# These secrets are fetched from your secret store (Vault, AWS Secrets Manager, etc.)
externalSecrets:
  enabled: false  # Set to true to enable external secrets
  apiVersion: "v1beta1"
  secretStoreRef:
    name: "vault"  # Your secret store name
    kind: "ClusterSecretStore"  # or "SecretStore" for namespace-scoped
  data: []
    # Example configuration:
    # - secretKey: MONGO_INITDB_ROOT_USERNAME
    #   remoteRef:
    #     key: dev/mongodb
    #     property: username
    # - secretKey: MONGO_INITDB_ROOT_PASSWORD
    #   remoteRef:
    #     key: dev/mongodb
    #     property: password

# VPA configuration. Requires VPA to be installed in the cluster.
# Targets the MongoDB StatefulSet. Inherits global.vpa defaults; override any field here
# to customise for caipe-ui-mongodb.
vpa:
  enabled: false
  updateMode: "InPlaceOrRecreate"
  controlledResources: ["cpu", "memory"]
  controlledValues: "RequestsAndLimits"
  minAllowed:
    cpu: 50m
    memory: 128Mi
  maxAllowed: {}

# Export values for parent chart import-values
exports:
  host: "mongodb"
  port: 27017
  database: "caipe"
