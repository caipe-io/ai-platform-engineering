apiVersion: apps/v1
kind: StatefulSet
{{- $provider := include "mongodb.provider" . }}
{{- $mongoSecurityContext := .Values.securityContext | default dict }}
{{- if .Values.replicaSet.enabled }}
{{- if ne $provider "mongodb" }}{{ fail "replicaSet is only supported with provider=mongodb" }}{{ end }}
{{- if gt (int .Values.replicaCount) 50 }}{{ fail "replicaSet supports at most 50 MongoDB members" }}{{ end }}
{{- if not (trim .Values.replicaSet.name) }}{{ fail "replicaSet.name is required when replicaSet.enabled=true" }}{{ end }}
{{- if not (trim .Values.replicaSet.keyFileSecretName) }}{{ fail "replicaSet.keyFileSecretName is required when replicaSet.enabled=true" }}{{ end }}
{{- end }}
metadata:
  name: {{ include "mongodb.fullname" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mongodb.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mongodb.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.replicaSet.enabled }}
      initContainers:
        - name: prepare-replica-set-keyfile
          image: "{{ .Values.replicaSet.initImage.repository }}:{{ .Values.replicaSet.initImage.tag }}"
          imagePullPolicy: {{ .Values.replicaSet.initImage.pullPolicy | default .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args: ["cp /keyfile-secret/keyfile /keyfile/keyfile && chmod 0400 /keyfile/keyfile"]
          securityContext:
            runAsNonRoot: {{ dig "runAsNonRoot" true $mongoSecurityContext }}
            runAsUser: {{ dig "runAsUser" 999 $mongoSecurityContext }}
            {{- with $mongoSecurityContext.runAsGroup }}
            runAsGroup: {{ . }}
            {{- end }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.replicaSet.initContainerResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: replica-set-keyfile-secret
              mountPath: /keyfile-secret
              readOnly: true
            - name: replica-set-keyfile
              mountPath: /keyfile
      {{- end }}
      serviceAccountName: {{ include "mongodb.serviceAccountName" . }}
      {{- if or (not .Values.persistence.enabled) .Values.replicaSet.enabled }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.replicaSet.enabled }}
        - name: replica-set-keyfile-secret
          secret:
            secretName: {{ .Values.replicaSet.keyFileSecretName | quote }}
            # Only the init container mounts this Secret; the copy is owner-only.
            defaultMode: 0444
        - name: replica-set-keyfile
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
      {{- end }}
      {{- if eq $provider "documentdb" }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if ne $provider "documentdb" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if eq $provider "documentdb" }}
          image: "{{ .Values.documentdb.image.repository }}:{{ .Values.documentdb.image.tag }}"
          imagePullPolicy: {{ .Values.documentdb.image.pullPolicy }}
          args:
            - --username
            - $(MONGO_INITDB_ROOT_USERNAME)
            - --password
            - $(MONGO_INITDB_ROOT_PASSWORD)
            - --data-path
            - {{ .Values.documentdb.dataPath | quote }}
            - --documentdb-port
            - {{ .Values.documentdb.port | quote }}
            - --pg-port
            - {{ .Values.documentdb.postgresPort | quote }}
            - --tlsMode
            - {{ .Values.documentdb.tlsMode | quote }}
            - --log-level
            - {{ .Values.documentdb.logLevel | quote }}
            - --enable-telemetry
            - {{ .Values.documentdb.telemetryEnabled | quote }}
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (include "mongodb.appVersion" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.replicaSet.enabled }}
          args:
            - --replSet
            - {{ .Values.replicaSet.name | quote }}
            - --keyFile
            - /keyfile/keyfile
            - --bind_ip_all
          {{- end }}
          {{- end }}
          ports:
            - name: mongodb
              containerPort: {{ include "mongodb.port" . }}
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}-secret
                  key: MONGO_INITDB_DATABASE
          {{- if eq $provider "documentdb" }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - pg_isready -q -h 127.0.0.1 -p {{ .Values.documentdb.postgresPort }} -U documentdb -d postgres && pgrep -f documentdb-gateway >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          {{- else }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ ternary .Values.documentdb.dataPath "/data/db" (eq $provider "documentdb") }}
            {{- if .Values.replicaSet.enabled }}
            - name: replica-set-keyfile
              mountPath: /keyfile
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mongodb.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
          {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.storageClass }}
        {{- if (eq "-" .Values.persistence.storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        {{- end }}
  {{- end }}
