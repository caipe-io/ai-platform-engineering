replicaCount: 1

image:
  repository: cr.agentgateway.dev/agentgateway
  tag: v1.1.0
  pullPolicy: IfNotPresent

extraEnv: []
# - name: GITHUB_PERSONAL_ACCESS_TOKEN
#   valueFrom:
#     secretKeyRef:
#       name: github-mcp-secret
#       key: GITHUB_PERSONAL_ACCESS_TOKEN
# - name: GITLAB_PERSONAL_ACCESS_TOKEN
#   valueFrom:
#     secretKeyRef:
#       name: gitlab-mcp-secret
#       key: GITLAB_PERSONAL_ACCESS_TOKEN

extraEnvFrom: []
# - secretRef:
#     name: agentgateway-secrets

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 4000
  adminPort: 15000
  statsPort: 15020
  # Optional: relocate the proxy's OWN stats + readiness bind addresses off
  # agentgateway's built-in defaults (15020 / 15021). Leave this false to keep
  # the previous behavior — the static config renders no statsAddr/readinessAddr
  # and the proxy uses its defaults (fully backward compatible).
  #
  # Set true to bind stats -> statsPort and readiness -> readinessPort instead.
  # This is required when running agentgateway WITH an Istio sidecar, because the
  # sidecar reserves 15020 (pilot-agent status/metrics) and 15021 (health) and
  # the two Envoy/proxy processes share one network namespace — leaving the
  # proxy on the defaults collides and crash-loops ("Address already in use").
  explicitBindAddrs: false
  # Only used when explicitBindAddrs is true. Container port + rendered
  # readinessAddr for the proxy's readiness server.
  readinessPort: 15021

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentgateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  binds:
    - port: 4000
      listeners:
        - protocol: HTTP
          routes: []
  config:
    adminAddr: 0.0.0.0:15000
    logging:
      level: info
      format: json

# Config-bridge sidecar (static routing mode only).
#
# This feature is configured from the UMBRELLA chart under
# `global.agentgateway.static.configBridge` (alongside jwtAuth / extAuth /
# extraMcpTargets), since it depends on the umbrella-rendered static config.
# See charts/ai-platform-engineering/values.yaml for the full schema.
#
# The bridge containers reuse this subchart's `securityContext` and
# `resources` by default; override via
# `global.agentgateway.static.configBridge.{securityContext,resources}`.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
