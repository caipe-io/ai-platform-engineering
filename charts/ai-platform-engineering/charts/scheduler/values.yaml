# Default values for caipe-scheduler.

nameOverride: ""
fullnameOverride: ""

image:
  repository: "ghcr.io/caipe-io/caipe-scheduler"
  pullPolicy: "Always"
  tag: ""

# The cron-runner image used by every CronJob this scheduler creates.
# Hard-coded into the per-CronJob podTemplate by caipe-scheduler at create
# time; user-controlled fields are limited to schedule, timezone, and SCHEDULE_ID.
cronRunner:
  image:
    repository: "ghcr.io/caipe-io/caipe-cron-runner"
    pullPolicy: "IfNotPresent"
    tag: ""
  # Resource limits per cron-runner pod. Kept tight - the runner makes 2-3 HTTP calls and exits.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Explicit env-style chat path override rendered as CAIPE_CHAT_PATH in the
# scheduler ConfigMap. Falls back to caipe.chatPath when empty.
CAIPE_CHAT_PATH: ""

imagePullSecrets: []

# Service account for the scheduler-svc Deployment. Gets `cronjobs.*` Role bound.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Service account for cron-runner pods (created by every CronJob). Gets NO RBAC.
cronRunnerServiceAccount:
  create: true
  name: "caipe-cron-runner"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8080

replicaCount: 1
revisionHistoryLimit: 3

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Mongo connection
mongo:
  uri: ""                      # If unset, falls back to global.mongo.uri or existingSecret
  database: "caipe"
  schedulesCollection: "schedules"
  oneOffRunsCollection: "schedule_one_off_runs"
  # Existing Secret holding MONGODB_URI under key "uri" (preferred).
  existingSecret: ""
  existingSecretKey: "uri"

# Where the runner POSTs the chat message. The runner authenticates to the BFF
# with the shared X-Scheduler-Token only; the BFF mints the schedule owner's
# bearer via Keycloak token exchange, so the runner no longer needs a chat-API token of its own.
caipe:
  apiUrl: "http://caipe-ui:3000"
  chatPath: "/api/v1/chat/invoke"

# Shared X-Scheduler-Token. Set existingSecret in production.
serviceToken:
  existingSecret: ""
  existingSecretKey: "token"
  value: ""

# User JWT validation for caller-owned schedule operations. The service token
# still authenticates the platform component; the JWT determines ownership.
auth:
  jwksUrl: ""
  issuer: ""
  audiences:
    - "caipe-platform"
  algorithms:
    - "RS256"

# Limits enforced by scheduler-svc.
limits:
  maxSchedulesPerOwner: 50
  maxMessageChars: 2000
  # -- Minimum permitted gap, in seconds, between recurring cron fires.
  minimumScheduleIntervalSeconds: 1800

# Delayed one-off fire dispatcher. These support scheduler-managed domain
# retries without teaching the scheduler domain-specific behavior.
oneOff:
  dispatchEnabled: true
  dispatchIntervalSeconds: 30
  dispatchBatchSize: 50
  dispatchConcurrency: 5
  claimTimeoutSeconds: 300

nodeSelector: {}
tolerations: []
affinity: {}
volumes: []
volumeMounts: []
