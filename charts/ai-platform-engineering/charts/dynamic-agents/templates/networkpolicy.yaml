{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dynamic-agents.fullname" . }}
  labels:
    {{- include "dynamic-agents.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dynamic-agents.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.bffPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    - from:
        - podSelector:
            {{- toYaml .Values.networkPolicy.metricsPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ ternary .Values.service.metricsPort .Values.service.port (gt (int .Values.service.metricsPort) 0) }}
{{- end }}
