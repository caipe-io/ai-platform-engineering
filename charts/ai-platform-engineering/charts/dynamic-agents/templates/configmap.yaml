apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dynamic-agents.fullname" . }}-config
  labels:
    {{- include "dynamic-agents.labels" . | nindent 4 }}
data:
  {{- /*
    Attachment blob-store keys are resolved (with global.storage.s3 fallback and
    auto->local/s3 backend resolution) by dynamic-agents.attachmentConfig below,
    so skip them here even when set explicitly in config to avoid a duplicate
    ConfigMap key. ATTACHMENT_LOCAL_PATH is not managed by the helper and flows
    through normally.
  */ -}}
  {{- $attachmentManaged := list "ATTACHMENT_BACKEND" "ATTACHMENT_S3_BUCKET" "ATTACHMENT_S3_PREFIX" "ATTACHMENT_S3_REGION" "ATTACHMENT_S3_ENDPOINT_URL" -}}
  {{- range $key, $value := .Values.config }}
  {{- /*
    Skip keys whose value is the empty string so the rendered ConfigMap
    doesn't clobber the in-code defaults (e.g. KEYCLOAK_URL falls back to
    http://localhost:7080 only when the env var is genuinely unset; an
    empty-string env still wins over the default and is a sharper failure
    mode). Operators who want to set a key explicitly to "" should set it
    to a single space instead.
  */ -}}
  {{- if and (not (has $key $attachmentManaged)) (not (eq (toString $value) "")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- include "dynamic-agents.attachmentConfig" . | nindent 2 }}
