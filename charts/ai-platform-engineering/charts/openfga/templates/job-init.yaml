{{- if .Values.init.enabled }}
{{- $bundledImage := ((.Values.global | default dict).caipeUiImage | default "") }}
{{- if and $bundledImage .Values.init.existingModelConfigMap }}
{{- fail "Select global.caipeUiImage or init.existingModelConfigMap, not both" }}
{{- end }}
{{- if eq (.Values.init.existingModelConfigMap | default "") (printf "%s-model" (include "openfga.fullname" .)) }}
{{- fail "init.existingModelConfigMap must not refer to the chart-owned model ConfigMap" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openfga.fullname" . }}-init
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    helm.sh/hook-delete-policy: {{ .Values.init.helmHookDeletePolicy | default "before-hook-creation" | quote }}
    {{- with .Values.init.argocdHookDeletePolicy }}
    argocd.argoproj.io/hook-delete-policy: {{ . | quote }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "openfga.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (.Values.global | default dict).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openfga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $bundledImage }}
      initContainers:
        - name: export-authorization-model
          image: {{ $bundledImage | quote }}
          command: ["node", "-e", "require('fs').cpSync('/app/authorization', '/bundled', {recursive:true});"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: bundled-model
              mountPath: /bundled
      {{- end }}
      containers:
        - name: openfga-init
          image: "{{ .Values.init.image.repository }}:{{ .Values.init.image.tag }}"
          imagePullPolicy: {{ .Values.init.image.pullPolicy }}
          command: ["python", "/model/seed.py"]
          env:
            {{- if $bundledImage }}
            - name: OPENFGA_BUNDLE_PATH
              value: /bundled
            {{- end }}
            - name: OPENFGA_HTTP
              value: "http://{{ include "openfga.fullname" . }}:{{ .Values.service.httpPort }}"
            - name: OPENFGA_STORE_ID
              value: {{ .Values.init.storeId | default "" | quote }}
            - name: OPENFGA_AUTHORIZATION_MODEL_ID
              value: {{ .Values.init.authorizationModelId | default "" | quote }}
            - name: OPENFGA_APPROVED_MODULES
              value: {{ .Values.init.approvedModules | default list | toJson | quote }}
            - name: OPENFGA_STORE_NAME
              value: {{ .Values.init.storeName | quote }}
            {{- if .Values.init.seedSub }}
            - name: OPENFGA_SEED_SUB
              value: {{ .Values.init.seedSub | quote }}
            {{- end }}
            {{- if .Values.init.seedTuples }}
            - name: OPENFGA_SEED_TUPLES
              value: {{ .Values.init.seedTuples | toJson | quote }}
            {{- end }}
            {{- if .Values.init.platformClient.enabled }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ include "openfga.platformClientTokenUrl" . | quote }}
            - name: KEYCLOAK_PLATFORM_CLIENT_ID
              value: {{ .Values.init.platformClient.clientId | quote }}
            - name: OPENFGA_ORG_OBJECT
              value: {{ .Values.init.platformClient.orgObject | quote }}
            - name: KEYCLOAK_PLATFORM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "openfga.init.platformClient.clientSecretRef.name is required when platformClient seeding is enabled" .Values.init.platformClient.clientSecretRef.name | quote }}
                  key: {{ .Values.init.platformClient.clientSecretRef.key | quote }}
            {{- end }}
          volumeMounts:
            {{- if $bundledImage }}
            - name: bundled-model
              mountPath: /bundled
              readOnly: true
            {{- end }}
            - name: openfga-model
              mountPath: /model
              readOnly: true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.init.resources | nindent 12 }}
      volumes:
        {{- if $bundledImage }}
        - name: bundled-model
          emptyDir: {}
        {{- end }}
        - name: openfga-model
          {{- if .Values.init.existingModelConfigMap }}
          projected:
            sources:
              - configMap:
                  name: {{ include "openfga.fullname" . }}-model
                  items:
                    - key: seed.py
                      path: seed.py
                    - key: publish_model.py
                      path: publish_model.py
                    - key: core-authorization-model.json
                      path: core-authorization-model.json
              - configMap:
                  name: {{ .Values.init.existingModelConfigMap | quote }}
                  items:
                    - key: authorization-model.json
                      path: authorization-model.json
          {{- else }}
          configMap:
            name: {{ include "openfga.fullname" . }}-model
          {{- end }}
{{- end }}
