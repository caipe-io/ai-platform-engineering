{{- if and (eq (include "caipe-ui.agenticApps.managedMount" .) "true") (not .Values.agenticApps.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caipe-ui.fullname" . }}-agentic-apps
  labels:
    {{- include "caipe-ui.labels" . | nindent 4 }}
data:
  # The catalog is intentionally empty by default. Operators add app packages
  # and installations through deployment configuration.
  {{ .Values.agenticApps.configMapKey | quote }}: |
    agentic_apps:
      packages: []
      installations: []
{{- end }}
