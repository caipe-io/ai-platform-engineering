{{- $h := .Values.harnessEngine -}}
{{- $g := .Values.global.harnessEngine -}}
{{- $tags := .Values.tags | default dict -}}
{{- if and $g.enabled (index $tags "caipe-ui") -}}
{{- $name := printf "%s-harness-engine" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $tokenName := $g.tokenSecretName | default (printf "%s-harness-engine-token" .Release.Name) -}}
{{- $ui := index .Values "caipe-ui" -}}
{{- $mongoSecret := $h.mongodbSecretName | default $ui.existingSecret -}}
{{- if and (not $mongoSecret) $ui.externalSecrets.enabled -}}
{{- $mongoSecret = printf "%s-caipe-ui-secret" .Release.Name -}}
{{- end -}}
{{- if not $g.tokenSecretName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tokenName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenName }}
  labels:
    {{- include "ai-platform-engineering.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $g.tokenSecretKey }}: {{ if and $existing (hasKey ($existing.data | default dict) $g.tokenSecretKey) }}{{ index $existing.data $g.tokenSecretKey | quote }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  {{- with $h.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ai-platform-engineering.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness-engine
spec:
  replicas: {{ $h.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: harness-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: harness-engine
      annotations:
        checksum/config: {{ toJson (list $h.claudeSDKProfiles $h.agentcoreRuntimes $h.env) | sha256sum }}
        {{- with $h.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with $h.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness-engine
          image: "{{ $h.image.repository }}:{{ $h.image.tag | default (include "ai-platform-engineering.appVersion" .) }}"
          imagePullPolicy: {{ $h.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8010
          {{- with $h.providerSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: HARNESS_ENGINE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $tokenName }}
                  key: {{ $g.tokenSecretKey }}
            - name: HARNESS_ENGINE_STORAGE_BACKEND
              value: {{ ternary "mongodb" "memory" (ne $mongoSecret "") }}
            {{- if $mongoSecret }}
            - name: HARNESS_ENGINE_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ $mongoSecret }}
                  key: {{ $h.mongodbSecretKey }}
            {{- end }}
            - name: HARNESS_ENGINE_MONGODB_DATABASE
              value: {{ $h.mongodbDatabase | quote }}
            - name: HARNESS_ENGINE_CLAUDE_SDK_PROFILES_JSON
              value: {{ mustToJson $h.claudeSDKProfiles | quote }}
            - name: HARNESS_ENGINE_AGENTCORE_RUNTIMES_JSON
              value: {{ mustToJson $h.agentcoreRuntimes | quote }}
            {{- range $key, $value := $h.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml $h.resources | nindent 12 }}
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 512Mi
      {{- with $h.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: harness-engine
  ports:
    - name: http
      port: 8010
      targetPort: http
{{- end }}
