{{- if eq (include "ai-platform-engineering.externalSecrets.enabled" .) "true" }}
{{- $llmES := .Values.global.llmSecrets.externalSecrets | default dict }}
{{- if $llmES.data }}
apiVersion: external-secrets.io/{{ include "ai-platform-engineering.externalSecrets.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: {{ include "ai-platform-engineering.llmSecrets.externalSecrets.name" . }}
spec:
  secretStoreRef:
    {{- include "ai-platform-engineering.externalSecrets.secretStoreRef" . | nindent 4 }}
  refreshInterval: "1h0m0s"
  target:
    name: {{ include "ai-platform-engineering.llmSecrets.secretName" . }}
    {{- with (default dict $llmES.target).template }}
    template:
      {{- if .engineVersion }}
      engineVersion: {{ .engineVersion }}
      {{- end }}
      {{- if .data }}
      data:
        {{- toYaml .data | nindent 8 }}
      {{- end }}
      {{- if .metadata }}
      metadata:
        {{- toYaml .metadata | nindent 8 }}
      {{- end }}
    {{- end }}
  data:
    {{- toYaml $llmES.data | nindent 4 }}
---
{{- end }}
{{- end }}
{{- if .Values.caipeDatabase.manageExternalSecret }}
{{- $database := .Values.caipeDatabase }}
{{- if not (has $database.backend (list "mongodb" "documentdb")) }}
{{- fail "caipeDatabase.backend must be mongodb or documentdb" }}
{{- end }}
{{- $secretName := required "caipeDatabase.secretName is required" $database.secretName }}
{{- $ui := index .Values "caipe-ui" }}
{{- $data := deepCopy $ui.externalSecrets.data }}
{{- $host := index $ui.config "MONGODB_HOST" }}
{{- if eq $database.backend "documentdb" }}
{{- $host = required "caipeDatabase.documentdb.host is required" $database.documentdb.host }}
{{- $remoteKey := required "caipeDatabase.documentdb.remoteKey is required" $database.documentdb.remoteKey }}
{{/* Keep the URI entry's other remoteRef settings and all other Secret data. */}}
{{- $hasMongoDBURI := false }}
{{- range $data }}
  {{- if eq .secretKey "MONGODB_URI" }}
    {{- $hasMongoDBURI = true }}
    {{- $_ := set .remoteRef "key" $remoteKey }}
  {{- end }}
{{- end }}
{{- if not $hasMongoDBURI }}
{{- fail "caipe-ui.externalSecrets.data must include MONGODB_URI for documentdb" }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/{{ $ui.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ printf "%s-external-secret" (trimSuffix "-secret" $secretName) }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    {{- toYaml $ui.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        MONGODB_HOST: {{ required "caipe-ui.config.MONGODB_HOST is required for mongodb" $host | quote }}
  data:
    {{- toYaml $data | nindent 4 }}
{{- end }}
