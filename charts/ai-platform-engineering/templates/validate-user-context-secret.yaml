{{- if (index .Values.tags "dynamic-agents") -}}
{{- $dynamicAgents := index .Values "dynamic-agents" -}}
{{- $daSecret := $dynamicAgents.userContext.existingSecret -}}
{{- if not $daSecret.name -}}
{{- fail "dynamic-agents.userContext.existingSecret.name is required when tags.dynamic-agents=true; configure the shared DA_USER_CONTEXT_HMAC_SECRET before upgrading" -}}
{{- end -}}
{{- if (index .Values.tags "caipe-ui") -}}
{{- $ui := index .Values "caipe-ui" -}}
{{- $uiSecret := $ui.userContext.existingSecret -}}
{{- if or (ne $uiSecret.name $daSecret.name) (ne $uiSecret.key $daSecret.key) -}}
{{- fail "caipe-ui.userContext.existingSecret must match dynamic-agents.userContext.existingSecret when both components are enabled" -}}
{{- end -}}
{{- end -}}
{{- if (index .Values.tags "autonomous-agents") -}}
{{- $autonomous := index .Values "autonomous-agents" -}}
{{- $autonomousSecret := $autonomous.userContext.existingSecret -}}
{{- if or (ne $autonomousSecret.name $daSecret.name) (ne $autonomousSecret.key $daSecret.key) -}}
{{- fail "autonomous-agents.userContext.existingSecret must match dynamic-agents.userContext.existingSecret when both components are enabled" -}}
{{- end -}}
{{- end -}}
{{- end -}}
