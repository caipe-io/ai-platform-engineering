# Default values for rag-stack
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

sunnyTesting: true

global:
  # -- Global image tag override. When set, overrides appVersion-based image tags for all rag-stack subcharts.
  # Individual subchart image.tag values still take highest precedence.
  image:
    tag: ""

  rag:
    enableGraphRag: true
    openfga:
      httpUrl: ""
    # Shared client-credentials identity used by standalone RAG ingestors.
    # The RAG server consumes the public validation fields; ingestor pods also
    # consume the Secret reference. Configure these whenever the emergency
    # RBAC bypass is disabled (the normal and recommended deployment mode).
    ingestorOidc:
      issuer: ""
      discoveryUrl: ""
      jwksUrl: ""
      clientId: ""
      scope: ""
      clientSecretRef:
        name: ""
        key: "INGESTOR_OIDC_CLIENT_SECRET"
    ragServer:
      host: "rag-server"
      port: 9446
    ontologyAgentRestapi:
      host: "agent-ontology"
      port: 8098
    neo4j:
      host: "rag-neo4j"
      port: 7687 # This is hardcoded in the neo4j chart: https://github.com/neo4j/helm-charts/blob/2025.7.1/neo4j/templates/neo4j-svc.yaml#L155-L158
      username: neo4j
      password: dummy_password
    redis:
      host: "rag-redis"
      port: 6379
      # DB index (0-15). Use a dedicated index when sharing Redis with other
      # workloads.
      db: 0

  # Secrets configuration for LLM providers
  # When used as a subchart, global values can override these values
  # When used standalone, this is the secret for the LLM provider.
  llmSecrets:
    create: true # if false, it'll assume that the secret already exists
    secretName: "llm-secret"
    data: {}
    externalSecrets:
      enabled: false
      secretStoreRef:
        name: "" # Use your secret store
        kind: ClusterSecretStore # Use your secret store kind
      data: []

# Default values for rag-stack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

agentExports:
  data:
    enabled: true

# RAG Server configuration
rag-server:
  enabled: true
  fullnameOverride: "rag-server"
  image:
    repository: "ghcr.io/caipe-io/caipe-rag-server"
    # tag defaults to .Chart.AppVersion when not specified
    tag: ""
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 9446

  # Feature flag with global fallback (global.rag.enableGraphRag)
  enableGraphRag: true

  # All application configuration via environment variables
  env:
    # Feature Flags
    ENABLE_MCP: "true"
    SKIP_INIT_TESTS: "false"
    # Embeddings Configuration
    EMBEDDINGS_PROVIDER: "azure-openai"
    EMBEDDINGS_MODEL: "text-embedding-3-small"
    # Performance & Limits
    MAX_DOCUMENTS_PER_INGEST: "1000"
    MAX_RESULTS_PER_QUERY: "100"
    MAX_INGESTION_CONCURRENCY: "30"
    MAX_GRAPH_RAW_QUERY_RESULTS: "100"
    MAX_GRAPH_RAW_QUERY_TOKENS: "80000"
    SEARCH_RESULT_TRUNCATE_LENGTH: "500"
    # General Settings
    LOG_LEVEL: "DEBUG"
    UI_URL: "http://localhost:9447"
    SLEEP_ON_INIT_FAILURE_SECONDS: "180"
    CLEANUP_INTERVAL: "86400"
    # RAG human authorization is OpenFGA-only. This bypass is for emergency
    # recovery and must remain false in normal deployments.
    CAIPE_UNSAFE_RBAC_BYPASS: "false"

  # Additional envFrom references (secrets, configmaps)
  envFrom: []

  podAnnotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 1Gi

# Agent Ontology configuration (standard agent chart)
agent-ontology:
  enabled: true
  fullnameOverride: "agent-ontology"
  image:
    repository: "ghcr.io/caipe-io/caipe-rag-agent-ontology"
    # tag defaults to .Chart.AppVersion when not specified
    tag: ""
    pullPolicy: "Always"

  service:
    type: ClusterIP
    port: 8098

  # Core Configuration
  serverPort: 8098                    # SERVER_PORT - HTTP API port
  logLevel: INFO                      # LOG_LEVEL - logging level

  # Ontology Processing Configuration
  syncInterval: 0                     # SYNC_INTERVAL - auto-evaluation interval (disabled)
  minCountForEval: 3                  # MIN_COUNT_FOR_EVAL - min matches for LLM evaluation
  countChangeThresholdRatio: 0.1      # COUNT_CHANGE_THRESHOLD_RATIO - re-eval trigger (10%)

  # Agent Worker Configuration
  maxConcurrentEvaluation: 10         # MAX_CONCURRENT_EVALUATION - parallel agent workers
  agentRecursionLimit: 100            # AGENT_RECURSION_LIMIT - max LLM recursion depth
  maxLlmTokens: 100000                # MAX_LLM_TOKENS - max tokens for LLM context before summarisation
  debugAgent: false                   # DEBUG_AGENT - evaluation doesn't go to LLM if true (auto-accepts all evaluations)

  podAnnotations: {}

  resources: # Agent ontology resources are high as it processes a lot of data
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: 1500m
      memory: 3Gi
      ephemeral-storage: 3Gi

  startupProbe:
    httpGet:
      path: /v1/graph/ontology/agent/status
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /v1/graph/ontology/agent/status
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /v1/graph/ontology/agent/status
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

neo4j:
  enabled: true
  fullnameOverride: "rag-neo4j"
  config:
    server.directories.plugins: "/var/lib/neo4j/labs"
    dbms.security.procedures.unrestricted: "apoc.*"
    dbms.security.procedures.allowlist: "apoc.*"
    server.config.strict_validation.enabled: "false"
  apoc_config:
    apoc.trigger.enabled: "true"
    apoc.import.file.enabled: "true"
  disableLookups: true
  services:
    neo4j:
      enabled: false
  neo4j:
    name: rag-neo4j
    password: dummy_password # override for production
    resources:
      cpu: "1"
      memory: "2Gi"

  # The Neo4j dependency does not expose pod-level token automount control.
  # Use a dedicated account with automount disabled by this parent chart.
  serviceAccount:
    create: true
    name: rag-neo4j
    automount: false
    annotations: {}

  containerSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  podSpec:
    annotations: {}
    serviceAccountName: rag-neo4j

  volumes:
    data:
      mode: "dynamic"
      dynamic:
        storageClassName: gp2

# RAG Redis configuration
rag-redis:
  enabled: true
  fullnameOverride: "rag-redis"
  image:
    repository: "redis"
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379

  podAnnotations: {}

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Redis configuration
  redis:
    maxmemory: "256mb"
    maxmemoryPolicy: "allkeys-lru"
    save: "60 1"
    appendonly: "yes"

# Minimal Milvus cluster configuration using Zilliz Helm chart defaults
milvus:
  # Only override what differs from chart defaults
  enabled: true
  serviceAccount:
    create: false
    name: rag-milvus
    # The Milvus dependency cannot disable token automount on its own ServiceAccount.
    ragStackManaged: true
    annotations: {}

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  pulsarv3:
    enabled: false  # Default is true, we need false
  woodpecker:
    enabled: true   # Default is false, we need true

  mixCoordinator:
    annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  proxy:
    annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  dataNode:
    annotations: {}
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
    # PodDisruptionBudget configuration for dataNode
    # Protects data persistence during voluntary disruptions
    podDisruptionBudget:
      enabled: false
      # maxUnavailable: 1  # Only allow 1 pod to be unavailable during voluntary disruptions
      # minAvailable: 1    # OR ensure at least 1 pod is always available

  queryNode:
    annotations: {}
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
    # PodDisruptionBudget configuration for queryNode
    # Protects search query capacity during voluntary disruptions
    podDisruptionBudget:
      enabled: false
      # maxUnavailable: 1  # Only allow 1 pod to be unavailable during voluntary disruptions
      # minAvailable: 1    # OR ensure at least 1 pod is always available

  etcd:
    podAnnotations: {}
    serviceAccount:
      create: true
      automountServiceAccountToken: false
    podSecurityContext:
      enabled: true
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      enabled: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1001
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # PodDisruptionBudget configuration for etcd
    # Recommended for production to maintain etcd quorum during voluntary disruptions
    podDisruptionBudget:
      enabled: false
      # maxUnavailable: 1  # Only allow 1 pod to be unavailable during voluntary disruptions
      # OR use minAvailable to ensure quorum is maintained
      # minAvailable: 2  # Ensure at least 2 out of 3 pods are available (maintains quorum)

  minio:
    podAnnotations: {}
    # PodDisruptionBudget configuration for MinIO
    # Recommended for production to prevent multiple MinIO pods from being disrupted simultaneously
    podDisruptionBudget:
      enabled: false
      # maxUnavailable: 1  # Only allow 1 pod to be unavailable during voluntary disruptions
      # OR use minAvailable to ensure a minimum number of pods are available
      # minAvailable: 3  # Ensure at least 3 out of 4 pods are available (maintains quorum)

# RAG Ingestors configuration
rag-ingestors:
  enabled: true

  # Global configuration
  ragServerUrl: "http://rag-server:9446"

  # Each ingestor creates a separate Deployment.
  # See charts/rag-ingestors/values.yaml for detailed examples.
  ingestors:
    - name: webloader
      type: webloader
      initDelaySeconds: 0
      logLevel: INFO
      # Authentication defaults come from global.rag.ingestorOidc.
      env:
        WEBLOADER_MAX_INGESTION_TASKS: "5"
      envFrom: []
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
          ephemeral-storage: 1Gi

    # Example: Deploy AWS and K8s ingestors
