apiVersion: v2
name: rag-stack
description: A complete RAG stack including server, agents, Redis, Neo4j and Milvus
type: application
version: 1.0.1-dev.4 # Do NOT bump this. It will be updated automatically using the PR or release workflow
appVersion: 1.0.1-dev.4 # Do NOT modify. It will be updated automatically using the release workflow
dependencies:
  - name: rag-server
    version: 1.0.1-dev.4 # Do NOT bump this. It will be updated automatically using the PR or release workflow
    repository: "file://./charts/rag-server"
    condition: rag-server.enabled
  - name: agent-ontology
    version: 1.0.1-dev.4 # Do NOT bump this. It will be updated automatically using the PR or release workflow
    repository: "file://./charts/agent-ontology"
    condition: agent-ontology.enabled
  - name: rag-ingestors
    version: 1.0.1-dev.4 # Do NOT bump this. It will be updated automatically using the PR or release workflow
    repository: "file://./charts/rag-ingestors"
    condition: rag-ingestors.enabled
  - name: neo4j
    version: "2025.07.1"
    repository: "https://helm.neo4j.com/neo4j"
    alias: neo4j
    condition: neo4j.enabled
  - name: rag-redis
    version: 1.0.1-dev.4 # Do NOT bump this. It will be updated automatically using the PR or release workflow
    repository: "file://./charts/rag-redis"
    condition: rag-redis.enabled
  - name: milvus
    version: "5.0.2"
    repository: "https://zilliztech.github.io/milvus-helm/"
    condition: milvus.enabled
