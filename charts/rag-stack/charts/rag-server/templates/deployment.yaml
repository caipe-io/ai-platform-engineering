apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-server.fullname" . }}
  labels:
    {{- include "rag-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "rag-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rag-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-server.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount | default false }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Main RAG Server container
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (include "rag-server.appVersion" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9446
              protocol: TCP
          envFrom:
            {{- $llmSecretName := include "rag-server.llmSecrets.secretName" . | trim -}}
            {{- if $llmSecretName }}
            - secretRef:
                name: {{ $llmSecretName }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- $global := .Values.global | default dict }}
            {{- $rag := $global.rag | default dict }}
            {{- $ingestorOidc := $rag.ingestorOidc | default dict }}
            # Computed connection settings (from global values)
            - name: REDIS_URL
              value: {{ include "rag-server.redisUrl" . | quote }}
            - name: NEO4J_ADDR
              value: {{ include "rag-server.neo4jAddr" . | quote }}
            - name: NEO4J_USERNAME
              value: {{ include "rag-server.neo4jUsername" . | quote }}
            - name: NEO4J_PASSWORD
              value: {{ include "rag-server.neo4jPassword" . | quote }}
            - name: MILVUS_URI
              value: {{ include "rag-server.milvusUri" . | quote }}
            - name: ONTOLOGY_AGENT_RESTAPI_ADDR
              value: {{ include "rag-server.ontologyAgentRestapiAddr" . | quote }}
            # Feature flag with global fallback
            - name: ENABLE_GRAPH_RAG
              value: {{ include "rag-server.enableGraphRag" . | quote }}
            - name: OPENFGA_HTTP
              value: {{ include "rag-server.openfgaHttpUrl" . | default (printf "http://%s-openfga:8080" .Release.Name) | quote }}
            {{- if and $ingestorOidc.issuer (not (hasKey .Values.env "INGESTOR_OIDC_ISSUER")) }}
            - name: INGESTOR_OIDC_ISSUER
              value: {{ tpl $ingestorOidc.issuer . | quote }}
            {{- end }}
            {{- if and $ingestorOidc.discoveryUrl (not (hasKey .Values.env "INGESTOR_OIDC_DISCOVERY_URL")) }}
            - name: INGESTOR_OIDC_DISCOVERY_URL
              value: {{ tpl $ingestorOidc.discoveryUrl . | quote }}
            {{- end }}
            {{- if and $ingestorOidc.jwksUrl (not (hasKey .Values.env "INGESTOR_OIDC_JWKS_URL")) }}
            - name: INGESTOR_OIDC_JWKS_URL
              value: {{ tpl $ingestorOidc.jwksUrl . | quote }}
            {{- end }}
            {{- if and $ingestorOidc.clientId (not (hasKey .Values.env "INGESTOR_OIDC_CLIENT_ID")) }}
            - name: INGESTOR_OIDC_CLIENT_ID
              value: {{ $ingestorOidc.clientId | quote }}
            {{- end }}
            {{- if and $ingestorOidc.clientId (not (hasKey .Values.env "RAG_TRUSTED_INGESTOR_CLIENT_IDS")) }}
            - name: RAG_TRUSTED_INGESTOR_CLIENT_IDS
              value: {{ $ingestorOidc.clientId | quote }}
            {{- end }}
            # All other configuration via env map (OPENFGA_HTTP handled above)
            {{- range $key, $value := .Values.env }}
            {{- if ne $key "OPENFGA_HTTP" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
