nameOverride: ""
fullnameOverride: "rag-server"

# Feature flag with global fallback (global.rag.enableGraphRag)
enableGraphRag: true

image:
  repository: "ghcr.io/caipe-io/caipe-rag-server"
  # tag defaults to .Chart.AppVersion when not specified
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# This sets the number of old ReplicaSets to retain for rollback
# Kubernetes will automatically clean up ReplicaSets beyond this limit
revisionHistoryLimit: 3

# Environment variables for rag-server container
# All application configuration goes here
env: {}
  # Feature Flags
  # ENABLE_MCP: "true"
  # SKIP_INIT_TESTS: "false"
  #
  # Embeddings Configuration
  # EMBEDDINGS_PROVIDER: "azure-openai"  # Options: azure-openai, openai, litellm
  # EMBEDDINGS_MODEL: "text-embedding-3-small"
  # LITELLM_API_BASE: "http://litellm-proxy:4000"  # Required when using litellm provider
  #
  # Performance & Limits
  # MAX_DOCUMENTS_PER_INGEST: "1000"
  # MAX_RESULTS_PER_QUERY: "100"
  # MAX_INGESTION_CONCURRENCY: "30"
  # MAX_GRAPH_RAW_QUERY_RESULTS: "100"
  # MAX_GRAPH_RAW_QUERY_TOKENS: "80000"
  # SEARCH_RESULT_TRUNCATE_LENGTH: "500"
  #
  # General Settings
  # LOG_LEVEL: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  # UI_URL: "http://localhost:9447"
  # SLEEP_ON_INIT_FAILURE_SECONDS: "180"
  # CLEANUP_INTERVAL: "86400"
  #
  # RAG human authorization is OpenFGA-only. Set emergency bypass values only
  # through controlled operator overrides.

# Additional envFrom references (secrets, configmaps)
envFrom: []

serviceAccount:
  create: false
  name: ""
  automount: false
  annotations: {}

service:
  type: ClusterIP
  port: 9446

resources: {}

# Security contexts are set to satisfy the Kubernetes Pod Security Standards Baseline
# profile (enforced) and meet all Restricted profile requirements except
# readOnlyRootFilesystem, which is left false because the application may write to
# /tmp at runtime. To enforce the policy at the namespace level:
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/warn=restricted \
#     pod-security.kubernetes.io/audit=restricted
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}

# Init containers to run before the main containers (e.g. install Playwright browsers)
initContainers: []
# - name: playwright-install
#   image: "ghcr.io/caipe-io/caipe-rag-ingestors:0.4.4"
#   command: ["sh", "-c", "playwright install chromium"]
#   volumeMounts:
#     - name: playwright-browsers
#       mountPath: /opt/playwright

# Extra volumes for the pod (referenced by initContainers or the main container)
extraVolumes: []
# - name: playwright-browsers
#   emptyDir: {}

podAnnotations: {}
podLabels: {}

imagePullSecrets: []

llmSecrets:
  secretName: "llm-secret"

startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# VPA configuration. Requires VPA to be installed in the cluster.
# Inherits global.vpa defaults; override any field here to customise for rag-server.
vpa:
  enabled: false
  updateMode: "InPlaceOrRecreate"
  controlledResources: ["cpu", "memory"]
  controlledValues: "RequestsAndLimits"
  minAllowed:
    cpu: 50m
    memory: 128Mi
  maxAllowed: {}
