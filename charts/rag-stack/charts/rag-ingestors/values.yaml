# Default values for rag-ingestors
# This chart allows you to deploy multiple ingestors as separate deployments
# Each ingestor can have its own configuration

# Global image configuration
image:
  repository: "ghcr.io/caipe-io/caipe-rag-ingestors"
  # tag defaults to .Chart.AppVersion when not specified
  tag: ""
  pullPolicy: IfNotPresent

# This sets the number of old ReplicaSets to retain for rollback
# Kubernetes will automatically clean up ReplicaSets beyond this limit
revisionHistoryLimit: 3

# Global RAG server URL (can be overridden per ingestor)
ragServerUrl: "http://rag-server:9446"

# Service account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Security contexts are set to satisfy the Kubernetes Pod Security Standards Baseline
# profile (enforced) and meet all Restricted profile requirements except
# readOnlyRootFilesystem, which is left false because ingestor workloads may write to
# /tmp at runtime. To enforce the policy at the namespace level:
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/warn=restricted \
#     pod-security.kubernetes.io/audit=restricted
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

# List of ingestors to deploy
# Each ingestor will create a separate Deployment
# By default, no ingestors are deployed
ingestors: []
  # Example AWS Ingestor
  # - name: aws-prod
  #   type: aws                              # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # AWS-specific configuration
  #   env:
  #     AWS_REGION: us-east-1                # AWS_DEFAULT_REGION or AWS_REGION
  #     RESOURCE_TYPES: "ec2:instance,s3:bucket,eks:cluster,rds:db,lambda:function"
  #
  #   # AWS credentials from secret
  #   envFrom:
  #     - secretRef:
  #         name: aws-credentials            # Must contain AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  #
  #   # Optional: Mount AWS credentials file
  #   volumeMounts:
  #     - name: aws-credentials
  #       mountPath: /home/app/.aws
  #       readOnly: true
  #   volumes:
  #     - name: aws-credentials
  #       secret:
  #         secretName: aws-credentials-file
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 1Gi

  # Example S3 Ingestor
  # - name: s3-docs
  #   type: s3                               # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # S3-specific configuration
  #   env:
  #     AWS_DEFAULT_REGION: us-east-2
  #     S3_BUCKETS: "arn:aws:s3:::my-docs-bucket"  # Comma-separated bucket ARNs.
  #                                          # Account-qualify for cross-account:
  #                                          # "dev:arn:aws:s3:::dev-docs,prod:arn:aws:s3:::prod-docs"
  #     AWS_ACCOUNT_LIST: ""                 # "dev:111111111111,prod:222222222222" for cross-account
  #     CROSS_ACCOUNT_ROLE_NAME: "caipe-read-only"  # Role assumed per target account
  #     S3_ALLOWED_FILES_AND_EXTENSIONS: "*.md,*.txt,*.rst,*.adoc,*.asciidoc"
  #     S3_IGNORE_PREFIXES: ""               # Comma-separated relative key prefixes to skip
  #     S3_IGNORE_REGEX: ""                  # Regex applied to full object key to skip matches
  #     S3_MAX_FILES_PER_BUCKET: "2000"      # Hard limit per bucket; sync fails if exceeded
  #
  #   # AWS credentials — choose one approach:
  #   #
  #   # Option 1: Kubernetes Secret containing AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY
  #   #   (add AWS_SESSION_TOKEN for temporary credentials)
  #   # envFrom:
  #   #   - secretRef:
  #   #       name: my-aws-credentials-secret
  #   #
  #   # Option 2: IRSA (IAM Roles for Service Accounts) — annotate the ingestor ServiceAccount
  #   #   with the IAM role ARN; no secret needed, credentials are injected by the EKS Pod
  #   #   Identity webhook automatically.
  #   # serviceAccount:
  #   #   annotations:
  #   #     eks.amazonaws.com/role-arn: "arn:aws:iam::111111111111:role/my-s3-reader-role"
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example K8s Ingestor (In-Cluster)
  # - name: k8s-local
  #   type: k8s                              # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # K8s-specific configuration
  #   env:
  #     CLUSTER_NAME: production-cluster     # CLUSTER_NAME (required)
  #     IN_CLUSTER: "true"                   # IN_CLUSTER - uses ServiceAccount
  #
  #   # RBAC permissions needed for in-cluster access
  #   rbac:
  #     create: true
  #     rules:
  #       - apiGroups: ["*"]
  #         resources: ["*"]
  #         verbs: ["get", "list", "watch"]
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example K8s Ingestor (External Cluster with kubeconfig)
  # - name: k8s-external
  #   type: k8s                              # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # K8s-specific configuration with kubeconfig
  #   env:
  #     CLUSTER_NAME: staging-cluster        # CLUSTER_NAME (required)
  #     KUBECONFIG: /home/app/.kube/config   # KUBECONFIG path
  #     KUBE_CONTEXT: staging-context        # KUBE_CONTEXT (optional)
  #
  #   # Mount kubeconfig from secret
  #   volumeMounts:
  #     - name: kubeconfig
  #       mountPath: /home/app/.kube
  #       readOnly: true
  #   volumes:
  #     - name: kubeconfig
  #       secret:
  #         secretName: external-kubeconfig
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example ArgoCD Ingestor
  # - name: argocd-prod
  #   type: argocd                           # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # ArgoCD-specific configuration
  #   env:
  #     SERVER_URL: https://argocd.example.com  # SERVER_URL (required)
  #     ARGOCD_VERIFY_SSL: "true"            # ARGOCD_VERIFY_SSL
  #     ARGOCD_FILTER_PROJECTS: "production,staging"  # ARGOCD_FILTER_PROJECTS (comma-separated)
  #
  #   # ArgoCD auth token from secret
  #   envFrom:
  #     - secretRef:
  #         name: argocd-auth                # Must contain ARGOCD_AUTH_TOKEN
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example Slack Ingestor
  # - name: slack-workspace
  #   type: slack                            # INGESTOR_TYPE
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # Slack-specific configuration
  #   env:
  #     SLACK_BOT_NAME: mybot                # SLACK_BOT_NAME (required)
  #     SLACK_WORKSPACE_URL: https://mycompany.slack.com  # SLACK_WORKSPACE_URL (required)
  #     SLACK_CHANNELS: |                    # SLACK_CHANNELS (JSON)
  #       {
  #         "C1234567890": {
  #           "name": "general",
  #           "lookback_days": 30,
  #           "include_bots": false
  #         },
  #         "C0987654321": {
  #           "name": "engineering",
  #           "lookback_days": 90,
  #           "include_bots": true
  #         }
  #       }
  #
  #   # Slack bot token from secret
  #   envFrom:
  #     - secretRef:
  #         name: slack-credentials          # Must contain SLACK_BOT_TOKEN
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example Webex Ingestor
  # - name: webex-workspace
  #   type: webex                            # INGESTOR_TYPE
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # Webex-specific configuration
  #   env:
  #     WEBEX_BOT_NAME: mybot                # WEBEX_BOT_NAME (required)
  #     WEBEX_SPACES: |                      # WEBEX_SPACES (JSON)
  #       {
  #         "Y2lzY29zcGFyazovL3VzL1JPT00vYmJjZWIxYWQtNDNmMS0zYjU4LTkxNDctZjE0YmIwYzRkMTU0": {
  #           "name": "general",
  #           "lookback_days": 30
  #         }
  #       }
  #
  #   # Webex access token from secret
  #   envFrom:
  #     - secretRef:
  #         name: webex-credentials          # Must contain WEBEX_ACCESS_TOKEN
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example Backstage Ingestor
  # - name: backstage-catalog
  #   type: backstage                        # INGESTOR_TYPE
  #   syncInterval: 86400                    # SYNC_INTERVAL (24 hours)
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # Backstage-specific configuration
  #   env:
  #     BACKSTAGE_URL: https://backstage.example.com  # BACKSTAGE_URL (required)
  #
  #   # Backstage API token from secret
  #   envFrom:
  #     - secretRef:
  #         name: backstage-credentials      # Must contain BACKSTAGE_API_TOKEN
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example Jira Ingestor
  # - name: jira-workspace
  #   type: jira                             # INGESTOR_TYPE
  #   initDelaySeconds: 60                   # INIT_DELAY_SECONDS
  #   logLevel: INFO                         # LOG_LEVEL
  #
  #   # Jira-specific configuration
  #   env:
  #     JIRA_URL: https://mycompany.atlassian.net  # JIRA_URL (required)
  #     JIRA_EMAIL: bot@mycompany.com        # JIRA_EMAIL (required)
  #     JIRA_PAGE_SIZE: "100"                # JIRA_PAGE_SIZE
  #     JIRA_PROJECTS: |                     # JIRA_PROJECTS (JSON)
  #       {
  #         "PROJ": [
  #           {
  #             "name": "My Project",
  #             "jql": "project = PROJ AND updated >= -30d ORDER BY updated DESC",
  #             "include_comments": true,
  #             "include_links": true
  #           }
  #         ],
  #         "OPS": [
  #           {
  #             "name": "untriaged",
  #             "jql": "project = OPS AND status = Open ORDER BY updated DESC",
  #             "custom_fields": {"slo": "customfield_12345"}
  #           },
  #           {
  #             "name": "all-issues",
  #             "jql": "project = OPS AND status != Done ORDER BY updated DESC"
  #           }
  #         ]
  #       }
  #
  #   # Jira API token from secret
  #   envFrom:
  #     - secretRef:
  #         name: jira-credentials           # Must contain ATLASSIAN_TOKEN
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

  # Example Confluence Ingestor
  # - name: confluence-wiki
  #   type: confluence                        # INGESTOR_TYPE
  #   initDelaySeconds: 60                    # INIT_DELAY_SECONDS
  #   logLevel: INFO                          # LOG_LEVEL
  #
  #   # Confluence-specific configuration
  #   env:
  #     CONFLUENCE_URL: https://mycompany.atlassian.net/wiki  # CONFLUENCE_URL (required)
  #     CONFLUENCE_SSL_VERIFY: "true"         # CONFLUENCE_SSL_VERIFY
  #     CONFLUENCE_MAX_CONCURRENCY: "5"       # CONFLUENCE_MAX_CONCURRENCY
  #     CONFLUENCE_SPACES: |                  # CONFLUENCE_SPACES (JSON, optional)
  #       {
  #         "SRE": [
  #           {"page_id": "123456", "get_child_pages": true}
  #         ],
  #         "DEVOPS": []
  #       }
  #
  #   # Confluence credentials from secret
  #   envFrom:
  #     - secretRef:
  #         name: confluence-credentials      # Must contain CONFLUENCE_USERNAME, CONFLUENCE_TOKEN
  #
  #   # Title filtering is configured per-datasource via the API:
  #   #   POST /v1/ingest/confluence/page
  #   #     { "url": "...", "denied_title_patterns": ["Deprecated", "Do Not Use"] }
  #   # Patterns are regex, case-insensitive, and persist across reloads.
  #
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi

# Default resources for ingestors (can be overridden per ingestor)
defaultResources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi

# Common pod annotations
podAnnotations: {}

# Common pod labels
podLabels: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# VPA configuration. Requires VPA to be installed in the cluster.
# Creates one VPA per ingestor Deployment. Applies the same config to all ingestors.
# Inherits global.vpa defaults; override any field here to customise for rag-ingestors.
vpa:
  enabled: false
  updateMode: "InPlaceOrRecreate"
  controlledResources: ["cpu", "memory"]
  controlledValues: "RequestsAndLimits"
  minAllowed:
    cpu: 50m
    memory: 128Mi
  maxAllowed: {}

# Image pull secrets
imagePullSecrets: []
