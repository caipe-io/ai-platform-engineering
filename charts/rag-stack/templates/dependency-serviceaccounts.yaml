{{- if and .Values.neo4j.enabled .Values.neo4j.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "neo4j.serviceAccount.name is required when neo4j.serviceAccount.create=true" .Values.neo4j.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
  {{- with .Values.neo4j.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.neo4j.serviceAccount.automount }}
---
{{- end }}
{{- if and .Values.milvus.enabled .Values.milvus.serviceAccount.ragStackManaged }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "milvus.serviceAccount.name is required when milvus.serviceAccount.ragStackManaged=true" .Values.milvus.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: milvus
  {{- with .Values.milvus.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
