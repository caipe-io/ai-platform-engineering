<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Remote A2A delegation</title>
<desc id="desc">The connection test reads metadata. The parent agent runs the delegated task.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Remote A2A delegation</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">The connection test reads metadata. The parent agent runs the delegated task.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="126" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">Agent catalog</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Discover and inspect Agent Cards</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Register an endpoint</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="418" y="126" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">Remote agent registry</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Endpoint and Agent Card metadata</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Authentication reference</text>
<rect x="40" y="285" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="306" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="334" fill="#172644" font-size="19" font-weight="720">CAIPE Chat</text>
<text x="58" y="361" fill="#465978" font-size="15" font-weight="500">Start the authorized parent agent</text>
<text x="58" y="380" fill="#465978" font-size="15" font-weight="500">Request delegated work</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">Deep Agents parent</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Load selected registry entry</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Resolve caller authentication</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="778" y="306" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">Remote A2A agent</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Negotiate advertised transport</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">Execute the delegated task</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Register</text>
<path d="M304,340 L400,340 M391.1,344.6 L400,340 L391.1,335.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="331" fill="#465978" font-size="12" font-weight="600">Run parent</text>
<path d="M532,285 L532,215 M536.6,223.9 L532,215 L527.4,223.9" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542" y="252" fill="#465978" font-size="12" font-weight="600">Read selection</text>
<path d="M664,340 L760,340 M751.1,344.6 L760,340 L751.1,335.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="331" fill="#465978" font-size="12" font-weight="600">Delegate</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">A2A delegation uses the registered endpoint and the selected caller authentication.</text>
</g></svg>
