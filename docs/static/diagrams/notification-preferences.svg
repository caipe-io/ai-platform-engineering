<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Notification preference resolution</title>
<desc id="desc">The shipped contracts resolve a user setting for a known platform event.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Notification preference resolution</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">The shipped contracts resolve a user setting for a known platform event.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="58" y="126" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">Platform event catalog</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Event and category</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Severity and default</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#f5eafa" stroke="#783f92" stroke-width="1.4"/>
<text x="418" y="126" fill="#783f92" font-size="12" font-weight="750">ACCESS CONTROL</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">1. Event preference</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Use an explicit event override</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">when one is saved</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#f5eafa" stroke="#783f92" stroke-width="1.4"/>
<text x="778" y="126" fill="#783f92" font-size="12" font-weight="750">ACCESS CONTROL</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">2. Category preference</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Use the category override</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">when no event override is set</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#f5eafa" stroke="#783f92" stroke-width="1.4"/>
<text x="778" y="306" fill="#783f92" font-size="12" font-weight="750">ACCESS CONTROL</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">3. Catalog default</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Use the event default when</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">neither override is set</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Look up event</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">If unset</text>
<path d="M892,215 L892,285 M887.4,276.1 L892,285 L896.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="252" fill="#465978" font-size="12" font-weight="600">If unset</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">Clearing an override restores inheritance. This diagram covers preference resolution.</text>
</g></svg>
