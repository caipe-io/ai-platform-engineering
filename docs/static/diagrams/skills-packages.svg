<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Skills packages and Skills Gateway</title>
<desc id="desc">Pinned originals feed the catalog. CAIPE agents and local coding clients use separate access paths.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Skills packages and Skills Gateway</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">Pinned originals feed the catalog. CAIPE agents and local coding clients use separate access paths.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="58" y="126" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">GitHub repository</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Fixed commit SHA</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Entry and supporting files</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">Skill hub crawler</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Import original package</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Refresh catalog and scan state</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="778" y="126" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Skill catalog</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Stable skill identity</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">Revision, files, and scan state</text>
<rect x="40" y="285" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="58" y="306" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="58" y="334" fill="#172644" font-size="19" font-weight="720">Local coding client</text>
<text x="58" y="361" fill="#465978" font-size="15" font-weight="500">Catalog API key</text>
<text x="58" y="380" fill="#465978" font-size="15" font-weight="500">Install or fetch skills</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">Skills Gateway</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Authorize catalog access</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Serve permitted skills</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">Dynamic Agents</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Apply package pin checks</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">Load eligible attached skill</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Fetch revision</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">Cache and scan</text>
<path d="M304,340 L400,340 M391.1,344.6 L400,340 L391.1,335.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="331" fill="#465978" font-size="12" font-weight="600">Catalog API</text>
<path d="M532,285 L892,215 M884.2,221.2 L892,215 L882.4,212.2" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M892,285 L892,215 M896.6,223.9 L892,215 L887.4,223.9" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="252" fill="#465978" font-size="12" font-weight="600">Read and verify</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">Pinned runtime packages are checked against the selected entry and supporting files.</text>
</g></svg>
