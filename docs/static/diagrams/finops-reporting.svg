<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">FinOps reporting through MCP</title>
<desc id="desc">The FinOps agent brings cloud-cost and model-usage data into the same conversation.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">FinOps reporting through MCP</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">The FinOps agent brings cloud-cost and model-usage data into the same conversation.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="126" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">CAIPE Chat</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Ask about cloud or model cost</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Read the resulting report</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">FinOps agent</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Select authorized MCP tools</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Combine relevant results</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Cloudability MCP</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Retrieve cloud-cost data</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">Use Cloudability credentials</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">LiteLLM MCP</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Read model spend and tokens</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Use LiteLLM credentials</text>
<rect x="40" y="285" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="58" y="306" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="58" y="334" fill="#172644" font-size="19" font-weight="720">LiteLLM API</text>
<text x="58" y="361" fill="#465978" font-size="15" font-weight="500">Spend and activity records</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="778" y="306" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">Cloudability API</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Budgets, allocation,</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">views, and portfolios</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Ask</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">Cloud cost</text>
<path d="M892,215 L892,285 M887.4,276.1 L892,285 L896.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="252" fill="#465978" font-size="12" font-weight="600">Query</text>
<path d="M532,215 L532,285 M527.4,276.1 L532,285 L536.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542" y="252" fill="#465978" font-size="12" font-weight="600">Model usage</text>
<path d="M400,340 L304,340 M312.9,335.4 L304,340 L312.9,344.6" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="331" fill="#465978" font-size="12" font-weight="600">Query</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">CAIPE tool access and the underlying provider credentials both limit what the agent can read.</text>
</g></svg>
