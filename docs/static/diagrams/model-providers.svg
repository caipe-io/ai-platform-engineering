<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Choose an endpoint and models</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Save or test a connection</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">CAIPE backend</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Authorize config access</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Save connection and model IDs</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="778" y="126" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Model and secret records</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Model IDs and connection config</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">References to encrypted secrets</text>
<rect x="40" y="285" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="306" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="334" fill="#172644" font-size="19" font-weight="720">Agent Builder and Chat</text>
<text x="58" y="361" fill="#465978" font-size="15" font-weight="500">Select a registered model</text>
<text x="58" y="380" fill="#465978" font-size="15" font-weight="500">Send a test conversation</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">Runtime / test path</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Resolve permitted credentials</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Apply the selected model config</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="778" y="306" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
