<text x="668" y="331" fill="#465978" font-size="12" font-weight="600">Call model</text>
<path d="M532,285 L892,215 M884.2,221.2 L892,215 L882.4,212.2" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">Shared models still require model read access and permission to use each referenced credential.</text>
