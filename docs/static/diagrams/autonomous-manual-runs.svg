<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Autonomous manual runs with context</title>
<desc id="desc">Authenticated task access and a request ID guard admission to the contextual run queue.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Autonomous manual runs with context</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">Authenticated task access and a request ID guard admission to the contextual run queue.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="126" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">Autonomous user</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Choose an enabled task</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Supply context and request ID</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">Autonomous task API</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Check task access</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Validate and bound context</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Run queue</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Queue the contextual run</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">Return the accepted run ID</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="418" y="306" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">MongoDB</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Claim task and request ID</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Store run history</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">Task runner</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Execute with task owner access</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">Treat context as untrusted input</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Run task</text>
<path d="M532,215 L532,285 M527.4,276.1 L532,285 L536.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542" y="252" fill="#465978" font-size="12" font-weight="600">Claim ID</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">Enqueue</text>
<path d="M892,215 L892,285 M887.4,276.1 L892,285 L896.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="252" fill="#465978" font-size="12" font-weight="600">Dispatch</text>
<path d="M760,340 L664,340 M672.9,335.4 L664,340 L672.9,344.6" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="331" fill="#465978" font-size="12" font-weight="600">Record result</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">Retry the same submission with the same request ID to avoid a duplicate run.</text>
</g></svg>
