<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Configured remote ACP workers</title>
<desc id="desc">The saved CAIPE agent and operator profile select the worker and session.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Configured remote ACP workers</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">The saved CAIPE agent and operator profile select the worker and session.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="126" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">Agent catalog and Chat</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Start Chat for a saved ACP agent</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Retain its conversation binding</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">Harness Gateway</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Check caller and agent access</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Stream run events</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Harness Engine</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Read operator profile</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">Bind and invoke worker session</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="418" y="306" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">Worker workspace</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Persist native transcript</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">and session files</text>
<rect x="760" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="778" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="778" y="334" fill="#172644" font-size="19" font-weight="720">Claude ACP worker</text>
<text x="778" y="361" fill="#465978" font-size="15" font-weight="500">Configured SDK-over-ACP</text>
<text x="778" y="380" fill="#465978" font-size="15" font-weight="500">or Claude Code CLI worker</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Start chat</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">Admit run</text>
<path d="M892,215 L892,285 M887.4,276.1 L892,285 L896.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="252" fill="#465978" font-size="12" font-weight="600">Call worker</text>
<path d="M760,340 L664,340 M672.9,335.4 L664,340 L672.9,344.6" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="331" fill="#465978" font-size="12" font-weight="600">Keep state</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">The worker connection is operator-configured. ACP is experimental in 1.4.0.</text>
</g></svg>
