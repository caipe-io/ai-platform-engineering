<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 467" role="img" aria-labelledby="title desc">
<title id="title">Hosted app and assistant architecture</title>
<desc id="desc">The host resolves the installed app and controls access to its chat and runtime routes.</desc>
<rect width="1064" height="467" rx="20" fill="#f8faff"/>
<g font-family="Inter, Helvetica, Arial, sans-serif">
<text x="40" y="53" fill="#172644" font-size="31" font-weight="750">Hosted app and assistant architecture</text>
<text x="40" y="78" fill="#465978" font-size="16" font-weight="500">The host resolves the installed app and controls access to its chat and runtime routes.</text>
<rect x="40" y="105" width="264" height="110" rx="12" fill="#e8f3ff" stroke="#2162a7" stroke-width="1.4"/>
<text x="58" y="126" fill="#2162a7" font-size="12" font-weight="750">USER INTERFACE</text>
<text x="58" y="154" fill="#172644" font-size="19" font-weight="720">CAIPE Apps and Chat</text>
<text x="58" y="181" fill="#465978" font-size="15" font-weight="500">Open an eligible app</text>
<text x="58" y="200" fill="#465978" font-size="15" font-weight="500">Use its shared assistant panel</text>
<rect x="400" y="105" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="126" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="154" fill="#172644" font-size="19" font-weight="720">CAIPE host / backend</text>
<text x="418" y="181" fill="#465978" font-size="15" font-weight="500">Resolve app and caller policy</text>
<text x="418" y="200" fill="#465978" font-size="15" font-weight="500">Route requests and chat</text>
<rect x="760" y="105" width="264" height="110" rx="12" fill="#fff3df" stroke="#895209" stroke-width="1.4"/>
<text x="778" y="126" fill="#895209" font-size="12" font-weight="750">EXTERNAL</text>
<text x="778" y="154" fill="#172644" font-size="19" font-weight="720">Hosted app runtime</text>
<text x="778" y="181" fill="#465978" font-size="15" font-weight="500">Own the app UI and data</text>
<text x="778" y="200" fill="#465978" font-size="15" font-weight="500">Apply domain authorization</text>
<rect x="40" y="285" width="264" height="110" rx="12" fill="#def6ee" stroke="#14705c" stroke-width="1.4"/>
<text x="58" y="306" fill="#14705c" font-size="12" font-weight="750">STORE</text>
<text x="58" y="334" fill="#172644" font-size="19" font-weight="720">Installed app catalog</text>
<text x="58" y="361" fill="#465978" font-size="15" font-weight="500">Manifest, route policy,</text>
<text x="58" y="380" fill="#465978" font-size="15" font-weight="500">and assistant resource binding</text>
<rect x="400" y="285" width="264" height="110" rx="12" fill="#e9edff" stroke="#5243a9" stroke-width="1.4"/>
<text x="418" y="306" fill="#5243a9" font-size="12" font-weight="750">CAIPE SERVICE</text>
<text x="418" y="334" fill="#172644" font-size="19" font-weight="720">Host chat and assistant</text>
<text x="418" y="361" fill="#465978" font-size="15" font-weight="500">Resolve bound assistant</text>
<text x="418" y="380" fill="#465978" font-size="15" font-weight="500">Run with caller authorization</text>
<path d="M304,160 L400,160 M391.1,164.6 L400,160 L391.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="151" fill="#465978" font-size="12" font-weight="600">Open app</text>
<path d="M664,160 L760,160 M751.1,164.6 L760,160 L751.1,155.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="151" fill="#465978" font-size="12" font-weight="600">Proxy route</text>
<path d="M532,215 L532,285 M527.4,276.1 L532,285 L536.6,276.1" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542" y="252" fill="#465978" font-size="12" font-weight="600">Start chat</text>
<path d="M304,340 L400,340 M391.1,344.6 L400,340 L391.1,335.4" fill="none" stroke="#596b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="308" y="331" fill="#465978" font-size="12" font-weight="600">Resolve binding</text>
<line x1="40" x2="1024" y1="407" y2="407" stroke="#d5deef"/>
<text x="40" y="437" fill="#465978" font-size="15" font-weight="500">App SDK options can expose a checkbox in the host composer for an opted-in assistant.</text>
</g></svg>
