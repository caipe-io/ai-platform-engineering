# Dynamic Agents Seed Configuration
# Generated from caipe-preview Kubernetes cluster

# =============================================================================
# Available LLM Models
# =============================================================================

models:
  - description: Fast, efficient Claude 4.5 Haiku via AWS Bedrock
    model_id: global.anthropic.claude-haiku-4-5-20251001-v1:0
    name: Claude 4.5 Haiku (Bedrock)
    provider: aws-bedrock

  - description: Balanced performance Claude Sonnet 4 via AWS Bedrock
    model_id: global.anthropic.claude-sonnet-4-20250514-v1:0
    name: Claude Sonnet 4 (Bedrock)
    provider: aws-bedrock

  - description: Latest Claude Sonnet 4.5 via AWS Bedrock
    model_id: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    name: Claude Sonnet 4.5 (Bedrock)
    provider: aws-bedrock

  - description: GPT-4o via Azure OpenAI
    model_id: gpt-4o
    name: GPT-4o (Azure)
    provider: azure-openai

  - description: Fast, cost-effective GPT-4o Mini via Azure OpenAI
    model_id: gpt-4o-mini
    name: GPT-4o Mini (Azure)
    provider: azure-openai

# =============================================================================
# Seed MCP Servers
# =============================================================================
# Note: Production cluster endpoints below are disabled for local dev.
# Enable only for Kubernetes deployments where these services exist.

mcp_servers:
  - description: GitHub repositories and pull requests
    enabled: true
    endpoint: ${GITHUB_MCP_URL:-http://localhost:8082}
    id: github
    name: GitHub
    transport: http
    # Per-user GitHub OAuth token when connected; otherwise fall back to the
    # shared org PAT (GITHUB_PERSONAL_ACCESS_TOKEN) so the tools stay backward
    # compatible. AgentGateway rewrites X-CAIPE-Provider-Token into the upstream
    # Authorization: Bearer header.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: github
        target: header
        fallback_env: GITHUB_PERSONAL_ACCESS_TOKEN

  - description: GitLab repositories and merge requests
    enabled: true
    endpoint: ${GITLAB_MCP_URL:-http://localhost:18007/mcp}
    id: gitlab
    name: GitLab
    transport: http
    # Per-user GitLab OAuth token when connected; otherwise fall back to the
    # shared org PAT (GITLAB_PERSONAL_ACCESS_TOKEN). AgentGateway rewrites
    # X-CAIPE-Provider-Token into the upstream Authorization: Bearer header.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: gitlab
        target: header
        fallback_env: GITLAB_PERSONAL_ACCESS_TOKEN

  - description: ArgoCD application and deployment management
    enabled: true
    endpoint: ${ARGOCD_MCP_URL:-http://localhost:18002/mcp}
    id: argocd
    name: ArgoCD
    transport: http

  - description: Jira issue tracking and project management
    enabled: true
    endpoint: ${JIRA_MCP_URL:-http://localhost:18004/mcp}
    id: jira
    name: Jira
    transport: http
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: atlassian
        target: header

  - description: PagerDuty incident management
    enabled: true
    endpoint: ${PAGERDUTY_MCP_URL:-http://localhost:18006/mcp}
    id: pagerduty
    name: PagerDuty
    transport: http
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: pagerduty
        target: header

  - description: Webex meeting, transcript, and recording tools
    enabled: true
    endpoint: ${WEBEX_MEETINGS_MCP_URL:-http://localhost:18013/mcp}
    id: webex_meetings
    name: Webex Meetings
    transport: http
    # Resolve the caller's Webex Connected App token. AgentGateway keeps the
    # caller JWT in Authorization and rewrites this provider token into the
    # Authorization header sent to the Webex Meetings MCP backend.
    credential_sources:
      - kind: provider_connection
        name: X-CAIPE-Provider-Token
        provider: webex
        target: header

  - description: Knowledge Base tools
    enabled: true
    endpoint: ${RAG_SERVER_MCP_URL:-http://localhost:9446/mcp}
    id: knowledge-base
    name: Knowledge Base
    transport: http
    # The RAG server enforces its own Keycloak/OIDC auth on /mcp. Forward the
    # caller's user JWT (per-user RAG group RBAC); in non-user contexts (background
    # reconcile/probe) mint a caipe-platform service token. The gateway rewrites
    # X-CAIPE-Provider-Token into the upstream Authorization: Bearer header.
    credential_sources:
      - kind: caller_token
        name: X-CAIPE-Provider-Token
        target: header
        fallback_client_credentials: true

  - description: Reviewable platform configuration changes
    enabled: true
    endpoint: ${PLATFORM_MCP_URL:-http://localhost:18014/mcp}
    id: platform
    name: Platform
    transport: http
    credential_sources:
      - kind: initiator_token
        name: X-CAIPE-Initiator-Token
        target: header

# =============================================================================
# Seed Agents
# =============================================================================

agents: []
