[project]
name = "dynamic-agents"
version = "0.1.0"
description = "Dynamic Agent Builder - Standalone agent service with deepagents 0.6.8"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "deepagents==0.6.8",
    "langchain-mcp-adapters==0.3.2",
    "langgraph-checkpoint-mongodb==0.4.0",
    # LLM provider integrations, declared directly so this image can patch a
    # provider advisory without waiting on a third party's release. Add a
    # provider here only if this image serves it.
    "langchain==1.4.1",
    "langchain-core==1.6.3",
    "langchain-aws==1.5.0",
    "langchain-anthropic==1.4.6",
    "langchain-openai==1.6.2",
    "langchain-google-genai==4.4.0",
    "langchain-google-vertexai==3.2.4",
    "langchain-groq==1.1.3",
    # Tracing, replacing cnoe-agent-utils.TracingManager.
    "langfuse==3.15.0",
    "pymongo==4.16.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",

    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "jinja2==3.1.6",
    "prometheus-client==0.26.0",
    # JWKS-based JWT validation in dynamic_agents.auth.jwks_validate
    # (vendored from ai_platform_engineering.utils.auth so the DA image
    # does not need to install the entire shared package).
    "pyjwt[crypto]==2.13.0",
    # S3 attachment store (services/attachment_store.py) and the Bedrock
    # transport clients in services/llm_clients.py. Chosen by this package;
    # no longer held in lockstep with an external utility library.
    "boto3==1.43.16",
]

[project.optional-dependencies]
# Opt-in only, and deliberately not a default dependency. Selecting the
# `litellm` provider gives client-side routing across LiteLLM's provider set,
# at the cost of the capabilities that need provider-native clients: no
# Bedrock or Anthropic native prompt caching, and no shared transport clients.
# Most deployments wanting LiteLLM should point the `openai-compatible`
# provider at a LiteLLM Proxy instead -- no in-process dependency, and it is
# the only form that works for a sandboxed runtime.
litellm = ["langchain-litellm==0.8.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_agents"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.uv]
constraint-dependencies = ["click==8.5.0", "starlette==1.6.0"]
# No override-dependencies. langchain-anthropic is a direct dependency above, so
# GHSA-gr75-jv2w-4656 and anything after it is fixed by editing that pin.
