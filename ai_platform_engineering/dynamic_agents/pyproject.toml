[project]
name = "dynamic-agents"
version = "0.1.0"
description = "Dynamic Agent Builder - Standalone agent service with deepagents 0.6.8"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "deepagents==0.6.8",
    "langchain-mcp-adapters==0.3.2",
    "langgraph-checkpoint-mongodb==0.4.0",
    "cnoe-agent-utils==0.4.1",
    "pymongo==4.16.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",

    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "jinja2==3.1.6",
    "prometheus-client==0.26.0",
    # JWKS-based JWT validation in dynamic_agents.auth.jwks_validate
    # (vendored from ai_platform_engineering.utils.auth so the DA image
    # does not need to install the entire shared package).
    "pyjwt[crypto]==2.13.0",
    # S3 attachment store (services/attachment_store.py) uses boto3. Pinned to the
    # version cnoe-agent-utils resolves to so both share one boto3 in the workspace
    # lock; bump this in lockstep with cnoe-agent-utils when it moves.
    "boto3==1.43.16",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_agents"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.uv]
constraint-dependencies = ["click==8.5.0", "starlette==1.6.0", "langchain-aws==1.5.0"]
# cnoe-agent-utils 0.4.1 pins 1.4.3, which is affected by GHSA-gr75-jv2w-4656.
override-dependencies = ["langchain-anthropic==1.4.6"]
