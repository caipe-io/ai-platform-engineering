[project]
name = "dynamic-agents"
version = "0.1.0"
description = "Dynamic Agent Builder - Standalone agent service with deepagents 0.6.4"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.34.2",
    "deepagents==0.6.4",
    "langchain-mcp-adapters==0.2.1",
    "langgraph-checkpoint-mongodb==0.3.1",
    "cnoe-agent-utils==0.4.1",
    "pymongo==4.12.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",

    "requests==2.33.0",
    "beautifulsoup4==4.13.4",
    "jinja2==3.1.6",
    "prometheus-client==0.23.1",
    # JWKS-based JWT validation in dynamic_agents.auth.jwks_validate
    # (vendored from ai_platform_engineering.utils.auth so the DA image
    # does not need to install the entire shared package).
    # assisted-by Codex Codex-sonnet-4-6
    "pyjwt[crypto]==2.13.0",
    # S3 attachment store (services/attachment_store.py) uses boto3. Pinned to the
    # version cnoe-agent-utils resolves to so both share one boto3 in the workspace
    # lock; bump this in lockstep with cnoe-agent-utils when it moves.
    "boto3==1.43.16",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_agents"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff==0.15.5",
    "memray==1.19.3",
]

[tool.uv]
constraint-dependencies = ["click>=8.3.3", "starlette>=1.3.1", "langchain-aws==1.5.0"]
# cnoe-agent-utils 0.4.1 pins 1.4.3, which is affected by GHSA-gr75-jv2w-4656.
override-dependencies = ["langchain-anthropic==1.4.6"]
