[project]
name = "mcp-splunk"
version = "0.1.0"
description = "Splunk MCP Server"
readme = "README.md"
authors = [
    { name = "CAIPE Contributors" }
]
license = "Apache-2.0"
requires-python = ">=3.13,<4.0"
dependencies = [
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "pydantic==2.12.5",
  "mcp==1.28.1",
  "mcp-agent-auth", # gitleaks:allow - package name, not a credential
  "fastmcp==3.2.4",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "isort==6.0.1",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.11",
]

[tool.uv]
# Run from source (flat module layout: server.py at the project root). uv
# installs only the dependencies, not this project as a package.
package = false

[tool.uv.sources]
mcp-agent-auth = { path = "../common/mcp-auth", editable = true }

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.13"
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_no_return = true
