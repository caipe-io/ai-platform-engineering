[project]
name = "mcp-litellm"
version = "0.1.0"
description = "LiteLLM MCP Server"
license = "Apache-2.0"
authors = [
  { name = "CNOE", email = "cnoe@example.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "pydantic==2.13.4",
  "fastmcp==3.4.7",
]

[tool.uv]
# Run from source (flat module layout: server.py at the project root). uv
# installs only the dependencies, not this project as a package.
package = false
