[project]
name = "mcp-argocd"
version = "0.1.0"
description = "ArgoCD MCP Server"
license = "Apache-2.0"
authors = [
  { name = "Sri Aradhyula", email = "sraradhy@cisco.com" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastmcp==3.4.7",
  "httpx==0.28.1",
  "mcp-agent-auth", # gitleaks:allow - package name, not a credential
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
]

[tool.uv]
# Run from source (flat module layout: server.py, tools/, api/ at the project
# root). uv installs only the dependencies, not this project as a package.
package = false

[tool.uv.sources]
mcp-agent-auth = { path = "../common/mcp-auth", editable = true }
