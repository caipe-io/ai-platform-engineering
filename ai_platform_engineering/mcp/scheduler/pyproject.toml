[project]
name = "mcp_scheduler"
description = "Generic cron-schedule MCP for CAIPE dynamic agents. Wraps caipe-scheduler's REST API as MCP tools so any agent can register/list/cancel scheduled chat fires of itself or other agents."
authors = [
    { email = "suwhang@cisco.com" }
]
dynamic = [
    "version"
]
readme = "README.md"
keywords = ["scheduler", "cron", "mcp"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "click==8.5.0",
    "mcp==1.29.1",
    "mcp-agent-auth",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "fastmcp==3.4.7",
]

[tool.uv]
constraint-dependencies = ["uv==0.12.6"]

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff==0.16.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hatch==1.18.0",
]

[tool.uv.sources]
mcp-agent-auth = { path = "../common/mcp-auth", editable = true }

[tool.hatch.version]
path = "mcp_scheduler/__about__.py"

[project.scripts]
mcp-server-scheduler = "mcp_scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.build.targets.wheel]
packages = ["mcp_scheduler"]
