[project]
name = "mcp-agent-auth"
version = "0.1.0"
description = "Shared authentication middleware for MCP servers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "starlette==1.6.0",
    "pyjwt[crypto]==2.13.0",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "cryptography==50.0.1",
]
