[project]
name = "ai-platform-engineering-utils"
version = "0.2.0"
license = "Apache-2.0"
description = "Common utilities and base classes for AI Platform Engineering agents"
readme = "README.md"
authors = [
    {name = "CNOE Team", email = "info@cnoe.io"},
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "pymongo==4.16.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 140
indent-width = 2

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
]
ignore = ["F403"]

[tool.uv]
override-dependencies = ["protobuf==6.33.5"]
constraint-dependencies = ["pypdf==6.16.2"]
