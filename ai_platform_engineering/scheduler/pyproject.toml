[project]
name = "caipe-scheduler"
version = "0.1.0"
description = "Cron schedule registry + k8s CronJob orchestrator for CAIPE."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pymongo==4.16.0",
    "kubernetes==36.0.3",
    "croniter==6.2.4",
    "pytz==2026.3.post1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[project.scripts]
caipe-scheduler = "caipe_scheduler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caipe_scheduler"]

[tool.uv]
constraint-dependencies = ["starlette==1.6.0"]
