[project]
name = "agent-ontology"
version = "0.1.0"
description = "Ontology agent to generate relations between entities in the knowledge graph"
readme = "README.md"
authors = [
    { email = "subbaksh@cisco.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Core dependencies (includes langchain-openai via common)
    "common",
    "langgraph==1.2.11",
    "python-dotenv==1.2.2",
    "cnoe-agent-utils==0.4.1",
    "fastapi[standard]==0.141.1",
    "apscheduler==3.11.3",
    "bm25s==0.3.11",
    "rbloom==1.5.4",
    "langfuse==3.15.0",
    "langmem==0.0.30",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
constraint-dependencies = ["click==8.5.0"]

[tool.uv.sources]
common = { path = "../common" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 300
indent-width = 2

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F403"]
