[project]
name = "server"
version = "0.1.0"
description = "Server for the RAG agent that ingests documentation and entities for knowledge graph"
authors = [
    {name = "Rehan Agrawal", email = "rehagraw@cisco.com"},
    {name = "Shubham Bakshi", email = "subbaksh@cisco.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # LangChain ecosystem (versions must align with common's langchain-openai)
    "langchain-core==1.6.0",
    "langchain-text-splitters==1.1.2",
    "langchain-milvus==0.3.3",
    # Vector DB
    # 2.6.10+ exposes ConnectionManager aliases that langchain-milvus 0.3.3
    # cannot resolve through its remaining ORM Collection calls. Version 0.4
    # requires a coordinated Milvus 3 server and storage migration.
    "pymilvus==2.6.9",
    # Web framework
    "fastapi[standard]==0.141.1",
    "fastmcp==3.4.7",
    # HTTP clients
    "httpx==0.28.1",
    # Data processing
    "pyyaml==6.0.3",
    # Auth & utils
    "python-dotenv==1.2.2",
    "PyJWT[crypto]==2.13.0",
    "common",
    "pypdf==6.16.2",
]

[project.scripts]
run-server = "server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]
# HuggingFace local embeddings variant (~900MB additional due to PyTorch)
# Use the -hf image variant or install with: pip install server[huggingface]
huggingface = [
    # langchain-huggingface 1.2.2 supports Sentence Transformers 5.x.
    "sentence-transformers==5.7.0",
    "huggingface-hub==1.28.0",
    "common[huggingface]",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"


[tool.uv]
constraint-dependencies = ["mcp==1.29.1", "starlette==1.6.0", "transformers==5.16.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "requests==2.34.2",
    "ruff==0.16.4",
    "psutil==7.2.2",
    "memory-profiler==0.61.0",
]

[tool.uv.sources]
common = { path = "../common" }

[tool.ruff]
line-length = 300
indent-width = 2

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F403"]
