[project]
name = "ingestors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "subbaksh@cisco.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp==3.14.3",
    "aiohttp-retry==2.9.1",
    "beautifulsoup4==4.15.0",
    "boto3==1.43.16",
    "common",
    "kubernetes==36.0.3",
    "langchain-text-splitters==1.1.2",
    "lxml==6.1.2",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
    "redis==8.1.0",
    "requests==2.34.2",
    "scrapy==2.18.0",
    "slack-sdk==3.43.0",
    "twisted==26.4.0",
]

[project.optional-dependencies]
# Playwright for JavaScript rendering in webloader ingestor
# Adds ~1GB to image size (Chromium browser + dependencies)
playwright = [
    "scrapy-playwright==0.0.48",
    "playwright==1.62.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
ingestors = "ingestors:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 300
indent-width = 2

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F403"]

[tool.ruff.lint.per-file-ignores]
"src/ingestors/webloader/loader/scrapy_worker.py" = ["E402"]
"src/ingestors/webloader/loader/worker_pool.py" = ["E402"]
"tests/webloader/test_ingestor.py" = ["E402"]

[tool.uv]
constraint-dependencies = ["click==8.5.0", "urllib3==2.7.0"]
[tool.uv.sources]
common = { path = "../common" }
