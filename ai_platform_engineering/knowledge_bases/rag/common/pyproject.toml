[project]
name = "common"
version = "0.1.0"
description = "Common code for RAG"
readme = "README.md"
authors = [
    { email = "subbaksh@cisco.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp==3.14.3",
    "cymple==0.12.0",
    "neo4j==6.2.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "redis==8.1.0",
    # Embedding providers - lightweight API-based (always included)
    "langchain-openai==1.2.2",
    "langchain-aws==1.5.0",
    "langchain-cohere==0.6.0",
    "langchain-ollama==1.1.0",
]

[project.optional-dependencies]
# Heavy local embedding provider (~900MB due to PyTorch)
huggingface = [
    "langchain-huggingface==1.2.2",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 300
indent-width = 2

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F403"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
