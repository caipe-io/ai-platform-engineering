[project]
name = "caipe-slack-bot"
version = "0.4.0"
description = "CAIPE Slack Bot"
license = "Apache-2.0"
authors = [
  { name = "CAIPE Contributors" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "slack-bolt==1.30.0",
  "slack-sdk==3.43.0",
  "httpx==0.28.1",
  "requests==2.34.2",
  "loguru==0.7.3",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "pymongo==4.16.0",
  "pyjwt[crypto]==2.13.0",
]

[dependency-groups]
unittest = [
  "pytest==9.1.1",
  "pytest-mock==3.15.1",
]
dev = [
  "watchfiles==1.2.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
