[project]
name = "caipe-slack-bot"
version = "0.4.0"
description = "CAIPE Slack Bot"
license = "Apache-2.0"
authors = [
  { name = "CAIPE Contributors" }
]
requires-python = ">=3.13,<4.0"
dependencies = [
  "setuptools==83.0.0",
  "slack-bolt==1.27.0",
  "slack-sdk==3.41.0",
  "httpx==0.28.1",
  "requests==2.33.0",
  "loguru==0.7.3",
  "pydantic==2.12.5",
  "pyyaml==6.0.3",
  "pymongo==4.10.1",
  "pyjwt[crypto]==2.13.0",
]

[dependency-groups]
unittest = [
  "pytest==9.0.3",
  "pytest-mock==3.15.1",
]
dev = [
  "watchfiles==1.1.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
