[project]
name = "caipe-webex-bot"
version = "0.5.0"
description = "CAIPE Webex Bot"
license = "Apache-2.0"
authors = [
  { name = "CAIPE Contributors" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx==0.28.1",
  "requests==2.34.2",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "pymongo==4.16.0",
  "pyjwt[crypto]==2.13.0",
  "loguru==0.7.3",
  "aiohttp==3.14.3",
  "websockets==17.1",
]

[dependency-groups]
unittest = [
  "pytest==9.1.1",
  "pytest-mock==3.15.1",
]
dev = [
  "watchfiles==1.2.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
