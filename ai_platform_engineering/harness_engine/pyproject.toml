[project]
name = "caipe-harness-engine"
version = "0.1.0"
description = "Independent multi-harness control plane with durable reconnectable runs"
requires-python = ">=3.13,<4.0"
dependencies = [
    "boto3==1.43.16",
    "claude-agent-sdk==0.2.139",
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pymongo==4.19.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
deep-agents = ["dynamic-agents; python_version >= '3.14'"]
dev = [
    "httpx2==2.12.0",
    "mongomock==4.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_engine"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
dynamic-agents = { path = "../dynamic_agents", editable = true }
llm-wrapper = { path = "../llm_wrapper", editable = true }
