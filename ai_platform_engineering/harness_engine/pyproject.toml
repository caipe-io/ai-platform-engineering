[project]
name = "caipe-harness-engine"
version = "0.1.0"
description = "Independent multi-harness control plane with durable reconnectable runs"
requires-python = ">=3.13,<4.0"
dependencies = [
    "boto3==1.43.78",
    "claude-agent-sdk==0.2.139",
    "fastapi==0.135.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymongo==4.18.2",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "mongomock==4.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_engine"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
