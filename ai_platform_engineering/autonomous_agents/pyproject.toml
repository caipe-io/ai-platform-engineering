[project]
name = "autonomous-agents"
version = "0.1.0"
description = "Autonomous Agents - Schedule and trigger AI agents to run in the background"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "apscheduler==3.11.3",
    "boto3==1.43.16",
    "cnoe-agent-utils==0.4.1",
    "cryptography==50.0.1",
    "httpx==0.28.1",
    "motor==3.7.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "mongomock-motor==0.0.36",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # CI publishes coverage from the autonomous-agent test suite.
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_agents"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.uv]
# cnoe-agent-utils 0.4.1 pins 1.4.3, which is affected by GHSA-gr75-jv2w-4656.
override-dependencies = ["langchain-anthropic==1.4.6"]
constraint-dependencies = ["click==8.5.0"]
