---
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their own entries.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      # Grouping minor and patch updates for GitHub Actions
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
