name: 'Prepare Release'
description: >
  Updates all version files and generates changelog only for a stable release.
  Wraps update-version-files (already modifies all files with version + uv.lock) + commitizen changelog generation.
  Used by release-manual.yml and pr-version-bump.yml (for release/* → main PRs or commits).

inputs:
  version:
    description: 'Release version (e.g. 1.0.0 or 1.0.0-rc.1)'
    required: true

runs:
  using: "composite"
  steps:
    - name: 📦 Install commitizen
      shell: bash
      run: |
        uv tool install commitizen
        echo "✅ Installed commitizen"

    - name: 📝 Update all version files
      id: update-versions
      uses: ./.github/actions/update-version-files
      with:
        version: ${{ inputs.version }}

    - name: 📋 Generate changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "🔄 Generating changelog for $VERSION using commitizen..."
          cz changelog --unreleased-version "$VERSION"
          echo "✅ Generated changelog entry for $VERSION"
        else
          echo "⏭️ Skipping changelog generation for prerelease $VERSION"
          echo "   Prerelease tags are build inputs, not stable changelog entries."
        fi
        echo ""
        echo "📋 New changelog entry preview:"
        head -30 CHANGELOG.md
