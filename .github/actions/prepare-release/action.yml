name: 'Prepare Release'
description: >
  Updates all version files and generates changelog for a release version.
  Wraps update-version-files (already modifies all files with version + uv.lock) + commitizen changelog generation.
  Used by release-manual.yml and pr-version-bump.yml (for release/* → main PRs or commits).

inputs:
  version:
    description: 'Stable release version (e.g. 1.0.0)'
    required: true

runs:
  using: "composite"
  steps:
    - name: ✅ Validate stable release version
      uses: ./.github/actions/validate-release-tag
      with:
        version: ${{ inputs.version }}

    - name: 📦 Install commitizen
      shell: bash
      run: |
        uv tool install commitizen==4.19.3
        echo "✅ Installed commitizen"

    - name: 📝 Update all version files
      id: update-versions
      uses: ./.github/actions/update-version-files
      with:
        version: ${{ inputs.version }}

    - name: 📋 Generate changelog
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # A release PR may have prepared this entry before its stable tag exists.
        # Regenerate that entry so changes made after PR preparation are included.
        python - <<'PY'
        import os
        from pathlib import Path

        path = Path("CHANGELOG.md")
        if path.exists():
            heading, separator, body = path.read_text().partition("\n")
            if heading.startswith(f"## {os.environ['VERSION']} ("):
                path.write_text("## Unreleased" + separator + body)
        PY

        echo "🔄 Generating changelog for $VERSION using commitizen..."
        cz changelog --incremental --merge-prerelease --unreleased-version "$VERSION"
        echo "✅ Generated changelog entry for $VERSION"
        echo ""
        echo "📋 New changelog entry preview:"
        head -30 CHANGELOG.md
