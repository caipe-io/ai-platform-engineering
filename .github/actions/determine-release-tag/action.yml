name: 'Determine Release Tag'
description: >
  Determines the version tag for a CI build based on trigger type: a pushed
  tag (rc/final, or a historical -dev./-hotfix. tag), a manual dispatch
  input, or a push to main — which always resolves to the floating `canary`
  tag.

inputs:
  manual_tag:
    description: 'Tag version provided manually (from inputs.tag_version)'
    required: false
    default: ''

outputs:
  tag_version:
    description: 'The final determined tag version'
    value: ${{ steps.collect.outputs.tag_version }}
  is_final_release:
    description: 'Whether the resolved tag is a stable x.y.z release, eligible for latest'
    value: ${{ steps.collect.outputs.is_final_release }}

runs:
  using: "composite"
  steps:
    - name: 🏷️ Get Direct Tag (Tag Push)
      id: tag-push
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      env:
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        TAG="$REF_NAME"
        echo "🏷️ Tag push detected: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: 📝 Get Manual Tag (Workflow Dispatch)
      id: manual-run
      if: ${{ github.event_name == 'workflow_dispatch' }}
      shell: bash
      env:
        MANUAL_TAG: ${{ inputs.manual_tag }}
      run: |
        set -euo pipefail

        echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"

    - name: 🐤 Canary Tag (Main Push)
      id: main-push
      if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      shell: bash
      run: |
        echo "🐤 Push to main: canary"
        echo "tag=canary" >> "$GITHUB_OUTPUT"

    - name: 🏁 Collect Final Tag
      id: collect
      shell: bash
      env:
        TAG_PUSH_OUTPUT: ${{ steps.tag-push.outputs.tag }}
        MANUAL_RUN_OUTPUT: ${{ steps.manual-run.outputs.tag }}
        MAIN_PUSH_OUTPUT: ${{ steps.main-push.outputs.tag }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref }}
      run: |
        set -euo pipefail

        # Priority: Tag Push > Manual Input > Canary (main push)
        FINAL_TAG="$TAG_PUSH_OUTPUT"
        if [[ -z "$FINAL_TAG" ]]; then
          FINAL_TAG="$MANUAL_RUN_OUTPUT"
        fi
        if [[ -z "$FINAL_TAG" ]]; then
          FINAL_TAG="$MAIN_PUSH_OUTPUT"
        fi
        # A manual main build without a version follows the canary channel.
        if [[ -z "$FINAL_TAG" && "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "refs/heads/main" ]]; then
          FINAL_TAG=canary
        fi

        if [[ -n "$FINAL_TAG" ]] && [[ "$FINAL_TAG" != "canary" ]] && ! [[ "$FINAL_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+|-rc\.[0-9]+|-hotfix\.[0-9]+)?$ ]]; then
          echo "❌ Unexpected tag format: $FINAL_TAG"
          exit 1
        fi

        echo "Final determined tag: $FINAL_TAG"
        echo "tag_version=$FINAL_TAG" >> "$GITHUB_OUTPUT"
        IS_FINAL_RELEASE=false
        if [[ "$FINAL_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          IS_FINAL_RELEASE=true
        fi
        echo "is_final_release=$IS_FINAL_RELEASE" >> "$GITHUB_OUTPUT"
