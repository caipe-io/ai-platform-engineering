name: 'Update Version Files'
description: >
  Sets version + appVersion + local dependency refs in every Chart.yaml to
  the given version (lockstep — chart and app versions always match), updates
  pyproject.toml (x.y.z-hotfix.N becomes x.y.z+hotfix.N because PEP 440/uv
  rejects -hotfix.N), regenerates uv.lock, and updates docs site version
  strings.

inputs:
  version:
    description: 'Version string, e.g. 1.2.0, 1.2.0-rc.3, or a prebuild tag like 1.1.0-my-branch-4'
    required: true

outputs:
  final_version:
    description: 'The version used as the git tag (always equals the input version)'
    value: ${{ steps.write.outputs.final_version }}
  skip_commit:
    description: 'true if all files already matched the target version (no changes needed)'
    value: ${{ steps.write.outputs.skip_commit }}

runs:
  using: "composite"
  steps:
    - name: ⚙️ Install yq
      shell: bash
      env:
        YQ_VERSION: v4.53.3
        YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
      run: |
        set -euo pipefail

        curl -fsSL -o /tmp/yq \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
        echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
        sudo install -m 0755 /tmp/yq /usr/local/bin/yq
        yq --version

    - name: 📝 Write version files
      id: write
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        echo "📦 Input version: $VERSION"

        CHART_FILES=$(find charts -name "Chart.yaml" -type f | sort)
        if [[ -z "$CHART_FILES" ]]; then
          echo "❌ No Chart.yaml files found under charts/"
          exit 1
        fi

        echo "📋 Found Chart.yaml files:"
        echo "$CHART_FILES" | sed 's/^/  - /'

        LOCAL_CHART_NAMES=$(for f in $CHART_FILES; do yq '.name' "$f"; done | sort -u)

        PYPROJECT_VERSION="$VERSION"
        if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-hotfix\.([0-9]+)$ ]]; then
          PYPROJECT_VERSION="${BASH_REMATCH[1]}+hotfix.${BASH_REMATCH[2]}"
          echo "  📦 Python metadata version: $VERSION → $PYPROJECT_VERSION"
        fi

        # Update pyproject.toml
        sed -i "s/^version = \".*\"/version = \"$PYPROJECT_VERSION\"/" pyproject.toml
        UPDATED=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        if [[ "$UPDATED" != "$PYPROJECT_VERSION" ]]; then
          echo "❌ Failed to update pyproject.toml (got '$UPDATED')"
          exit 1
        fi
        echo "  ✅ pyproject.toml → $PYPROJECT_VERSION"

        # Update docs site version strings
        BARE_VERSION=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
        if [[ -f "docs/docusaurus.config.ts" ]]; then
          sed -i "s/label: '[^']*([Ll]atest)'/label: '$BARE_VERSION (Latest)'/" docs/docusaurus.config.ts
          echo "  ✅ docs/docusaurus.config.ts version label → $BARE_VERSION (Latest)"
        fi
        if [[ -f "docs/src/pages/index.tsx" ]]; then
          sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v$BARE_VERSION/g" docs/src/pages/index.tsx
          sed -i "s/--version [0-9]\+\.[0-9]\+\.[0-9]\+/--version $BARE_VERSION/g" docs/src/pages/index.tsx
          echo "  ✅ docs/src/pages/index.tsx version refs → $BARE_VERSION"
        fi

        # Regenerate uv.lock
        echo "  🔒 Regenerating uv.lock..."
        uv lock
        echo "  ✅ uv.lock regenerated"

        # Update ALL Chart.yaml: version + appVersion (lockstep)
        for CHART_FILE in $CHART_FILES; do
          yq -i ".version = \"$VERSION\"" "$CHART_FILE"
          yq -i ".appVersion = \"$VERSION\"" "$CHART_FILE"
          echo "  ✅ Updated $CHART_FILE (version + appVersion)"
        done

        # Update ALL local dependency version references
        echo ""
        echo "🔄 Updating local dependency version references to '$VERSION'..."

        for CHART_FILE in $CHART_FILES; do
          if yq -e '.dependencies' "$CHART_FILE" > /dev/null 2>&1; then
            for LOCAL_CHART in $LOCAL_CHART_NAMES; do
              yq -i "(.dependencies[] | select(.name == \"$LOCAL_CHART\" and .repository == null)).version = \"$VERSION\"" "$CHART_FILE" 2>/dev/null || true
              yq -i "(.dependencies[] | select(.name == \"$LOCAL_CHART\" and .repository != null and (.repository | test(\"^file://\")))).version = \"$VERSION\"" "$CHART_FILE" 2>/dev/null || true
            done
          fi
        done

        echo "✅ Full update complete"

        if git diff --quiet && git diff --cached --quiet; then
          echo "ℹ️ No changes detected after update — versions already match"
          echo "skip_commit=true" >> $GITHUB_OUTPUT
        else
          echo "skip_commit=false" >> $GITHUB_OUTPUT
        fi

        echo ""
        echo "final_version=$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Output final_version: $VERSION"
