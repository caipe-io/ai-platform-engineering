name: "[CI][Helm] Publish Helm Charts to GHCR"
description: "Publish Helm charts to GitHub Container Registry"

on:
  push:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:
    inputs:
      publish_all:
        description: 'Publish all charts (bypass change detection)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-version-bump:
    name: Check Chart Version Bump
    runs-on: ubuntu-latest
    if: (github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]') &&
      (github.event_name == 'pull_request')
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: 🔍 Check for chart changes and version bumps
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Checking for chart changes..."

          # Get the base branch (usually main or master)

          # Check if there are any changes in the charts directory
          CHART_CHANGES=$(git diff --name-only origin/$BASE_BRANCH...HEAD | grep "^charts/" || true)

          if [ -z "$CHART_CHANGES" ]; then
            echo "No changes in charts directory, skipping version check"
            exit 0
          fi

          echo "Changes detected in charts directory:"
          echo "$CHART_CHANGES"

          # Detect which charts have changes (excluding Chart.lock only changes)
          RAG_STACK_CHANGED=false
          AI_PLATFORM_CHANGED=false
          RAG_STACK_NEEDS_VERSION_BUMP=false
          AI_PLATFORM_NEEDS_VERSION_BUMP=false

          # Check rag-stack changes
          if echo "$CHART_CHANGES" | grep -q "^charts/rag-stack/"; then
            RAG_STACK_CHANGED=true
            echo "✅ rag-stack chart has changes"

            # Check if changes are more than just Chart.lock
            if echo "$CHART_CHANGES" | grep "^charts/rag-stack/" | grep -qv "Chart.lock$"; then
              RAG_STACK_NEEDS_VERSION_BUMP=true
              echo "  → Substantive changes detected (not just Chart.lock), version bump required"
            else
              echo "  → Only Chart.lock changed, version bump not required"
            fi
          fi

          # Check ai-platform-engineering changes
          if echo "$CHART_CHANGES" | grep -q "^charts/ai-platform-engineering/"; then
            AI_PLATFORM_CHANGED=true
            echo "✅ ai-platform-engineering chart has changes"

            # Check if changes are more than just Chart.lock
            if echo "$CHART_CHANGES" | grep "^charts/ai-platform-engineering/" | grep -qv "Chart.lock$"; then
              AI_PLATFORM_NEEDS_VERSION_BUMP=true
              echo "  → Substantive changes detected (not just Chart.lock), version bump required"
            else
              echo "  → Only Chart.lock changed, version bump not required"
            fi
          fi

          # Check version bump for rag-stack (only if substantive changes)
          if [ "$RAG_STACK_NEEDS_VERSION_BUMP" = true ]; then
            echo ""
            echo "Checking rag-stack version bump..."
            CURRENT_VERSION=$(grep "^version:" charts/rag-stack/Chart.yaml | awk '{print $2}')
            echo "Current version: $CURRENT_VERSION"

            # Check if chart exists in base branch
            if git show origin/$BASE_BRANCH:charts/rag-stack/Chart.yaml &>/dev/null; then
              git checkout origin/$BASE_BRANCH -- charts/rag-stack/Chart.yaml
              BASE_VERSION=$(grep "^version:" charts/rag-stack/Chart.yaml | awk '{print $2}')
              echo "Base version: $BASE_VERSION"

              git checkout HEAD -- charts/rag-stack/Chart.yaml

              if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
                echo "❌ Error: rag-stack chart has changes but version was not bumped!"
                echo "Please update the version in charts/rag-stack/Chart.yaml"
                exit 1
              else
                echo "✅ rag-stack version bumped from $BASE_VERSION to $CURRENT_VERSION"
              fi
            else
              echo "ℹ️  rag-stack is a new chart (doesn't exist in $BASE_BRANCH), skipping version bump check"
            fi
          fi

          # Check version bump for ai-platform-engineering (only if substantive changes)
          if [ "$AI_PLATFORM_NEEDS_VERSION_BUMP" = true ]; then
            echo ""
            echo "Checking ai-platform-engineering version bump..."
            CURRENT_VERSION=$(grep "^version:" charts/ai-platform-engineering/Chart.yaml | awk '{print $2}')
            echo "Current version: $CURRENT_VERSION"

            # Check if chart exists in base branch
            if git show origin/$BASE_BRANCH:charts/ai-platform-engineering/Chart.yaml &>/dev/null; then
              git checkout origin/$BASE_BRANCH -- charts/ai-platform-engineering/Chart.yaml
              BASE_VERSION=$(grep "^version:" charts/ai-platform-engineering/Chart.yaml | awk '{print $2}')
              echo "Base version: $BASE_VERSION"

              git checkout HEAD -- charts/ai-platform-engineering/Chart.yaml

              if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
                echo "❌ Error: ai-platform-engineering chart has changes but version was not bumped!"
                echo "Please update the version in charts/ai-platform-engineering/Chart.yaml"
                exit 1
              else
                echo "✅ ai-platform-engineering version bumped from $BASE_VERSION to $CURRENT_VERSION"
              fi
            else
              echo "ℹ️  ai-platform-engineering is a new chart (doesn't exist in $BASE_BRANCH), skipping version bump check"
            fi
          fi

          echo ""
          echo "✅ All version checks passed!"

  publish:
    name: Push Helm Charts to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Publish on merge to main or workflow_dispatch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.0

      - name: 🔐 Login to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: 🔍 Detect Changed Charts
        id: detect
        env:
          PUBLISH_ALL: ${{ github.event.inputs.publish_all }}
        run: |
          # Check if publish_all is set (workflow_dispatch)

          if [[ "$PUBLISH_ALL" == "true" ]]; then
            echo "📦 publish_all=true, will publish all charts"
            echo "rag-stack-changed=true" >> $GITHUB_OUTPUT
            echo "ai-platform-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Detect which charts have changes compared to previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          # If no diff available (e.g., workflow_dispatch without publish_all), publish all
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "📦 No diff available, will publish all charts"
            echo "rag-stack-changed=true" >> $GITHUB_OUTPUT
            echo "ai-platform-changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed files in this push:"
          echo "$CHANGED_FILES"

          # Check which charts changed
          RAG_STACK_CHANGED=false
          AI_PLATFORM_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q "^charts/rag-stack/"; then
            RAG_STACK_CHANGED=true
            echo "✅ rag-stack chart has changes"
          fi

          if echo "$CHANGED_FILES" | grep -q "^charts/ai-platform-engineering/"; then
            AI_PLATFORM_CHANGED=true
            echo "✅ ai-platform-engineering chart has changes"
          fi

          echo "rag-stack-changed=$RAG_STACK_CHANGED" >> $GITHUB_OUTPUT
          echo "ai-platform-changed=$AI_PLATFORM_CHANGED" >> $GITHUB_OUTPUT

      - name: 📦 Package rag-stack Chart
        if: steps.detect.outputs.rag-stack-changed == 'true'
        run: |
          echo "📦 Packaging rag-stack..."

          # Check if version changed
          CURRENT_VERSION=$(grep "^version:" charts/rag-stack/Chart.yaml | awk '{print $2}')
          echo "Current version: $CURRENT_VERSION"

          REGISTRY="oci://ghcr.io/${{ github.repository_owner }}/charts"
          if helm pull $REGISTRY/rag-stack --version $CURRENT_VERSION --destination /tmp 2>/dev/null; then
            echo "⏭️  rag-stack:$CURRENT_VERSION already published, skipping"
            echo "rag-stack-skip=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "✅ Version $CURRENT_VERSION not published yet, proceeding with package"

          mkdir -p ./packaged-charts
          helm dependency update charts/rag-stack/
          helm package charts/rag-stack/ --destination ./packaged-charts/

          echo "✅ rag-stack packaged successfully"

      - name: 📦 Package ai-platform-engineering Chart
        if: steps.detect.outputs.ai-platform-changed == 'true'
        run: |
          echo "📦 Packaging ai-platform-engineering..."

          mkdir -p ./packaged-charts

          # CRITICAL: Always update rag-stack dependencies first
          # ai-platform-engineering depends on rag-stack, which depends on neo4j and milvus
          # These external dependencies must be downloaded regardless of path changes
          echo "Updating rag-stack dependencies..."
          helm dependency update charts/rag-stack/

          echo "Updating ai-platform-engineering dependencies..."
          helm dependency update charts/ai-platform-engineering/

          helm package charts/ai-platform-engineering/ --destination ./packaged-charts/

          # Verify dependencies are packaged correctly
          echo "🔍 Verifying rag-stack dependencies..."
          if tar -tzf charts/ai-platform-engineering/charts/rag-stack-*.tgz | grep -q "^rag-stack/charts/neo4j/Chart.yaml"; then
            echo "✅ neo4j dependency verified"
          else
            echo "❌ ERROR: neo4j missing from rag-stack package"
            exit 1
          fi

          if tar -tzf charts/ai-platform-engineering/charts/rag-stack-*.tgz | grep -q "^rag-stack/charts/milvus/Chart.yaml"; then
            echo "✅ milvus dependency verified"
          else
            echo "❌ ERROR: milvus missing from rag-stack package"
            exit 1
          fi

          echo "✅ ai-platform-engineering packaged successfully with all dependencies"

      - name: 🚀 Push Charts to GHCR
        run: |
          REGISTRY="oci://ghcr.io/${{ github.repository_owner }}/charts"

          echo "📦 Pushing charts to $REGISTRY"

          for CHART_FILE in ./packaged-charts/*.tgz; do
            if [ -f "$CHART_FILE" ]; then
              CHART_NAME=$(helm show chart "$CHART_FILE" | grep '^name:' | awk '{print $2}')
              CHART_VERSION=$(helm show chart "$CHART_FILE" | grep '^version:' | awk '{print $2}')

              echo ""
              echo "Processing $CHART_NAME:$CHART_VERSION"

              # Check if this version already exists
              if helm pull $REGISTRY/$CHART_NAME --version $CHART_VERSION --destination /tmp 2>/dev/null; then
                echo "⚠️  $CHART_NAME:$CHART_VERSION already exists in registry, skipping push"
                echo "If you intended to update the chart, please bump the version in charts/$CHART_NAME/Chart.yaml"
              else
                echo "✅ $CHART_NAME:$CHART_VERSION does not exist, proceeding with push"
                helm push "$CHART_FILE" $REGISTRY
                echo "🎉 Successfully pushed $CHART_NAME:$CHART_VERSION to $REGISTRY"
              fi
            fi
          done