name: Presentation MCP checks and prebuild
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ai_platform_engineering/mcp/presentations/**
      - charts/mcp-presentations/**
      - .github/workflows/ci-presentations.yml
permissions:
  contents: read
concurrency:
  group: presentations-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.15
        ports: ['27018:27017']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai_platform_engineering/mcp/presentations/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ai_platform_engineering/mcp/presentations
      - run: npm test
        working-directory: ai_platform_engineering/mcp/presentations
        env:
          PRESENTATION_TEST_MONGO: '1'
      - run: node ui/app-sdk/bin/check-manifest.mjs ai_platform_engineering/mcp/presentations/deploy/app.json
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Authenticate registry for same-repository prebuilds
        if: startsWith(github.head_ref, 'prebuild/') && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ai_platform_engineering/mcp/presentations
          file: ai_platform_engineering/mcp/presentations/Dockerfile
          push: ${{ startsWith(github.head_ref, 'prebuild/') && github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/mcp-presentations:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=presentations
          cache-to: type=gha,mode=max,scope=presentations
