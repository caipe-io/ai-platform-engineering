name: "[Tests] PR Size Labels"

on:
  pull_request:
    paths:
      - .github/pr-size/**
      - .github/workflows/pr-size-label*.yml
  push:
    branches: [main]
    paths:
      - .github/pr-size/**
      - .github/workflows/pr-size-label*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test sizing and labeling with mocked GitHub API
        run: node --test .github/pr-size/*.test.js
