name: "[CI] Harness Engine Build and Push"

on:
  push:
    branches: [main]
    tags: ['**']
    paths:
      - ai_platform_engineering/harness_engine/**
      - ai_platform_engineering/dynamic_agents/**
      - ai_platform_engineering/llm_wrapper/**
      - deploy/harness-engine/**
      - .github/workflows/ci-harness-engine.yml
      - .github/actions/publish-prebuild-manifest/**
  pull_request:
    paths:
      - ai_platform_engineering/harness_engine/**
      - ai_platform_engineering/dynamic_agents/**
      - ai_platform_engineering/llm_wrapper/**
      - deploy/harness-engine/**
      - .github/workflows/ci-harness-engine.yml
      - .github/actions/publish-prebuild-manifest/**
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Optional release tag; otherwise publish only the source SHA'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: harness-containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.result.outputs.tag }}
      publish: ${{ steps.result.outputs.publish }}
      revision: ${{ steps.result.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}
      - id: prebuild
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'prebuild/')
        uses: ./.github/actions/prebuild-version
        with:
          head_ref: ${{ github.head_ref }}
          base_ref: ${{ github.base_ref }}
          base_sha: ${{ github.event.pull_request.base.sha }}
      - id: result
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_version }}
          PREBUILD_TAG: ${{ steps.prebuild.outputs.prebuild_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          tag="${PREBUILD_TAG:-${RELEASE_TAG:-sha-$revision}}"
          publish=false
          if [[ "$EVENT_NAME" != pull_request || -n "$PREBUILD_TAG" ]]; then publish=true; fi
          printf 'tag=%s\npublish=%s\nrevision=%s\n' "$tag" "$publish" "$revision" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.14'
      - name: Validate backend contracts
        working-directory: ai_platform_engineering/harness_engine
        run: |
          uv sync --frozen --extra dev
          uv run ruff check src tests
          uv run pytest -q

  images:
    needs: [metadata, tests]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [harness-engine, harness-engine-deep, claude-acp-worker, claude-cli-acp-worker, worker-egress]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.metadata.outputs.revision }}
          persist-credentials: false
      - id: target
        env:
          TARGET: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            harness-engine) suffix='' ;;
            harness-engine-deep) suffix=.deep-agents ;;
            claude-acp-worker) suffix=.claude-acp ;;
            claude-cli-acp-worker) suffix=.claude-cli-acp ;;
            worker-egress) suffix=.worker-egress ;;
            *) exit 1 ;;
          esac
          {
            echo "dockerfile=ai_platform_engineering/harness_engine/build/Dockerfile$suffix"
            echo "image=ghcr.io/${OWNER,,}/caipe-$TARGET"
            echo "tag=ghcr.io/${OWNER,,}/caipe-$TARGET:sha-$REVISION-$ARCH"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ steps.target.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.revision }}
          cache-from: type=gha,scope=harness-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=harness-${{ matrix.image }}-${{ matrix.arch }}
      - name: Smoke test with release container restrictions
        env:
          IMAGE: ${{ steps.target.outputs.tag }}
          TARGET: ${{ matrix.image }}
        run: bash deploy/harness-engine/smoke-image.sh "$IMAGE" "$TARGET"
      - name: Verify worker network boundary
        if: matrix.image == 'worker-egress'
        env:
          IMAGE: ${{ steps.target.outputs.tag }}
        run: bash deploy/harness-engine/test-worker-network.sh "$IMAGE"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: needs.metadata.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested architecture image
        if: needs.metadata.outputs.publish == 'true'
        env:
          IMAGE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          digest=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest##*@sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.metadata.outputs.publish == 'true'
        with:
          name: harness-${{ matrix.image }}--${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    needs: [metadata, images]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [harness-engine, harness-engine-deep, claude-acp-worker, claude-cli-acp-worker, worker-egress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.metadata.outputs.revision }}
          persist-credentials: false
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ matrix.image }}
        run: echo "repository=ghcr.io/${OWNER,,}/caipe-$TARGET" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/publish-prebuild-manifest
        with:
          artifact_pattern: harness-${{ matrix.image }}--*
          image_repository: ${{ steps.image.outputs.repository }}
          image_ref: ${{ steps.image.outputs.repository }}:${{ needs.metadata.outputs.tag }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ github.token }}
      - name: Publish source tag and stable latest alias
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:sha-$REVISION" "$IMAGE:$TAG"
          if [[ "$REF_TYPE" == tag && "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$TAG"
          fi
          docker buildx imagetools inspect "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

  notify-release:
    needs: [metadata, images, manifests]
    if: always() && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Notify release gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGES_RESULT: ${{ needs.images.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 0; fi
          conclusion=failure
          if [[ "$IMAGES_RESULT" == success && "$MANIFESTS_RESULT" == success ]]; then conclusion=success; fi
          jq -n --arg tag "$TAG" --arg workflow "$WORKFLOW" --arg conclusion "$conclusion" \
            '{event_type:"ci-completed",client_payload:{tag:$tag,workflow:$workflow,conclusion:$conclusion}}' \
            | gh api --method POST "/repos/$REPOSITORY/dispatches" --input -
