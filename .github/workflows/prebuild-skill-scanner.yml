name: "[Prebuild] Skill Scanner Docker Build and Push"
description: "Build and push Skill Scanner Docker image for prebuild branches"

# Mirrors prebuild-caipe-ui.yml. The skill-scanner image is referenced by the
# `skill-scanner` Helm subchart (charts/ai-platform-engineering/charts/skill-scanner)
# but, until this workflow landed, it had no per-PR build pipeline at all —
# `ghcr.io/<owner>/skill-scanner:<branch>-<count>` simply didn't exist
# for prebuild branches, so reviewers had to build locally to test scanner
# changes against the chart. This workflow closes that gap.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prebuild-skill-scanner.yml'
      - '.github/actions/prebuild-status/**'
      - '.github/actions/publish-prebuild-manifest/**'
      # Build only when something the image actually packages changes:
      #   - the Dockerfile itself (base image, pinned scanner version, etc.)
      # Note: there is no first-party scanner source in this repo — the image
      # installs `cisco-ai-skill-scanner` from PyPI — so we don't need a
      # source path watcher here the way prebuild-caipe-ui.yml watches `ui/**`.
      - 'build/Dockerfile.skill-scanner'
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to publish prebuild for'
        required: true
        type: number
      head_ref:
        description: 'PR head branch ref'
        required: true
        type: string
      head_sha:
        description: 'PR head commit SHA'
        required: true
        type: string
      base_ref:
        description: 'PR base branch ref'
        required: true
        type: string
      base_sha:
        description: 'PR base commit SHA'
        required: false
        type: string
        default: ''

env:
  IMAGE_NAME: ${{ github.repository_owner }}/skill-scanner

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    if: |
      (github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]') &&
      (
        startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
        github.event.action != 'closed'
      )
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit


      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo apt-get remove -y '^ghc-*' || true
          sudo apt-get remove -y '^dotnet-*' || true
          sudo apt-get remove -y '^llvm-*' || true
          sudo apt-get remove -y 'php*' || true
          sudo apt-get remove -y azure-cli google-cloud-cli hhvm google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute prebuild tag
        id: compute_tag
        shell: bash
        env:
          BRANCH: ${{ inputs.head_ref || github.head_ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          BRANCH_NO_PREFIX="${BRANCH#prebuild/}"
          BRANCH_SANITIZED="${BRANCH_NO_PREFIX//\//-}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BASE_SHA"
          else
            BASE_COMMIT="origin/${BASE_REF}"
          fi
          COMMIT_COUNT=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          echo "BRANCH_BARE=${BRANCH_SANITIZED}" >> $GITHUB_ENV
          echo "PREBUILD_TAG=${BRANCH_SANITIZED}-${COMMIT_COUNT}" >> $GITHUB_ENV
          echo "prebuild_tag=${BRANCH_SANITIZED}-${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Read pinned upstream scanner version
        id: scanner_version
        shell: bash
        run: |
          # Honour the same default Dockerfile.skill-scanner uses (ARG default).
          # Surfacing it as a build-arg keeps prebuild tags reproducible — when
          # the Dockerfile bumps the pin, the prebuild image picks it up
          # without an extra workflow edit.
          PINNED=$(awk -F= '/^ARG SKILL_SCANNER_VERSION=/ {gsub(/[" ]/,"",$2); print $2; exit}' build/Dockerfile.skill-scanner)
          if [[ -z "$PINNED" ]]; then
            echo "❌ Could not parse SKILL_SCANNER_VERSION default from build/Dockerfile.skill-scanner"
            exit 1
          fi
          echo "SKILL_SCANNER_VERSION=${PINNED}" >> $GITHUB_ENV
          echo "Resolved upstream scanner version: ${PINNED}"

      - name: Upload building prebuild status
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.head_ref }}
          source: skill-scanner
          type: docker
          name: skill-scanner
          repository: ghcr.io/${{ env.IMAGE_NAME }}
          tag: ${{ steps.compute_tag.outputs.prebuild_tag }}
          ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          status: building
          artifact_suffix: start

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PREBUILD_TAG }}

      - name: Build and push Skill Scanner image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./build/Dockerfile.skill-scanner
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.cnoe.prebuild.branch=${{ env.BRANCH_BARE }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=prebuild-skill-scanner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prebuild-skill-scanner-${{ matrix.arch }}
          build-args: |
            SKILL_SCANNER_VERSION=${{ env.SKILL_SCANNER_VERSION }}
            BUILDKIT_INLINE_CACHE=1
            IMAGE_TAG=${{ env.PREBUILD_TAG }}
            GIT_COMMIT=${{ inputs.head_sha || github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-skill-scanner--${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: |
      always() &&
      (github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]') &&
      startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
      github.event.action != 'closed'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Compute prebuild tag
        id: compute_tag
        shell: bash
        env:
          HEAD_REF: ${{ inputs.head_ref || github.head_ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          BRANCH_NO_PREFIX="${HEAD_REF#prebuild/}"
          BRANCH_SANITIZED="${BRANCH_NO_PREFIX//\//-}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BASE_SHA"
          else
            BASE_COMMIT="origin/${BASE_REF}"
          fi
          COMMIT_COUNT=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          echo "prebuild_tag=${BRANCH_SANITIZED}-${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-architecture image
        id: publish
        uses: ./.github/actions/publish-prebuild-manifest
        with:
          artifact_pattern: digests-skill-scanner--*
          image_repository: ghcr.io/${{ env.IMAGE_NAME }}
          image_ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ github.token }}

      - name: Upload final prebuild status
        if: ${{ always() && steps.compute_tag.outputs.prebuild_tag != '' }}
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.head_ref }}
          source: skill-scanner
          type: docker
          name: skill-scanner
          repository: ghcr.io/${{ env.IMAGE_NAME }}
          tag: ${{ steps.compute_tag.outputs.prebuild_tag }}
          ref: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          status: ${{ steps.publish.outcome == 'success' && 'published' || 'failed' }}
          artifact_suffix: final
