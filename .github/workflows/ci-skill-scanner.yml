name: "[CI] Skill Scanner Build and Push"
description: "Build and push Skill Scanner Docker image"

# Mirrors ci-caipe-ui.yml. Triggers on:
#   - tag pushes (any tag): build + push the released image used by the
#     skill-scanner Helm subchart (image tag = chart appVersion).
#   - pull requests touching the scanner Dockerfile:
#     PR validation only (push=false except for tags / workflow_dispatch).
#   - workflow_dispatch: manual rebuild with an explicit tag override.
#
# All image tags publish to ghcr.io/<owner>/skill-scanner, matching the parent
# chart's image repository. -chart.N tags skip image work entirely.
#
# This workflow notifies release-finalize.yml via repository_dispatch so the
# gating logic in release-finalize.yml's REQUIRED_WORKFLOWS can include it.

on:
  push:
    tags:
      - '**'
  pull_request:
    paths:
      # No first-party scanner source lives in this repo (the image installs
      # `cisco-ai-skill-scanner` from PyPI), so we only need to validate when
      # the Dockerfile changes.
      - 'build/Dockerfile.skill-scanner'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag to apply (e.g., 0.4.5-dev.5)'
        required: false
        type: string
      force_build:
        description: 'Force a fresh build of all components (bypass change-detection). Use for coordinated releases.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.set-outputs.outputs.should_build }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      scanner_version: ${{ steps.scanner_version.outputs.scanner_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Determine Tag
        id: version
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            scanner:
              - 'build/Dockerfile.skill-scanner'

      - name: Read pinned upstream scanner version
        id: scanner_version
        shell: bash
        run: |
          # Surface the Dockerfile's pinned ARG default as a workflow output so
          # both build jobs (and the release-comment / SBOM tooling later, if
          # we add it) reference one source of truth.
          PINNED=$(awk -F= '/^ARG SKILL_SCANNER_VERSION=/ {gsub(/[" ]/,"",$2); print $2; exit}' build/Dockerfile.skill-scanner)
          if [[ -z "$PINNED" ]]; then
            echo "❌ Could not parse SKILL_SCANNER_VERSION default from build/Dockerfile.skill-scanner"
            exit 1
          fi
          echo "scanner_version=${PINNED}" >> $GITHUB_OUTPUT
          echo "Resolved upstream scanner version: ${PINNED}"

      - name: Set Outputs
        id: set-outputs
        env:
          SCANNER_CHANGED: ${{ steps.filter.outputs.scanner }}
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          SHOULD_BUILD="false"
          TAG_VERSION="${{ env.TAG_VERSION }}"

          # Chart-only tag: skip image builds entirely (mirrors ci-caipe-ui.yml)
          if [[ "$TAG_VERSION" =~ -chart\.[0-9]+$ ]]; then
            echo "📊 Chart-only tag: skipping image builds"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$FORCE_BUILD" == "true" ]; then
            SHOULD_BUILD="true"
            echo "🔁 force_build requested: building fresh regardless of changes"
          elif [ -n "$TAG_VERSION" ]; then
            SHOULD_BUILD="true"
            echo "🏷️ Tag push: building fresh"
          elif [ "$SCANNER_CHANGED" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHOULD_BUILD="true"
            echo "📦 Scanner files changed or manual trigger: building"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "Outputs: build=$SHOULD_BUILD"

  # Build natively per-platform (no QEMU) and push by digest only;
  # merge-manifests combines the per-arch digests into the final tagged
  # multi-arch manifest list. See ci-rag.yml for the incident this pattern
  # was introduced to fix (QEMU-emulated arm64 timing out/OOMing).
  build-and-push:
    runs-on: ${{ matrix.runner }}
    needs: determine-changes
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'prebuild/'))
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/skill-scanner
      DOCKERFILE: build/Dockerfile.skill-scanner

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-packages: write

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo apt-get remove -y '^ghc-*' || true
          sudo apt-get remove -y '^dotnet-*' || true
          sudo apt-get remove -y '^llvm-*' || true
          sudo apt-get remove -y 'php*' || true
          sudo apt-get remove -y azure-cli google-cloud-cli hhvm google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}
          build-args: |
            SKILL_SCANNER_VERSION=${{ needs.determine-changes.outputs.scanner_version }}
            BUILDKIT_INLINE_CACHE=1
            IMAGE_TAG=${{ needs.determine-changes.outputs.tag_version || github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single tagged multi-arch manifest list.
  merge-manifests:
    runs-on: ubuntu-latest
    needs: [determine-changes, build-and-push]
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/skill-scanner
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Notify release-finalize workflow when this CI completes. Mirrors
  # ci-caipe-ui.yml's notify-release; the matching gating entry lives in
  # release-finalize.yml's REQUIRED_WORKFLOWS list.
  notify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for repository_dispatch via gh api
    needs: [determine-changes, build-and-push, merge-manifests]
    if: |
      always() &&
      needs.determine-changes.outputs.tag_version != '' &&
      !contains(needs.determine-changes.outputs.tag_version, '-')
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: 🔔 Notify release finalize
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_VERSION: ${{ needs.determine-changes.outputs.tag_version }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          MERGE_RESULT="${{ needs.merge-manifests.result }}"

          if [[ "$BUILD_RESULT" == "skipped" ]]; then BUILD_RESULT="success"; fi
          if [[ "$MERGE_RESULT" == "skipped" ]]; then MERGE_RESULT="success"; fi

          if [[ "$BUILD_RESULT" == "success" && "$MERGE_RESULT" == "success" ]]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          echo "🔔 Notifying release-finalize: tag=$TAG_VERSION, conclusion=$CONCLUSION"

          gh api /repos/${{ github.repository }}/dispatches --input - <<EOF
          {
            "event_type": "ci-completed",
            "client_payload": {
              "tag": "$TAG_VERSION",
              "workflow": "$WORKFLOW_NAME",
              "conclusion": "$CONCLUSION"
            }
          }
          EOF
