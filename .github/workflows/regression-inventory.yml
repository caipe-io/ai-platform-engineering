name: "[Check] Regression Inventory"

on:
  pull_request:
    paths:
      - "ui/src/app/**"
      - "docs/docs/development/caipe-regression-*.md"
      - "scripts/validate-regression-inventory*.mjs"
      - "scripts/render-regression-report*.mjs"
      - "docs/docs/development/regression-report-artifacts.md"
      - "docs/examples/regression-report.json"
      - ".github/workflows/regression-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - name: Test inventory validation
        run: node --test scripts/validate-regression-inventory.test.mjs
      - name: Compare source routes and feature mappings
        run: node scripts/validate-regression-inventory.mjs
      - name: Test report contract and release artifacts
        run: node --test scripts/render-regression-report.test.mjs
      - name: Render the fictional example
        run: node scripts/render-regression-report.mjs --input docs/examples/regression-report.json --output /tmp/example-run/report.html
