name: "[CI] External App Examples"
description: "Test and containerize opt-in External App reference runtimes"

on:
  pull_request:
    paths:
      - "ui/examples/external-apps/**"
      - ".github/workflows/ci-external-app-examples.yml"
  push:
    branches:
      - main
    paths:
      - "ui/examples/external-apps/**"
      - ".github/workflows/ci-external-app-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Test Weather example
        working-directory: ui
        run: npm run test:external-app-examples

      - name: Build Weather example container
        working-directory: ui
        run: docker build --file examples/external-apps/weather/Dockerfile --tag weather-example:test examples/external-apps/weather

      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail
          WEATHER_TEST_SECRET="$(openssl rand -hex 32)"
          docker run --detach --rm --name weather-example-test \
            --publish 127.0.0.1:3020:3020 \
            --env AGENTIC_APP_TOKEN_SECRET="$WEATHER_TEST_SECRET" \
            weather-example:test
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3020/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs weather-example-test
          exit 1

      - name: Stop Weather example
        if: always()
        run: docker rm --force weather-example-test || true
