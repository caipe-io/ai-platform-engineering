---
name: "Grype Scan"
# Anchore Grype vulnerability scan: filesystem on all events and released
# containers on demand. GitHub Code Scanning PR diff mode is the blocking gate.

# assisted-by Codex Codex-sonnet-4-6

# Trigger matrix:
#   pull_request / push to main  → filesystem scan only; fail-build: false — GitHub Code Scanning
#                                  PR diff mode is the gate (only NEW alerts block the PR)
#   workflow_dispatch            → filesystem scan + release container images, fail-build: false
#
# Why fail-build: false everywhere?
#   Grype's fail-build hard-fails on any CVE at or above severity-cutoff, including CVEs in
#   upstream libraries that have no available fix yet. That forces contributors to take the
#   blame for vulnerabilities they didn't introduce and can't resolve.
#
#   GitHub Code Scanning's PR diff mode only surfaces alerts that are *new* in the PR — CVEs
#   already present on the base branch (e.g., in a transitive dep that predates the PR) are
#   silently excluded from the PR check. This means:
#     - A PR that introduces a new vulnerable dependency → new alert → PR blocked
#     - An upstream CVE already present on main → not new → PR not blocked, alert visible in
#       the Security tab so maintainers can track and upgrade when a fix is released
#
#   To activate this: require the "Code scanning results / Grype" check under
#   Settings → Branches → Branch protection rules for main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to scan (e.g. 0.2.3)"
        required: true
        type: string

permissions:
  contents: read
  security-events: write  # required to upload SARIF to GitHub Code Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      # Fork-triggered pull_request runs never receive repository secrets and
      # their GITHUB_TOKEN is read-only, so security-events: write is
      # unavailable. Dependabot PRs from this repository do receive the
      # workflow permission above, so use the built-in token for those runs
      # instead of a secret-backed GitHub App token. Detect external forks and
      # skip only their SARIF upload, but still run the scan itself so
      # contributors get results in the job log.
      - name: 🔍 Determine fork status
        id: fork-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}

      - name: Resolve scanned revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Grype scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          path: "."
          fail-build: false  # Gate is GitHub Code Scanning PR diff — see top-level comment
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && steps.scan.outcome == 'success' && steps.scan.outputs.sarif != '' && steps.fork-check.outputs.is_fork != 'true' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          # Keep this stable as "grype": GitHub Code Scanning correlates SARIF
          # by category, and renaming it leaves old alerts orphaned.
          category: "grype"
          # On pull_request events the default checkout produces a merge commit
          # (refs/pull/N/merge), but GitHub Code Scanning PR checks require the
          # analysis to be associated with refs/pull/N/head + the head commit SHA.
          # Without this, the check shows "1 configuration not found" because the
          # merge-ref analysis is not matched against the PR head check run.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.ref }}
          sha: ${{ steps.revision.outputs.sha }}
          token: ${{ github.token }}

      - name: ℹ️ Note SARIF upload skipped for fork PR
        if: ${{ always() && steps.fork-check.outputs.is_fork == 'true' }}
        run: |
          echo "::notice::This PR is from a fork, so results can't be uploaded to GitHub Code Scanning (that needs security-events: write, unavailable to fork-triggered pull_request runs). The Grype scan above still ran — see its output for findings. A maintainer can re-run this workflow after merge to get code-scanning annotations."

  release-config:
    name: Resolve release image list
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Read release components
        id: images
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(Path(".github/agents.json").read_text())
          agents = config["mcp_agents"]
          rag = config["rag_components"]
          for components in (agents, rag):
              if not isinstance(components, list) or not all(
                  isinstance(name, str) and re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name)
                  for name in components
              ):
                  raise ValueError("Invalid release component list")
          images = ["caipe-ui", "caipe-dynamic-agents", "caipe-slack-bot", "caipe-webex-bot"]
          images += ["caipe-rag-" + name for name in rag]
          # GitHub uses an externally published server rather than a local image.
          images += ["mcp-" + name for name in agents if name != "github"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("images=" + json.dumps(list(dict.fromkeys(images))) + "\n")
          PYTHON

  scan-containers:
    name: Container scan (${{ matrix.image }})
    needs: release-config
    runs-on: ubuntu-latest
    # Only runs on manual dispatch — tag-push triggers were removed because images
    # are not yet published when the tag event fires (race condition).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release-config.outputs.images) }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_SECURITY_APP_ID }}
          private-key: ${{ secrets.CI_SECURITY_APP_PRIVATE_KEY }}
          permission-security-events: write

      - name: Determine image tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$DISPATCH_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag must also be a valid container tag"
            exit 1
          fi
          printf 'tag=%s\n' "$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Grype scan on container image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: "ghcr.io/caipe-io/${{ matrix.image }}:${{ steps.tag.outputs.tag }}"
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ always() && steps.scan.outcome == 'success' && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: "grype-${{ matrix.image }}"
          # Container findings describe a released image, not the mutable main
          # branch. Keeping them on the release tag also prevents GitHub's PR
          # diff gate from expecting every container configuration on each PR.
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          sha: ${{ steps.tag.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
