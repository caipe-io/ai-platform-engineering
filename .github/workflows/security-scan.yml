---
name: "Grype Scan"
description: "Anchore Grype vulnerability scan — filesystem on all events, containers on tags. Blocking gate is GitHub Code Scanning PR diff mode, not fail-build."

# assisted-by Codex Codex-sonnet-4-6

# Trigger matrix:
#   pull_request / push to main  → filesystem scan only; fail-build: false — GitHub Code Scanning
#                                  PR diff mode is the gate (only NEW alerts block the PR)
#   push tag                     → filesystem scan + all container images, fail-build: false (informational)
#   workflow_dispatch            → both jobs, fail-build: false
#
# Why fail-build: false everywhere?
#   Grype's fail-build hard-fails on any CVE at or above severity-cutoff, including CVEs in
#   upstream libraries that have no available fix yet. That forces contributors to take the
#   blame for vulnerabilities they didn't introduce and can't resolve.
#
#   GitHub Code Scanning's PR diff mode only surfaces alerts that are *new* in the PR — CVEs
#   already present on the base branch (e.g., in a transitive dep that predates the PR) are
#   silently excluded from the PR check. This means:
#     - A PR that introduces a new vulnerable dependency → new alert → PR blocked
#     - An upstream CVE already present on main → not new → PR not blocked, alert visible in
#       the Security tab so maintainers can track and upgrade when a fix is released
#
#   To activate this: require the "Code scanning results / Grype" check under
#   Settings → Branches → Branch protection rules for main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to scan (e.g. 0.2.3)"
        required: true
        type: string

permissions:
  contents: read
  security-events: write  # required to upload SARIF to GitHub Code Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Fork-triggered pull_request runs never receive repository secrets and
      # their GITHUB_TOKEN is read-only, so security-events: write is
      # unavailable. Dependabot PRs from this repository do receive the
      # workflow permission above, so use the built-in token for those runs
      # instead of a secret-backed GitHub App token. Detect external forks and
      # skip only their SARIF upload, but still run the scan itself so
      # contributors get results in the job log.
      - name: 🔍 Determine fork status
        id: fork-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag || github.ref }}

      - name: Run Grype scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          path: "."
          fail-build: false  # Gate is GitHub Code Scanning PR diff — see top-level comment
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ always() && steps.scan.outputs.sarif != '' && steps.fork-check.outputs.is_fork != 'true' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          # Keep this stable as "grype": GitHub Code Scanning correlates SARIF
          # by category, and renaming it leaves old alerts orphaned.
          category: "grype"
          # On pull_request events the default checkout produces a merge commit
          # (refs/pull/N/merge), but GitHub Code Scanning PR checks require the
          # analysis to be associated with refs/pull/N/head + the head commit SHA.
          # Without this, the check shows "1 configuration not found" because the
          # merge-ref analysis is not matched against the PR head check run.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: ℹ️ Note SARIF upload skipped for fork PR
        if: ${{ always() && steps.fork-check.outputs.is_fork == 'true' }}
        run: |
          echo "::notice::This PR is from a fork, so results can't be uploaded to GitHub Code Scanning (that needs security-events: write, unavailable to fork-triggered pull_request runs). The Grype scan above still ran — see its output for findings. A maintainer can re-run this workflow after merge to get code-scanning annotations."

  scan-containers:
    name: Container scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Only runs on manual dispatch — tag-push triggers were removed because images
    # are not yet published when the tag event fires (race condition).
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        image:
          # UI
          - caipe-ui
          # Dynamic agents runtime
          - caipe-dynamic-agents
          # Bots
          - caipe-slack-bot
          - caipe-webex-bot
          # RAG components
          - caipe-rag-agent-ontology
          - caipe-rag-server
          - caipe-rag-ingestors
          # Per-tool MCP servers (canonical mcp_agents from .github/agents.json).
          # github has no local image — uses external ghcr.io/github/github-mcp-server.
          - mcp-argocd
          - mcp-aws
          - mcp-backstage
          - mcp-confluence
          - mcp-jira
          - mcp-komodor
          - mcp-litellm
          - mcp-netutils
          - mcp-pagerduty
          - mcp-splunk
          - mcp-victorops
          - mcp-webex
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_SECURITY_APP_ID }}
          private-key: ${{ secrets.CI_SECURITY_APP_PRIVATE_KEY }}
          permission-security-events: write

      - name: Determine image tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'tag=%s\n' "$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Grype scan on container image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: "ghcr.io/caipe-io/${{ matrix.image }}:${{ steps.tag.outputs.tag }}"
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: "grype-${{ matrix.image }}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
