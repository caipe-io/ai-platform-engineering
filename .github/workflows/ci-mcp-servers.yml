name: "[CI][MCP] MCP Servers Docker Build and Push"
description: "Build and push MCP server Docker images"

on:
  push:
    tags:
      - '**'
  pull_request:
    paths:
      - 'ai_platform_engineering/mcp/**'
      - 'build/agents/Dockerfile.mcp'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Force a fresh build of all components (bypass change-detection). Use for coordinated releases.'
        required: false
        default: false
        type: boolean
      tag_version:
        description: 'Version tag to apply (e.g., 0.3.0-dev.5).'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      all_agents: ${{ steps.read-config.outputs.all_agents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/agents.json
          sparse-checkout-cone-mode: false

      - name: Read agents config
        id: read-config
        run: |
          ALL_AGENTS=$(jq -c '.mcp_agents' .github/agents.json)
          echo "all_agents=$ALL_AGENTS" >> $GITHUB_OUTPUT

  determine-agents:
    runs-on: ubuntu-latest
    needs: load-config
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'prebuild/')) ||
      (github.event_name == 'workflow_dispatch')
    outputs:
      agents_to_build: ${{ steps.set-matrix.outputs.agents_to_build }}
      should_build: ${{ steps.set-matrix.outputs.should_build }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    env:
      ALL_AGENTS: ${{ needs.load-config.outputs.all_agents }}
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_MCP_APP_ID }}
          private-key: ${{ secrets.CI_MCP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: version
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Generate path filters
        id: generate-filters
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const agents = JSON.parse(process.env.ALL_AGENTS);
            let filters = '';
            filters += 'shared_config:\n';
            filters += '  - \'pyproject.toml\'\n';
            filters += '  - \'uv.lock\'\n';
            filters += '  - \'ai_platform_engineering/mcp/common/**\'\n';
            filters += 'shared_dockerfile:\n';
            filters += '  - \'build/agents/Dockerfile.mcp\'\n';
            agents.forEach(agent => {
              filters += `${agent}:\n`;
              filters += `  - 'ai_platform_engineering/mcp/${agent}/**'\n`;
            });
            core.setOutput('filters', filters);

      - name: Detect changed paths (MCP)
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: ${{ steps.generate-filters.outputs.filters }}

      - name: Set matrix based on changes (MCP)
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
          MANUAL_BUILD_ALL: ${{ inputs.build_all || 'false' }}
        with:
          script: |
            const allAgents = JSON.parse(process.env.ALL_AGENTS);
            const filterOutputs = JSON.parse(process.env.FILTER_OUTPUTS);
            const tagVersion = process.env.TAG_VERSION;
            const manualBuildAll = process.env.MANUAL_BUILD_ALL === 'true';

            // Chart-only tag: skip image builds entirely
            if (/-chart\.\d+$/.test(tagVersion)) {
              console.log("📊 Chart-only tag: skipping image builds");
              core.setOutput('agents_to_build', '[]');
              core.setOutput('should_build', 'false');
              return;
            }

            const isSharedChanged = filterOutputs.shared_config === 'true' ||
                                   filterOutputs.shared_dockerfile === 'true';

            let agentsToBuild;
            if (manualBuildAll || isSharedChanged || tagVersion) {
              console.log("🚀 Build all: " + (manualBuildAll ? "manual" : isSharedChanged ? "shared changed" : "tag push"));
              agentsToBuild = allAgents;
            } else {
              console.log("🔍 Standard PR: building only changed agents");
              agentsToBuild = allAgents.filter(a => filterOutputs[a] === 'true');
            }

            core.setOutput('agents_to_build', JSON.stringify(agentsToBuild));
            core.setOutput('should_build', String(agentsToBuild.length > 0));
            console.log(`Agents to build: ${agentsToBuild.join(', ') || 'none'}`);

  # Build natively per-platform (no QEMU) and push by digest only;
  # merge-manifests combines the per-arch digests into the final tagged
  # multi-arch manifest list. See ci-rag.yml for the incident this pattern
  # was introduced to fix (QEMU-emulated arm64 timing out/OOMing).
  build-and-push:
    runs-on: ${{ matrix.runner }}
    needs: [determine-agents, load-config]
    if: (needs.determine-agents.outputs.should_build == 'true' && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'prebuild/')))
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        agent: ${{ fromJson(needs.determine-agents.outputs.agents_to_build) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
      fail-fast: false

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/mcp-${{ matrix.agent }}

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_MCP_APP_ID }}
          private-key: ${{ secrets.CI_MCP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-packages: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-agents.outputs.tag_version }},enable=${{ needs.determine-agents.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Build and push MCP image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: build/agents/Dockerfile.mcp
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
          cache-from: type=gha,scope=${{ matrix.agent }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.agent }}--${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single tagged multi-arch manifest
  # list, one matrix entry per MCP agent.
  merge-manifests:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: [determine-agents, build-and-push]
    if: |
      needs.determine-agents.outputs.should_build == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        agent: ${{ fromJson(needs.determine-agents.outputs.agents_to_build) }}
      fail-fast: false

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/mcp-${{ matrix.agent }}

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.agent }}--*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-agents.outputs.tag_version }},enable=${{ needs.determine-agents.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Notify release-finalize workflow when this CI completes (for final release builds only)
  notify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for repository_dispatch via gh api
    needs: [determine-agents, build-and-push, merge-manifests]
    if: |
      always() &&
      needs.determine-agents.outputs.tag_version != '' &&
      !contains(needs.determine-agents.outputs.tag_version, '-')
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_MCP_APP_ID }}
          private-key: ${{ secrets.CI_MCP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: 🔔 Notify release finalize
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_VERSION: ${{ needs.determine-agents.outputs.tag_version }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          # Determine overall conclusion
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          MERGE_RESULT="${{ needs.merge-manifests.result }}"

          # Consider skipped as success (job conditions not met)
          if [[ "$BUILD_RESULT" == "skipped" ]]; then BUILD_RESULT="success"; fi
          if [[ "$MERGE_RESULT" == "skipped" ]]; then MERGE_RESULT="success"; fi

          if [[ "$BUILD_RESULT" == "success" && "$MERGE_RESULT" == "success" ]]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          echo "🔔 Notifying release-finalize: tag=$TAG_VERSION, conclusion=$CONCLUSION"

          gh api --method POST /repos/${{ github.repository }}/dispatches --input - <<EOF
          {
            "event_type": "ci-completed",
            "client_payload": {
              "tag": "$TAG_VERSION",
              "workflow": "$WORKFLOW_NAME",
              "conclusion": "$CONCLUSION"
            }
          }
          EOF
