name: Claude Code CLI ACP worker

on:
  pull_request:
    paths:
      - ai_platform_engineering/harness_engine/**
      - .github/workflows/ci-claude-cli-acp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-cli-acp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Build the standalone CLI worker
        run: docker build -f ai_platform_engineering/harness_engine/build/Dockerfile.claude-cli-acp -t claude-cli-acp:test .
      - name: Verify the installed CLI and ACP entry point
        run: |
          docker run --rm --entrypoint claude claude-cli-acp:test --version
          docker run --rm --entrypoint python claude-cli-acp:test -c 'from harness_engine.claude_cli_acp import ClaudeCodeCLIAgent; from harness_engine.config import Settings; assert Settings().claude_acp_runtime == "claude_code_cli_acp"'
      - name: Initialize ACP with the worker subprocess environment
        run: |
          docker run --rm -i --entrypoint python claude-cli-acp:test - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          from harness_engine.adapters.claude_acp import ACPEventClient
          from harness_engine.claude_acp_process import managed_acp_process
          from harness_engine.config import Settings
          async def main() -> None:
              async with managed_acp_process(ACPEventClient(), Settings().claude_acp_command,
                  env={"PATH": os.environ["PATH"], "HOME": "/workspace"}, cwd=Path("/workspace"), run_id="startup-check") as connection:
                  assert (await connection.initialize(protocol_version=1)).protocol_version == 1
          asyncio.run(main())
          PY
