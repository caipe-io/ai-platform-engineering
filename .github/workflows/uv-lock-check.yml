name: uv lock sync check

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '.github/workflows/uv-lock-check.yml'
      - 'scripts/check_uv_lock_sync.sh'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'

      - name: Verify uv.lock files are in sync
        run: |
          bash scripts/check_uv_lock_sync.sh
