name: "[Prebuild] Helm Chart"
description: "Publish prebuild Helm charts"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prebuild-helm.yml'
      - '.github/actions/prebuild-status/**'
      - '.github/actions/prebuild-version/**'
      - 'charts/**'
  # Called from prebuild-manual.yml for ad-hoc dispatch runs
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to publish prebuild for'
        required: true
        type: number
      head_ref:
        description: 'PR head branch ref'
        required: true
        type: string
      head_sha:
        description: 'PR head commit SHA'
        required: true
        type: string
      base_ref:
        description: 'PR base branch ref'
        required: true
        type: string
      base_sha:
        description: 'PR base commit SHA'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-prebuild:
    name: Publish Prebuild Helm Chart
    runs-on: ubuntu-latest
    if: |
      (github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]') &&
      (
        startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
        github.event.action != 'closed'
      )

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 🏷️ Compute prebuild version
        id: version
        uses: ./.github/actions/prebuild-version
        with:
          head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          base_ref: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          base_sha: ${{ inputs.base_sha || github.event.pull_request.base.sha }}

      - name: 🔍 Detect Changed Charts
        id: detect
        env:
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BASE_SHA"
          else
            BASE_COMMIT="origin/${BASE_REF}"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT"..HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          RAG_STACK_CHANGED=false
          AI_PLATFORM_CHANGED=false

          if echo "$CHANGED_FILES" | grep -q "^charts/rag-stack/"; then
            if echo "$CHANGED_FILES" | grep "^charts/rag-stack/" | grep -qv "Chart.lock$"; then
              RAG_STACK_CHANGED=true
              echo "✅ rag-stack chart has substantive changes"
            else
              echo "ℹ️  rag-stack only has Chart.lock changes, skipping prebuild"
            fi
          fi

          if echo "$CHANGED_FILES" | grep -q "^charts/ai-platform-engineering/"; then
            if echo "$CHANGED_FILES" | grep "^charts/ai-platform-engineering/" | grep -qv "Chart.lock$"; then
              AI_PLATFORM_CHANGED=true
              echo "✅ ai-platform-engineering chart has substantive changes"
            else
              echo "ℹ️  ai-platform-engineering only has Chart.lock changes, skipping prebuild"
            fi
          fi

          echo "rag-stack-changed=$RAG_STACK_CHANGED" >> $GITHUB_OUTPUT
          echo "ai-platform-changed=$AI_PLATFORM_CHANGED" >> $GITHUB_OUTPUT

      - name: ⚙️ Set up Helm
        if: steps.detect.outputs.rag-stack-changed == 'true' || steps.detect.outputs.ai-platform-changed == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: 🔐 Login to GHCR
        if: steps.detect.outputs.rag-stack-changed == 'true' || steps.detect.outputs.ai-platform-changed == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GHCR_ACTOR}" --password-stdin

      - name: 📝 Write local chart version normalizer
        if: steps.detect.outputs.rag-stack-changed == 'true' || steps.detect.outputs.ai-platform-changed == 'true'
        run: |
          cat > /tmp/normalize-local-chart-tree-versions.py <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          chart_version = sys.argv[2]
          app_version = sys.argv[3]


          def replace_scalar(line: str, key: str, value: str) -> str:
              match = re.match(rf"^(\s*{re.escape(key)}:\s*)(.*?)(\s*#.*)?$", line)
              if not match:
                  return line
              return f"{match.group(1)}{value}{match.group(3) or ''}"


          def repository_value(line: str) -> str:
              value = line.split(":", 1)[1].strip()
              return value.strip("\"'")


          def update_chart(path: Path) -> None:
              original = path.read_text()
              lines = original.splitlines()

              for index, line in enumerate(lines):
                  if line.startswith("version:"):
                      lines[index] = replace_scalar(line, "version", chart_version)
                      break

              for index, line in enumerate(lines):
                  if line.startswith("appVersion:"):
                      lines[index] = replace_scalar(line, "appVersion", app_version)
                      break

              try:
                  deps_index = next(index for index, line in enumerate(lines) if line == "dependencies:")
              except StopIteration:
                  path.write_text("\n".join(lines) + ("\n" if original.endswith("\n") else ""))
                  return

              index = deps_index + 1
              while index < len(lines):
                  if lines[index] and not lines[index].startswith((" ", "\t", "-")):
                      break
                  if not re.match(r"^\s*-\s+name:\s*", lines[index]):
                      index += 1
                      continue

                  start = index
                  index += 1
                  while index < len(lines):
                      if re.match(r"^\s*-\s+name:\s*", lines[index]):
                          break
                      if lines[index] and not lines[index].startswith((" ", "\t")):
                          break
                      index += 1

                  block = lines[start:index]
                  repository = next(
                      (repository_value(line) for line in block if re.match(r"^\s*repository:\s*", line)),
                      "",
                  )
                  is_local_dependency = repository == "" or repository.startswith("file://")
                  if not is_local_dependency:
                      continue

                  for dep_index in range(start, index):
                      if re.match(r"^\s*version:\s*", lines[dep_index]):
                          lines[dep_index] = replace_scalar(lines[dep_index], "version", chart_version)
                          break

              path.write_text("\n".join(lines) + ("\n" if original.endswith("\n") else ""))


          for chart in sorted(root.rglob("Chart.yaml")):
              update_chart(chart)
              print(f"normalized {chart}")
          PY

      - name: Upload building rag-stack prebuild status
        if: steps.detect.outputs.rag-stack-changed == 'true'
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          source: helm
          type: helm
          name: rag-stack
          repository: ghcr.io/${{ github.repository_owner }}/charts
          tag: ${{ steps.version.outputs.prebuild_tag }}
          ref: oci://ghcr.io/${{ github.repository_owner }}/charts/rag-stack
          version: ${{ steps.version.outputs.prebuild_tag }}
          release_name: rag
          status: building
          artifact_suffix: start

      - name: Upload building ai-platform-engineering prebuild status
        if: steps.detect.outputs.ai-platform-changed == 'true'
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          source: helm
          type: helm
          name: ai-platform-engineering
          repository: ghcr.io/${{ github.repository_owner }}/charts
          tag: ${{ steps.version.outputs.prebuild_tag }}
          ref: oci://ghcr.io/${{ github.repository_owner }}/charts/ai-platform-engineering
          version: ${{ steps.version.outputs.prebuild_tag }}
          release_name: ai-platform
          status: building
          artifact_suffix: start

      - name: 📦 Package rag-stack Chart
        if: steps.detect.outputs.rag-stack-changed == 'true'
        env:
          PREBUILD_TAG: ${{ steps.version.outputs.prebuild_tag }}
        run: |
          echo "📦 Packaging rag-stack..."

          python3 /tmp/normalize-local-chart-tree-versions.py "charts/rag-stack" "$PREBUILD_TAG" "$PREBUILD_TAG"

          mkdir -p ./packaged-charts
          helm dependency update charts/rag-stack/
          helm package charts/rag-stack/ --destination ./packaged-charts/

          echo "✅ rag-stack packaged successfully"

      - name: 📦 Package ai-platform-engineering Chart
        if: steps.detect.outputs.ai-platform-changed == 'true'
        env:
          PREBUILD_TAG: ${{ steps.version.outputs.prebuild_tag }}
        run: |
          echo "📦 Packaging ai-platform-engineering..."

          python3 /tmp/normalize-local-chart-tree-versions.py "charts/rag-stack" "$PREBUILD_TAG" "$PREBUILD_TAG"
          python3 /tmp/normalize-local-chart-tree-versions.py "charts/ai-platform-engineering" "$PREBUILD_TAG" "$PREBUILD_TAG"

          mkdir -p ./packaged-charts

          # CRITICAL: Always update rag-stack dependencies first
          # ai-platform-engineering depends on rag-stack, which depends on neo4j and milvus
          # These external dependencies must be downloaded regardless of path changes
          echo "Updating rag-stack dependencies..."
          helm dependency update charts/rag-stack/

          echo "Updating ai-platform-engineering dependencies..."
          helm dependency update charts/ai-platform-engineering/

          helm package charts/ai-platform-engineering/ --destination ./packaged-charts/

          echo "🔍 Verifying rag-stack dependencies..."
          if tar -tzf charts/ai-platform-engineering/charts/rag-stack-*.tgz | grep -q "^rag-stack/charts/neo4j/Chart.yaml"; then
            echo "✅ neo4j dependency verified"
          else
            echo "❌ ERROR: neo4j missing from rag-stack package"
            exit 1
          fi

          if tar -tzf charts/ai-platform-engineering/charts/rag-stack-*.tgz | grep -q "^rag-stack/charts/milvus/Chart.yaml"; then
            echo "✅ milvus dependency verified"
          else
            echo "❌ ERROR: milvus missing from rag-stack package"
            exit 1
          fi

          echo "✅ ai-platform-engineering packaged successfully with all dependencies"

      - name: 🚀 Push Prebuild Charts to GHCR
        if: steps.detect.outputs.rag-stack-changed == 'true' || steps.detect.outputs.ai-platform-changed == 'true'
        id: push
        run: |
          REGISTRY="oci://ghcr.io/${{ github.repository_owner }}/charts"

          echo "📦 Pushing prebuild charts to $REGISTRY"

          for CHART_FILE in ./packaged-charts/*.tgz; do
            if [ -f "$CHART_FILE" ]; then
              CHART_NAME=$(helm show chart "$CHART_FILE" | grep '^name:' | awk '{print $2}')
              CHART_VERSION=$(helm show chart "$CHART_FILE" | grep '^version:' | awk '{print $2}')

              echo "📦 Pushing $CHART_NAME:$CHART_VERSION"
              helm push "$CHART_FILE" "$REGISTRY"
              echo "✅ $CHART_NAME:$CHART_VERSION published successfully!"
            fi
          done

      - name: Upload final rag-stack prebuild status
        if: ${{ always() && steps.detect.outputs.rag-stack-changed == 'true' }}
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          source: helm
          type: helm
          name: rag-stack
          repository: ghcr.io/${{ github.repository_owner }}/charts
          tag: ${{ steps.version.outputs.prebuild_tag }}
          ref: oci://ghcr.io/${{ github.repository_owner }}/charts/rag-stack
          version: ${{ steps.version.outputs.prebuild_tag }}
          release_name: rag
          status: ${{ steps.push.outcome == 'success' && 'published' || 'failed' }}
          artifact_suffix: final

      - name: Upload final ai-platform-engineering prebuild status
        if: ${{ always() && steps.detect.outputs.ai-platform-changed == 'true' }}
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
          source: helm
          type: helm
          name: ai-platform-engineering
          repository: ghcr.io/${{ github.repository_owner }}/charts
          tag: ${{ steps.version.outputs.prebuild_tag }}
          ref: oci://ghcr.io/${{ github.repository_owner }}/charts/ai-platform-engineering
          version: ${{ steps.version.outputs.prebuild_tag }}
          release_name: ai-platform
          status: ${{ steps.push.outcome == 'success' && 'published' || 'failed' }}
          artifact_suffix: final
