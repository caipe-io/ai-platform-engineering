name: "[CI] AgentGateway Config Bridge Build and Push"
description: "Build and push the AgentGateway config-bridge Docker image"

on:
  push:
    tags:
      - '**'
    branches:
      - main
  pull_request:
    paths:
      - 'deploy/agentgateway/config_bridge.py'
      - 'deploy/agentgateway/Dockerfile.config-bridge'
      - '.github/workflows/ci-agentgateway-config-bridge.yml'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag to apply (e.g., 1.2.0 or 1.2.0-rc.1)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.set-outputs.outputs.should_build }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: version
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            config_bridge:
              - 'deploy/agentgateway/config_bridge.py'
              - 'deploy/agentgateway/Dockerfile.config-bridge'
              - '.github/workflows/ci-agentgateway-config-bridge.yml'

      - name: Set Outputs
        id: set-outputs
        env:
          CONFIG_BRIDGE_CHANGED: ${{ steps.filter.outputs.config_bridge }}
        run: |
          SHOULD_BUILD="true"

          # A plain push to main (canary) should only rebuild when this
          # component's own paths changed; tag pushes, PRs (already
          # path-filtered by the trigger above) and manual dispatch always build.
          if [ "${{ github.event_name }}" == "push" ] && [ "$GITHUB_REF" == "refs/heads/main" ] && [ "$CONFIG_BRIDGE_CHANGED" != "true" ]; then
            SHOULD_BUILD="false"
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  # Build natively per-platform (no QEMU) and push by digest only;
  # merge-manifests combines the per-arch digests into the final tagged
  # multi-arch manifest list. See ci-rag.yml for the incident this pattern
  # was introduced to fix (QEMU-emulated arm64 timing out/OOMing).
  build-and-push:
    runs-on: ${{ matrix.runner }}
    needs: determine-changes
    if: needs.determine-changes.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/agentgateway-config-bridge
      DOCKERFILE: deploy/agentgateway/Dockerfile.config-bridge
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/agentgateway
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single tagged multi-arch manifest list.
  merge-manifests:
    runs-on: ubuntu-latest
    needs: [determine-changes, build-and-push]
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/agentgateway-config-bridge
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  notify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [determine-changes, build-and-push, merge-manifests]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.determine-changes.outputs.tag_version != '' &&
      !contains(needs.determine-changes.outputs.tag_version, '-')
    steps:
      - name: 🔔 Notify release finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ needs.determine-changes.outputs.tag_version }}
          BUILD_PUSH_RESULT: ${{ needs.build-and-push.result }}
          MERGE_RESULT: ${{ needs.merge-manifests.result }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
        run: |
          CONCLUSION="$BUILD_PUSH_RESULT"
          if [[ "$CONCLUSION" == "skipped" ]]; then CONCLUSION="success"; fi
          MERGE_CONCLUSION="$MERGE_RESULT"
          if [[ "$MERGE_CONCLUSION" == "skipped" ]]; then MERGE_CONCLUSION="success"; fi
          if [[ "$MERGE_CONCLUSION" != "success" ]]; then CONCLUSION="failure"; fi

          gh api "/repos/${GH_REPOSITORY}/dispatches" --input - <<EOF
          {
            "event_type": "ci-completed",
            "client_payload": {
              "tag": "$TAG_VERSION",
              "workflow": "$GH_WORKFLOW",
              "conclusion": "$CONCLUSION"
            }
          }
          EOF
