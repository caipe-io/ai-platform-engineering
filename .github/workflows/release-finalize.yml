name: "[Release] Finalize Release"
description: "Automatically publish draft release when all CI builds pass"

on:
  repository_dispatch:
    types: [ci-completed]

permissions:
  contents: read
  actions: read

jobs:
  check-and-publish:
    name: Check CI Status and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      all_passed: ${{ steps.check-cis.outputs.all_passed }}
      tag: ${{ steps.payload.outputs.tag }}
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: 📥 Extract payload
        id: payload
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_WORKFLOW: ${{ github.event.client_payload.workflow }}
          DISPATCH_CONCLUSION: ${{ github.event.client_payload.conclusion }}
        run: |
          set -euo pipefail

          TAG="$DISPATCH_TAG"
          WORKFLOW="$DISPATCH_WORKFLOW"
          CONCLUSION="$DISPATCH_CONCLUSION"

          echo "🏷️ Tag: $TAG"
          echo "📦 Triggered by: $WORKFLOW"
          echo "📊 Conclusion: $CONCLUSION"

          if [[ -z "$TAG" ]]; then
            echo "❌ No tag in payload, skipping"
            exit 0
          fi

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag must match x.y.z"
            exit 1
          fi

          if ! [[ "$CONCLUSION" =~ ^(success|failure|cancelled|skipped|timed_out|action_required|neutral)$ ]]; then
            echo "❌ Unexpected workflow conclusion: $CONCLUSION"
            exit 1
          fi

          if [[ -z "$WORKFLOW" || ${#WORKFLOW} -gt 160 || "$WORKFLOW" == *$'\n'* || "$WORKFLOW" == *$'\r'* ]]; then
            echo "❌ Unexpected workflow name: $WORKFLOW"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "workflow=$WORKFLOW"
            echo "conclusion=$CONCLUSION"
          } >> "$GITHUB_OUTPUT"

      - name: 🔍 Check all CI workflow statuses
        id: check-cis
        if: steps.payload.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          echo "🔍 Checking CI statuses for tag: $TAG"
          echo ""

          # Required CI workflows that must pass for release.
          # Skill Scanner is gated alongside the other component images so a
          # broken `ghcr.io/<owner>/skill-scanner:<appVersion>` actually blocks
          # the release — the skill-scanner subchart in
          # charts/ai-platform-engineering/charts/skill-scanner pulls that exact
          # tag, so an unbuilt image would otherwise produce ImagePullBackOff
          # on every fresh install with global.skillScanner.enabled=true.
          REQUIRED_WORKFLOWS=(
            "[CI][MCP] MCP Servers Docker Build and Push"
            "[CI] CAIPE RAG Build and Push"
            "[CI] Dynamic Agents Build and Push"
            "[CI] Autonomous Agents Build and Push"
            "[CI] CAIPE UI Build and Push"
            "[CI] Audit Service Build and Push"
            "[CI] Slack Bot Build and Push"
            "[CI] Skill Scanner Build and Push"
            "[CI] Keycloak Init Build and Push"
            "[CI] OpenFGA Authz Bridge Build and Push"
            "[CI][Helm] Publish Tagged Helm Charts"
          )

          ALL_PASSED=true
          ANY_FAILED=false
          ANY_RUNNING=false
          MISSING_RUNS=()
          FAILED_RUNS=()

          for WF_NAME in "${REQUIRED_WORKFLOWS[@]}"; do
            echo -n "  📦 $WF_NAME: "

            # Get the most recent run for this workflow triggered on the tag ref
            # --repo is required because there's no checkout step
            RUN_DATA=$(gh run list \
              --repo="${{ github.repository }}" \
              --workflow="$WF_NAME" \
              --branch="$TAG" \
              --limit=1 \
              --json status,conclusion,databaseId \
              2>/dev/null || echo "[]")

            RUN_COUNT=$(echo "$RUN_DATA" | jq 'length')
            if [[ "$RUN_COUNT" -eq 0 || -z "$RUN_DATA" || "$RUN_DATA" == "[]" ]]; then
              echo "⏳ not started yet"
              ALL_PASSED=false
              MISSING_RUNS+=("$WF_NAME")
              continue
            fi

            STATUS=$(echo "$RUN_DATA" | jq -r '.[0].status // "unknown"')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.[0].conclusion // "null"')
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.[0].databaseId')

            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ passed"
              elif [[ "$CONCLUSION" == "skipped" ]]; then
                echo "⏭️ skipped (OK)"
              else
                echo "❌ failed ($CONCLUSION)"
                ALL_PASSED=false
                ANY_FAILED=true
                RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
                FAILED_RUNS+=("- [$WF_NAME]($RUN_URL) — \`$CONCLUSION\`")
              fi
            elif [[ "$STATUS" == "in_progress" || "$STATUS" == "queued" || "$STATUS" == "waiting" ]]; then
              echo "🔄 $STATUS"
              ALL_PASSED=false
              ANY_RUNNING=true
            else
              echo "❓ unknown status: $STATUS"
              ALL_PASSED=false
            fi
          done

          echo ""
          FAILED_RUNS_DELIMITER="failed-runs-$RANDOM-$(date +%s)"
          {
            echo "all_passed=$ALL_PASSED"
            echo "any_failed=$ANY_FAILED"
            echo "any_running=$ANY_RUNNING"
            echo "failed_runs<<$FAILED_RUNS_DELIMITER"
            printf '%s\n' "${FAILED_RUNS[@]}"
            echo "$FAILED_RUNS_DELIMITER"
          } >> "$GITHUB_OUTPUT"

          if [[ "$ALL_PASSED" == "true" ]]; then
            echo "✅ All CI workflows passed!"
          elif [[ "$ANY_FAILED" == "true" ]]; then
            echo "❌ Some CI workflows failed"
          elif [[ "$ANY_RUNNING" == "true" ]]; then
            echo "⏳ Some CI workflows still running, will check again when they complete"
          else
            echo "⏳ Waiting for CI workflows to start"
          fi

      - name: 🚀 Publish release
        if: steps.check-cis.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          echo "🚀 Publishing release $TAG..."

          # Check if release exists and is a draft
          RELEASE_INFO=$(gh release view "$TAG" --repo="${{ github.repository }}" --json isDraft,url 2>/dev/null || echo '{"isDraft":false}')
          IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')

          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "ℹ️ Release $TAG is not a draft (already published or doesn't exist)"
            exit 0
          fi

          # Publish the release
          gh release edit "$TAG" --repo="${{ github.repository }}" --draft=false

          echo "✅ Release $TAG published!"
          echo "🔗 $(echo "$RELEASE_INFO" | jq -r '.url')"

      - name: 🧹 Clean up old RC tags
        if: steps.check-cis.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          echo "🧹 Cleaning up old RC tags..."

          # Parse new version components (e.g., 0.2.9 -> major=0, minor=2, patch=9)
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            NEW_MAJOR="${BASH_REMATCH[1]}"
            NEW_MINOR="${BASH_REMATCH[2]}"
            NEW_PATCH="${BASH_REMATCH[3]}"
          else
            echo "⚠️ Could not parse version from tag: $TAG"
            exit 0
          fi

          echo "📦 New release: $NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"

          # Get all tags via GitHub API and filter for RC tags
          RC_TAGS=$(gh api "/repos/${{ github.repository }}/tags" --paginate --jq '.[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' || true)

          if [[ -z "$RC_TAGS" ]]; then
            echo "ℹ️ No RC tags found"
            exit 0
          fi

          DELETED=0
          SKIPPED=0

          while IFS= read -r RC_TAG; do
            [[ -z "$RC_TAG" ]] && continue

            # Parse RC tag (e.g., 0.2.8-rc.1 -> base=0.2.8)
            if [[ "$RC_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
              RC_MAJOR="${BASH_REMATCH[1]}"
              RC_MINOR="${BASH_REMATCH[2]}"
              RC_PATCH="${BASH_REMATCH[3]}"

              # Delete RC if its base version is less than the new release version
              # Compare: RC_VERSION < NEW_VERSION
              SHOULD_DELETE=false

              if [[ "$RC_MAJOR" -lt "$NEW_MAJOR" ]]; then
                SHOULD_DELETE=true
              elif [[ "$RC_MAJOR" -eq "$NEW_MAJOR" && "$RC_MINOR" -lt "$NEW_MINOR" ]]; then
                SHOULD_DELETE=true
              elif [[ "$RC_MAJOR" -eq "$NEW_MAJOR" && "$RC_MINOR" -eq "$NEW_MINOR" && "$RC_PATCH" -lt "$NEW_PATCH" ]]; then
                SHOULD_DELETE=true
              fi

              if [[ "$SHOULD_DELETE" == "true" ]]; then
                echo "  🗑️ Deleting $RC_TAG (base $RC_MAJOR.$RC_MINOR.$RC_PATCH < $TAG)"
                if gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/$RC_TAG" 2>/dev/null; then
                  ((DELETED++)) || true
                else
                  echo "    ⚠️ Failed to delete $RC_TAG"
                fi
              else
                echo "  ⏭️ Keeping $RC_TAG (base $RC_MAJOR.$RC_MINOR.$RC_PATCH >= $TAG)"
                ((SKIPPED++)) || true
              fi
            fi
          done <<< "$RC_TAGS"

          echo ""
          echo "✅ RC cleanup complete: $DELETED deleted, $SKIPPED kept"

      - name: ❌ Mark release as failed
        if: steps.check-cis.outputs.any_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
          FAILED_RUNS: ${{ steps.check-cis.outputs.failed_runs }}
        run: |
          echo "❌ CI builds failed for $TAG"

          # Add or refresh a note on the release. The markers let subsequent
          # workflow completions update the complete list of failed runs.
          RELEASE_INFO=$(gh release view "$TAG" --repo="${{ github.repository }}" --json body 2>/dev/null || echo '{}')
          CURRENT_BODY=$(echo "$RELEASE_INFO" | jq -r '.body // ""')
          FAILURE_START_MARKER="<!-- ci-build-failure:start -->"
          FAILURE_END_MARKER="<!-- ci-build-failure:end -->"

          # release-manual.yml records the original workflow_dispatch actor in
          # the draft release body. Tag-push and repository_dispatch actors are
          # GitHub Apps, so they cannot identify the human release initiator.
          RELEASE_INITIATOR=$(printf '%s\n' "$CURRENT_BODY" | sed -nE \
            's/^<!-- release-initiator:([A-Za-z0-9-]{1,39}) -->$/\1/p' | head -n 1)
          if [[ -n "$RELEASE_INITIATOR" ]]; then
            INVESTIGATION_REQUEST="@$RELEASE_INITIATOR, please investigate and either:"
            echo "👤 Release initiated by @$RELEASE_INITIATOR"
          else
            INVESTIGATION_REQUEST="Please investigate and either:"
            echo "⚠️ Release initiator metadata was not found"
          fi

          if [[ "$CURRENT_BODY" == *"$FAILURE_START_MARKER"* ]]; then
            BASE_BODY=$(printf '%s\n' "$CURRENT_BODY" | awk \
              -v start="$FAILURE_START_MARKER" \
              -v end="$FAILURE_END_MARKER" '
                $0 == start { in_failure_note = 1; next }
                $0 == end { in_failure_note = 0; next }
                !in_failure_note { print }
              ')
          else
            BASE_BODY="$CURRENT_BODY"

            # Remove notes created before the managed markers were introduced.
            LEGACY_FAILURE_HEADING=$'\n---\n⚠️ **CI BUILD FAILURE** ⚠️'
            if [[ "$BASE_BODY" == *"$LEGACY_FAILURE_HEADING"* ]]; then
              BASE_BODY="${BASE_BODY%%"$LEGACY_FAILURE_HEADING"*}"
            fi
          fi

          FAILURE_NOTE="$FAILURE_START_MARKER

          ---
          ⚠️ **CI BUILD FAILURE** ⚠️

          One or more CI builds failed for this release.
          $INVESTIGATION_REQUEST
          1. Re-run the failed workflows (often retrigger of the same workflow run is sufficient as most fails are transient)
          2. If the failures are persistent, investigate and fix the underlying issue, then create a new release

          Failed CI workflow runs:
          $FAILED_RUNS

          _Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_
          $FAILURE_END_MARKER"

          if [[ -n "$BASE_BODY" ]]; then
            NEW_BODY="${BASE_BODY}

          ${FAILURE_NOTE}"
          else
            NEW_BODY="$FAILURE_NOTE"
          fi

          gh release edit "$TAG" --repo="${{ github.repository }}" --notes "$NEW_BODY"
          echo "📝 Updated failure note with links to failed CI runs"

      - name: 📊 Summary
        if: always() && steps.payload.outputs.tag != ''
        env:
          TAG: ${{ steps.payload.outputs.tag }}
          ALL_PASSED: ${{ steps.check-cis.outputs.all_passed }}
          ANY_FAILED: ${{ steps.check-cis.outputs.any_failed }}
          ANY_RUNNING: ${{ steps.check-cis.outputs.any_running }}
        run: |
          echo "## Release Finalize Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ steps.payload.outputs.workflow }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$ALL_PASSED" == "true" ]]; then
            echo "### ✅ Release Published" >> $GITHUB_STEP_SUMMARY
            echo "All CI builds passed. Release has been published." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🧹 Old RC tags (for versions < \`$TAG\`) have been cleaned up." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ANY_FAILED" == "true" ]]; then
            echo "### ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "One or more CI builds failed. Release remains as draft." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ANY_RUNNING" == "true" ]]; then
            echo "### ⏳ Waiting for CI" >> $GITHUB_STEP_SUMMARY
            echo "Some CI builds are still running. Will check again when they complete." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⏳ CI Not Started" >> $GITHUB_STEP_SUMMARY
            echo "Waiting for CI workflows to start." >> $GITHUB_STEP_SUMMARY
          fi

  trigger-post-release-scans:
    name: Trigger post-release scans
    runs-on: ubuntu-latest
    needs: check-and-publish
    if: needs.check-and-publish.outputs.all_passed == 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - name: 🔍 Trigger post-release scans and tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-and-publish.outputs.tag }}
        run: |
          set -euo pipefail

          echo "🔍 Triggering post-release Grype container scan..."
          gh workflow run security-scan.yml \
            --repo="${{ github.repository }}" \
            --field tag="$TAG" || echo "⚠️ Failed to trigger Grype scan"

          echo "✅ Post-release workflows dispatched for $TAG"
