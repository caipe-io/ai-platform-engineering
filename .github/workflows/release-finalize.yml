name: "[Release] Finalize Release"

on:
  repository_dispatch:
    types: [ci-completed]
  workflow_run:
    workflows:
      - "[CI][MCP] MCP Servers Docker Build and Push"
      - "[CI] CAIPE RAG Build and Push"
      - "[CI] Dynamic Agents Build and Push"
      - "[CI] Harness Engine Build and Push"
      - "[CI] Autonomous Agents Build and Push"
      - "[CI] CAIPE UI Build and Push"
      - "[CI] Audit Service Build and Push"
      - "[CI] Slack Bot Build and Push"
      - "[CI] Skill Scanner Build and Push"
      - "[CI] Keycloak Init Build and Push"
      - "[CI] OpenFGA Authz Bridge Build and Push"
      - "[CI][Helm] Publish Tagged Helm Charts"
    types: [completed]

permissions:
  contents: read
  actions: read

# Build completions for one tag must not race to create its release entry.
concurrency:
  group: release-finalize-${{ github.event.client_payload.tag || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  check-and-publish:
    name: Check CI Status and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      all_passed: ${{ steps.check-cis.outputs.all_passed }}
      tag: ${{ steps.payload.outputs.tag }}
      published: ${{ steps.publish-release.outputs.published }}
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: 📥 Extract payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRIGGER_EVENT: ${{ github.event_name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_WORKFLOW: ${{ github.event.client_payload.workflow }}
          DISPATCH_CONCLUSION: ${{ github.event.client_payload.conclusion }}
        run: |
          set -euo pipefail

          TAG="$DISPATCH_TAG"
          WORKFLOW="$DISPATCH_WORKFLOW"
          CONCLUSION="$DISPATCH_CONCLUSION"

          # Completion events close the race where a component dispatch arrives
          # before its own run is marked completed. Never consume PR/fork code.
          if [[ "$TRIGGER_EVENT" == "workflow_run" ]]; then
            if [[ "$UPSTREAM_EVENT" != "push" || "$UPSTREAM_REPOSITORY" != "$GH_REPOSITORY" ]]; then
              exit 0
            fi
            TAG="$UPSTREAM_BRANCH"
            WORKFLOW="$UPSTREAM_WORKFLOW"
            CONCLUSION="$UPSTREAM_CONCLUSION"
            if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then exit 0; fi
            tag_sha=$(gh api "repos/${GH_REPOSITORY}/commits/${TAG}" --jq '.sha')
            if [[ "$tag_sha" != "$UPSTREAM_SHA" ]]; then exit 0; fi
          fi

          echo "🏷️ Tag: $TAG"
          echo "📦 Triggered by: $WORKFLOW"
          echo "📊 Conclusion: $CONCLUSION"

          if [[ -z "$TAG" ]]; then
            echo "❌ No tag in payload, skipping"
            exit 0
          fi

          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]] || (( ${#TAG} > 128 )); then
            echo "❌ Tag must match x.y.z or x.y.z-rc.N and be at most 128 characters"
            exit 1
          fi

          IS_RC=false
          if [[ "$TAG" == *-rc.* ]]; then IS_RC=true; fi
          tag_sha=$(gh api "repos/${GH_REPOSITORY}/commits/${TAG}" --jq '.sha')

          if ! [[ "$CONCLUSION" =~ ^(success|failure|cancelled|skipped|timed_out|action_required|neutral)$ ]]; then
            echo "❌ Unexpected workflow conclusion: $CONCLUSION"
            exit 1
          fi

          if [[ -z "$WORKFLOW" || ${#WORKFLOW} -gt 160 || "$WORKFLOW" == *$'\n'* || "$WORKFLOW" == *$'\r'* ]]; then
            echo "❌ Unexpected workflow name: $WORKFLOW"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "is_rc=$IS_RC"
            echo "tag_sha=$tag_sha"
            echo "workflow=$WORKFLOW"
            echo "conclusion=$CONCLUSION"
          } >> "$GITHUB_OUTPUT"

      - name: 🔍 Check all CI workflow statuses
        id: check-cis
        if: steps.payload.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
          EXPECTED_SHA: ${{ steps.payload.outputs.tag_sha }}
          IS_RC: ${{ steps.payload.outputs.is_rc }}
        run: |
          echo "🔍 Checking CI statuses for tag: $TAG"
          echo ""

          set -euo pipefail
          # Required CI workflows that must pass for stable and RC publication.
          # Skill Scanner is gated alongside the other component images so a
          # broken `ghcr.io/<owner>/skill-scanner:<appVersion>` actually blocks
          # the release — the skill-scanner subchart in
          # charts/ai-platform-engineering/charts/skill-scanner pulls that exact
          # tag, so an unbuilt image would otherwise produce ImagePullBackOff
          # on every fresh install with global.skillScanner.enabled=true.
          REQUIRED_WORKFLOWS=(
            "[CI][MCP] MCP Servers Docker Build and Push"
            "[CI] CAIPE RAG Build and Push"
            "[CI] Dynamic Agents Build and Push"
            "[CI] Harness Engine Build and Push"
            "[CI] Autonomous Agents Build and Push"
            "[CI] CAIPE UI Build and Push"
            "[CI] Audit Service Build and Push"
            "[CI] Slack Bot Build and Push"
            "[CI] Skill Scanner Build and Push"
            "[CI] Keycloak Init Build and Push"
            "[CI] OpenFGA Authz Bridge Build and Push"
            "[CI][Helm] Publish Tagged Helm Charts"
          )

          ALL_PASSED=true
          ANY_FAILED=false
          ANY_RUNNING=false
          MISSING_RUNS=()
          FAILED_RUNS=()

          for WF_NAME in "${REQUIRED_WORKFLOWS[@]}"; do
            echo -n "  📦 $WF_NAME: "

            # Get the most recent run for this workflow triggered on the tag ref
            # --repo is required because there's no checkout step
            RUN_DATA=$(gh run list \
              --repo="${{ github.repository }}" \
              --workflow="$WF_NAME" \
              --branch="$TAG" \
              --event=push \
              --limit=1 \
              --json status,conclusion,databaseId,headSha \
              2>/dev/null || echo "[]")

            RUN_COUNT=$(echo "$RUN_DATA" | jq 'length')
            if [[ "$RUN_COUNT" -eq 0 || -z "$RUN_DATA" || "$RUN_DATA" == "[]" ]]; then
              echo "⏳ not started yet"
              ALL_PASSED=false
              MISSING_RUNS+=("$WF_NAME")
              continue
            fi

            STATUS=$(echo "$RUN_DATA" | jq -r '.[0].status // "unknown"')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.[0].conclusion // "null"')
            RUN_ID=$(echo "$RUN_DATA" | jq -r '.[0].databaseId')
            RUN_SHA=$(echo "$RUN_DATA" | jq -r '.[0].headSha')

            if [[ "$RUN_SHA" != "$EXPECTED_SHA" ]]; then
              echo "❌ workflow commit does not match the release tag"
              ALL_PASSED=false
              ANY_FAILED=true
              continue
            fi

            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ passed"
              elif [[ "$CONCLUSION" == "skipped" && "$IS_RC" != true ]]; then
                echo "⏭️ skipped (OK for stable releases)"
              else
                echo "❌ failed ($CONCLUSION)"
                ALL_PASSED=false
                ANY_FAILED=true
                RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID"
                FAILED_RUNS+=("- [$WF_NAME]($RUN_URL) — \`$CONCLUSION\`")
              fi
            elif [[ "$STATUS" == "in_progress" || "$STATUS" == "queued" || "$STATUS" == "waiting" ]]; then
              echo "🔄 $STATUS"
              ALL_PASSED=false
              ANY_RUNNING=true
            else
              echo "❓ unknown status: $STATUS"
              ALL_PASSED=false
            fi
          done

          echo ""
          FAILED_RUNS_DELIMITER="failed-runs-$RANDOM-$(date +%s)"
          {
            echo "all_passed=$ALL_PASSED"
            echo "any_failed=$ANY_FAILED"
            echo "any_running=$ANY_RUNNING"
            echo "failed_runs<<$FAILED_RUNS_DELIMITER"
            printf '%s\n' "${FAILED_RUNS[@]}"
            echo "$FAILED_RUNS_DELIMITER"
          } >> "$GITHUB_OUTPUT"

          if [[ "$ALL_PASSED" == "true" ]]; then
            echo "✅ All CI workflows passed!"
          elif [[ "$ANY_FAILED" == "true" ]]; then
            echo "❌ Some CI workflows failed"
          elif [[ "$ANY_RUNNING" == "true" ]]; then
            echo "⏳ Some CI workflows still running, will check again when they complete"
          else
            echo "⏳ Waiting for CI workflows to start"
          fi

      - name: Checkout trusted RC publisher
        if: steps.check-cis.outputs.all_passed == 'true' && steps.payload.outputs.is_rc == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish RC pre-release
        id: publish-rc
        if: steps.check-cis.outputs.all_passed == 'true' && steps.payload.outputs.is_rc == 'true'
        uses: ./.github/actions/publish-rc-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.payload.outputs.tag }}

      - name: 🚀 Publish release
        id: publish-release
        if: steps.check-cis.outputs.all_passed == 'true' && steps.payload.outputs.is_rc == 'false'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          set -euo pipefail

          echo "🚀 Publishing release $TAG..."

          # Check if release exists and is a draft
          RELEASE_INFO=$(gh release view "$TAG" --repo="${{ github.repository }}" --json isDraft,url,body)
          IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')

          if [[ "$IS_DRAFT" == "false" ]]; then
            echo "ℹ️ Release $TAG is already published"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$IS_DRAFT" != "true" ]]; then
            echo "❌ Could not determine draft status for release $TAG"
            exit 1
          fi

          # Docs deploy independently of image CI. Keep the release as a draft
          # until the exact link in its body is reachable on the public site.
          NOTES_URL=$(jq -r '.body // ""' <<< "$RELEASE_INFO" | tr -d '\r' | sed -nE \
            's@^📖 Release notes: \[[^]]+ release notes\]\((https://caipe\.io/releases/[A-Za-z0-9][A-Za-z0-9._-]*)\)$@\1@p')
          if ! [[ "$NOTES_URL" =~ ^https://caipe\.io/releases/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "❌ Expected exactly one release-notes link in the draft body; leaving release as a draft"
            exit 1
          fi
          echo "📰 Waiting for release notes: $NOTES_URL"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 30 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --output /dev/null "$NOTES_URL"

          # Publish the release
          gh release edit "$TAG" --repo="${{ github.repository }}" --draft=false
          echo "published=true" >> "$GITHUB_OUTPUT"

          echo "✅ Release $TAG published!"
          echo "🔗 $(echo "$RELEASE_INFO" | jq -r '.url')"

      - name: ❌ Mark release as failed
        if: steps.check-cis.outputs.any_failed == 'true' && steps.payload.outputs.is_rc == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.payload.outputs.tag }}
          FAILED_RUNS: ${{ steps.check-cis.outputs.failed_runs }}
        run: |
          echo "❌ CI builds failed for $TAG"

          # Add or refresh a note on the release. The markers let subsequent
          # workflow completions update the complete list of failed runs.
          RELEASE_INFO=$(gh release view "$TAG" --repo="${{ github.repository }}" --json body 2>/dev/null || echo '{}')
          CURRENT_BODY=$(echo "$RELEASE_INFO" | jq -r '.body // ""')
          FAILURE_START_MARKER="<!-- ci-build-failure:start -->"
          FAILURE_END_MARKER="<!-- ci-build-failure:end -->"

          # release-manual.yml records the original workflow_dispatch actor in
          # the draft release body. Tag-push and repository_dispatch actors are
          # GitHub Apps, so they cannot identify the human release initiator.
          RELEASE_INITIATOR=$(printf '%s\n' "$CURRENT_BODY" | sed -nE \
            's/^<!-- release-initiator:([A-Za-z0-9-]{1,39}) -->$/\1/p' | head -n 1)
          if [[ -n "$RELEASE_INITIATOR" ]]; then
            INVESTIGATION_REQUEST="@$RELEASE_INITIATOR, please investigate and either:"
            echo "👤 Release initiated by @$RELEASE_INITIATOR"
          else
            INVESTIGATION_REQUEST="Please investigate and either:"
            echo "⚠️ Release initiator metadata was not found"
          fi

          if [[ "$CURRENT_BODY" == *"$FAILURE_START_MARKER"* ]]; then
            BASE_BODY=$(printf '%s\n' "$CURRENT_BODY" | awk \
              -v start="$FAILURE_START_MARKER" \
              -v end="$FAILURE_END_MARKER" '
                $0 == start { in_failure_note = 1; next }
                $0 == end { in_failure_note = 0; next }
                !in_failure_note { print }
              ')
          else
            BASE_BODY="$CURRENT_BODY"

            # Remove notes created before the managed markers were introduced.
            LEGACY_FAILURE_HEADING=$'\n---\n⚠️ **CI BUILD FAILURE** ⚠️'
            if [[ "$BASE_BODY" == *"$LEGACY_FAILURE_HEADING"* ]]; then
              BASE_BODY="${BASE_BODY%%"$LEGACY_FAILURE_HEADING"*}"
            fi
          fi

          FAILURE_NOTE="$FAILURE_START_MARKER

          ---
          ⚠️ **CI BUILD FAILURE** ⚠️

          One or more CI builds failed for this release.
          $INVESTIGATION_REQUEST
          1. Re-run the failed workflows (often retrigger of the same workflow run is sufficient as most fails are transient)
          2. If the failures are persistent, investigate and fix the underlying issue, then create a new release

          Failed CI workflow runs:
          $FAILED_RUNS

          _Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_
          $FAILURE_END_MARKER"

          if [[ -n "$BASE_BODY" ]]; then
            NEW_BODY="${BASE_BODY}

          ${FAILURE_NOTE}"
          else
            NEW_BODY="$FAILURE_NOTE"
          fi

          gh release edit "$TAG" --repo="${{ github.repository }}" --notes "$NEW_BODY"
          echo "📝 Updated failure note with links to failed CI runs"

      - name: 📊 Summary
        if: always() && steps.payload.outputs.tag != ''
        env:
          TAG: ${{ steps.payload.outputs.tag }}
          ALL_PASSED: ${{ steps.check-cis.outputs.all_passed }}
          ANY_FAILED: ${{ steps.check-cis.outputs.any_failed }}
          ANY_RUNNING: ${{ steps.check-cis.outputs.any_running }}
          TRIGGER_WORKFLOW: ${{ steps.payload.outputs.workflow }}
          PUBLISHED: ${{ steps.publish-release.outputs.published }}
          ALREADY_PUBLISHED: ${{ steps.publish-release.outputs.already_published }}
          RC_RESULT: ${{ steps.publish-rc.outcome }}
        run: |
          echo "## Release Finalize Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`$TRIGGER_WORKFLOW\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$RC_RESULT" == "success" ]]; then
            echo "### ✅ RC Pre-release Available" >> "$GITHUB_STEP_SUMMARY"
            echo "Required builds passed. The RC entry includes changes and installation commands." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISHED" == "true" ]]; then
            echo "### ✅ Release Published" >> $GITHUB_STEP_SUMMARY
            echo "All CI builds passed. Release has been published." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Existing RC Git tags are retained." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "### ✅ Release Already Published" >> $GITHUB_STEP_SUMMARY
            echo "This release was already published; its RC Git tags are retained." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ALL_PASSED" == "true" ]]; then
            echo "### ⚠️ Release Not Published" >> $GITHUB_STEP_SUMMARY
            echo "CI passed, but this run did not publish the release. Check the publication step, including release-notes availability." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ANY_FAILED" == "true" ]]; then
            echo "### ❌ Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "One or more CI builds failed. Publication is blocked; any existing draft remains unpublished." >> $GITHUB_STEP_SUMMARY
          elif [[ "$ANY_RUNNING" == "true" ]]; then
            echo "### ⏳ Waiting for CI" >> $GITHUB_STEP_SUMMARY
            echo "Some CI builds are still running. Will check again when they complete." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⏳ CI Not Started" >> $GITHUB_STEP_SUMMARY
            echo "Waiting for CI workflows to start." >> $GITHUB_STEP_SUMMARY
          fi

  trigger-post-release-scans:
    name: Trigger post-release scans
    runs-on: ubuntu-latest
    needs: check-and-publish
    if: needs.check-and-publish.outputs.published == 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - name: 🔍 Trigger post-release scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-and-publish.outputs.tag }}
        run: |
          set -euo pipefail

          echo "🔍 Triggering post-release Grype container scan..."
          # GITHUB_TOKEN publication does not trigger release workflows;
          # dispatch the corrected scanner from main with the exact release tag.
          gh workflow run security-scan.yml \
            --repo="${{ github.repository }}" \
            --ref main \
            --field tag="$TAG"

          echo "✅ Post-release workflows dispatched for $TAG"
