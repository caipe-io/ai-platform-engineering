name: "[Tests] Docker Compose smoke"

on:
  pull_request:
    paths:
      - 'docker-compose*.yaml'
      - '.env.example'
      - 'build/**'
      - 'ai_platform_engineering/knowledge_bases/rag/build/**'
      - 'deploy/**'
      - 'config/**'
      - 'charts/ai-platform-engineering/charts/keycloak/**'
      - 'charts/ai-platform-engineering/charts/openfga/**'
      - 'scripts/ci/compose-smoke/**'
      - '.github/workflows/test-compose.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yaml'
      - '.env.example'
      - 'build/**'
      - 'ai_platform_engineering/knowledge_bases/rag/build/**'
      - 'deploy/**'
      - 'config/**'
      - 'charts/ai-platform-engineering/charts/keycloak/**'
      - 'charts/ai-platform-engineering/charts/openfga/**'
      - 'scripts/ci/compose-smoke/**'
      - '.github/workflows/test-compose.yml'
  schedule:
    # Published dependency images can change without a repository commit.
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXTAUTH_SECRET: compose-smoke-test-only
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare public example environment
        run: cp .env.example .env
      - name: Test smoke harness
        run: python3 -m unittest discover -s scripts/ci/compose-smoke -p 'test_*.py'
      - name: Validate minimal and all-profile configurations
        run: |
          python3 scripts/ci/compose-smoke/run.py docker-compose.yaml config
          python3 scripts/ci/compose-smoke/run.py docker-compose.dev.yaml config

  smoke:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        file: [docker-compose.yaml, docker-compose.dev.yaml]
        lane: [platform, rag, graph, tracing]
    env:
      NEXTAUTH_SECRET: compose-smoke-test-only
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare public example environment
        run: |
          cp .env.example .env
          mkdir -p "$HOME/.aws"
      - name: Start services and test readiness, storage, and restart
        timeout-minutes: 50
        env:
          COMPOSE_FILE_UNDER_TEST: ${{ matrix.file }}
          SMOKE_LANE: ${{ matrix.lane }}
          # The runner context is only available at step level.
          DOCKER_VOLUME_DIRECTORY: ${{ runner.temp }}/compose-smoke-data
        run: python3 scripts/ci/compose-smoke/run.py "$COMPOSE_FILE_UNDER_TEST" "$SMOKE_LANE"
      - name: Collect diagnostics if the harness was interrupted
        if: always()
        run: |
          mkdir -p test-results/compose-smoke
          docker ps -a --filter label=com.docker.compose.project=compose-smoke \
            > test-results/compose-smoke/remaining-containers.txt
          for container in $(docker ps -aq --filter label=com.docker.compose.project=compose-smoke); do
            docker logs --tail 1000 "$container" \
              > "test-results/compose-smoke/interrupted-$container.log" 2>&1 || true
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compose-${{ matrix.file }}-${{ matrix.lane }}
          path: test-results/compose-smoke/
          if-no-files-found: warn
          retention-days: 7
