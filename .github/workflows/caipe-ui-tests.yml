name: "[CI] CAIPE UI Tests"
description: "Run CAIPE UI Jest tests and mocked RBAC Playwright regression on pull requests"

on:
  pull_request:
    paths:
      - 'ui/**'
      - '!ui/README.md'
      - '!ui/**/*.md'
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - '!ui/README.md'
      - '!ui/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Test External App examples
        working-directory: ui
        run: npm run test:external-app-examples

      - name: Run Jest tests
        id: jest
        working-directory: ui
        continue-on-error: true
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=json-summary --forceExit

      - name: Set test results
        id: test-results
        run: |
          if [ "${{ steps.jest.outcome }}" == "success" ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=brightgreen" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=red" >> $GITHUB_OUTPUT
          fi

      - name: Extract coverage data
        id: coverage
        working-directory: ui
        run: |
          set_defaults() {
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "lines=0" >> $GITHUB_OUTPUT
            echo "statements=0" >> $GITHUB_OUTPUT
            echo "functions=0" >> $GITHUB_OUTPUT
            echo "branches=0" >> $GITHUB_OUTPUT
            echo "linesCovered=0" >> $GITHUB_OUTPUT
            echo "linesTotal=0" >> $GITHUB_OUTPUT
            echo "stmtsCovered=0" >> $GITHUB_OUTPUT
            echo "stmtsTotal=0" >> $GITHUB_OUTPUT
            echo "funcsCovered=0" >> $GITHUB_OUTPUT
            echo "funcsTotal=0" >> $GITHUB_OUTPUT
            echo "branchesCovered=0" >> $GITHUB_OUTPUT
            echo "branchesTotal=0" >> $GITHUB_OUTPUT
            echo "lowCoverageFiles=[]" >> $GITHUB_OUTPUT
          }
          if [ ! -f coverage/coverage-summary.json ]; then
            set_defaults
            echo "⚠️ No coverage data found"
            exit 0
          fi
          out=$(mktemp)
          if node -e "
            try {
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage && coverage.total;
              if (!total) throw new Error('Missing total');
              const overall = Math.round(
                (total.lines.pct + total.statements.pct + total.functions.pct + total.branches.pct) / 4
              );
              const lines = total.lines.pct.toFixed(2);
              const statements = total.statements.pct.toFixed(2);
              const functions = total.functions.pct.toFixed(2);
              const branches = total.branches.pct.toFixed(2);
              console.log('percentage=' + overall);
              console.log('lines=' + lines);
              console.log('statements=' + statements);
              console.log('functions=' + functions);
              console.log('branches=' + branches);
              console.log('linesCovered=' + total.lines.covered);
              console.log('linesTotal=' + total.lines.total);
              console.log('stmtsCovered=' + total.statements.covered);
              console.log('stmtsTotal=' + total.statements.total);
              console.log('funcsCovered=' + total.functions.covered);
              console.log('funcsTotal=' + total.functions.total);
              console.log('branchesCovered=' + total.branches.covered);
              console.log('branchesTotal=' + total.branches.total);
              const files = Object.entries(coverage)
                .filter(([path]) => path !== 'total')
                .map(([path, data]) => ({
                  path: path.replace(/^.*\/ui\//, ''),
                  coverage: Math.round(
                    (data.lines.pct + data.statements.pct + data.functions.pct + data.branches.pct) / 4
                  )
                }))
                .sort((a, b) => a.coverage - b.coverage)
                .slice(0, 10);
              console.log('lowCoverageFiles=' + JSON.stringify(files));
            } catch (e) {
              process.exit(1);
            }
          " > "$out" 2>/dev/null; then
            cat "$out" >> $GITHUB_OUTPUT
            echo "✅ Coverage extracted successfully"
          else
            set_defaults
            echo "⚠️ Coverage format unexpected, using defaults"
          fi
          rm -f "$out"

      - name: Comment test results on PR
        # Fork PRs receive a read-only token, so attempting to write a comment
        # would turn an otherwise successful test job red.
        if: >-
          ${{ always() &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const testStatus = '${{ steps.test-results.outputs.status }}';
            const testEmoji = '${{ steps.test-results.outputs.emoji }}';
            const percentage = '${{ steps.coverage.outputs.percentage }}' || '0';
            const lines = '${{ steps.coverage.outputs.lines }}' || '0';
            const statements = '${{ steps.coverage.outputs.statements }}' || '0';
            const functions = '${{ steps.coverage.outputs.functions }}' || '0';
            const branches = '${{ steps.coverage.outputs.branches }}' || '0';
            const linesCovered = '${{ steps.coverage.outputs.linesCovered }}' || '0';
            const linesTotal = '${{ steps.coverage.outputs.linesTotal }}' || '0';
            const stmtsCovered = '${{ steps.coverage.outputs.stmtsCovered }}' || '0';
            const stmtsTotal = '${{ steps.coverage.outputs.stmtsTotal }}' || '0';
            const funcsCovered = '${{ steps.coverage.outputs.funcsCovered }}' || '0';
            const funcsTotal = '${{ steps.coverage.outputs.funcsTotal }}' || '0';
            const branchesCovered = '${{ steps.coverage.outputs.branchesCovered }}' || '0';
            const branchesTotal = '${{ steps.coverage.outputs.branchesTotal }}' || '0';

            // Test status section
            const testStatusText = testStatus === 'passed'
              ? '✅ **All tests passed**'
              : '❌ **Tests failed** - Please review the logs';

            // Create coverage badge color
            let badgeColor = 'red';
            let statusEmoji = '🔴';
            if (percentage >= 80) { badgeColor = 'brightgreen'; statusEmoji = '🟢'; }
            else if (percentage >= 60) { badgeColor = 'yellow'; statusEmoji = '🟡'; }
            else if (percentage >= 40) { badgeColor = 'orange'; statusEmoji = '🟠'; }

            // Create metric badges
            const getMetricBadge = (pct, name) => {
              let color = 'red';
              if (pct >= 80) color = 'brightgreen';
              else if (pct >= 60) color = 'yellow';
              else if (pct >= 40) color = 'orange';
              return '![' + name + '](https://img.shields.io/badge/' + name + '-' + pct + '%25-' + color + ')';
            };

            const comment = `## 🧪 CAIPE UI Test Results

            ${testStatusText}

            ### ${statusEmoji} Overall Coverage: ${percentage}%

            ![Coverage](https://img.shields.io/badge/overall-${percentage}%25-${badgeColor})
            ${getMetricBadge(lines, 'lines')}
            ${getMetricBadge(statements, 'statements')}
            ${getMetricBadge(functions, 'functions')}
            ${getMetricBadge(branches, 'branches')}

            ### 📊 Detailed Coverage

            | Metric | Covered | Total | Percentage |
            |--------|---------|-------|------------|
            | **Lines** | ${linesCovered} | ${linesTotal} | ${lines}% |
            | **Statements** | ${stmtsCovered} | ${stmtsTotal} | ${statements}% |
            | **Functions** | ${funcsCovered} | ${funcsTotal} | ${functions}% |
            | **Branches** | ${branchesCovered} | ${branchesTotal} | ${branches}% |

            ### ✅ Test Suites

            - ✅ auth-guard.test.tsx - Route protection & authorization
            - ✅ token-expiry-guard.test.tsx - Token expiry handling
            - ✅ dynamic-agent-client.test.ts - Dynamic Agents streaming client
            - ✅ auth-utils.test.ts - Authentication utilities (100% coverage)
            - ✅ auth-config.test.ts - OIDC configuration

            <details>
            <summary>📈 Coverage Thresholds</summary>

            | Threshold | Target | Current | Status |
            |-----------|--------|---------|--------|
            | Minimum | 40% | ${percentage}% | ${percentage >= 40 ? '✅ Pass' : '❌ Fail'} |
            | Good | 60% | ${percentage}% | ${percentage >= 60 ? '✅ Pass' : '⚠️ Below target'} |
            | Excellent | 80% | ${percentage}% | ${percentage >= 80 ? '✅ Pass' : '⚠️ Below target'} |

            </details>

            <details>
            <summary>⚠️ Areas Needing Tests</summary>

            **High Priority:**
            - lib/streaming/* - Core stream event handling
            - store/chat-store.ts - Chat state management
            - store/agent-skills-store.ts - Agent skills
            - lib/api-client.ts - API communication
            - lib/storage-mode.ts - MongoDB/localStorage switching

            **Medium Priority:**
            - components/chat/ChatPanel.tsx - Main chat interface
            - lib/mongodb.ts - MongoDB integration

            </details>

            ---

            💡 **Run locally:** make caipe-ui-tests
            📦 **Full report:** Check workflow artifacts`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('🧪 CAIPE UI Test Results')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: ui/coverage/
          retention-days: 7

      - name: Fail if tests failed
        if: steps.jest.outcome == 'failure'
        run: |
          echo "❌ Tests failed. Please review the errors above."
          exit 1

  playwright-rbac-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]'
    permissions:
      contents: read
      packages: read
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: |
          # assisted-by Codex Codex-sonnet-4-6
          for attempt in 1 2 3; do
            npm ci && break
            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

      - name: Build CAIPE UI
        working-directory: ui
        env:
          WORKFLOWS_ENABLED: 'true'
          # The mocked Settings regression opens the authenticated user menu.
          # This public setting is compiled into the client bundle, so set it
          # while building as well as when serving the app below.
          NEXT_PUBLIC_SSO_ENABLED: 'true'
          # The specs mock every API, so no real database is contacted. But the
          # home page gates shared-conversation / insights UI on server-side
          # storage mode (getStorageMode reads MONGODB_URI + MONGODB_DATABASE at
          # render time). Set dummy values so SSR renders in "mongodb" mode and
          # those components exist in the server markup for the mocks to drive.
          MONGODB_URI: 'mongodb://mock:27017'
          MONGODB_DATABASE: 'mock'
        run: npm run build

      - name: Start CAIPE UI server
        working-directory: ui
        env:
          WORKFLOWS_ENABLED: 'true'
          NEXT_PUBLIC_SSO_ENABLED: 'true'
          MONGODB_URI: 'mongodb://mock:27017'
          MONGODB_DATABASE: 'mock'
        run: |
          # Run the production server, not `next dev`: React StrictMode
          # double-invokes effects only in dev, which breaks exact
          # request-count assertions in several specs.
          npx next start --port 3000 > /tmp/caipe-ui-dev.log 2>&1 &
          echo $! > /tmp/caipe-ui-dev.pid

      - name: Wait for CAIPE UI
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "CAIPE UI is up"
              exit 0
            fi
            sleep 2
          done
          echo "CAIPE UI failed to start"
          tail -n 200 /tmp/caipe-ui-dev.log || true
          exit 1

      - name: Run mocked RBAC Playwright regression
        id: playwright
        working-directory: ui
        # The container's default shell is sh (dash); mapfile + process
        # substitution below are bash builtins, so pin the shell to bash.
        shell: bash
        env:
          RUN_RBAC_REGRESSION: '1'
          CAIPE_UI_BASE_URL: http://localhost:3000
          WORKFLOWS_ENABLED: 'true'
        run: |
          # Run every mocked-RBAC spec under e2e/rbac/, excluding the
          # *-live.spec.ts files (those need live Keycloak/OpenFGA infra and
          # are only exercised by the label-gated e2e lane in test-rbac.yaml).
          # A glob keeps this job in sync automatically as specs are added —
          # see issue #2124, which tracked a stale hardcoded 11-file list that
          # silently skipped newly-added specs.
          mapfile -t specs < <(find e2e/rbac -maxdepth 1 -name '*.spec.ts' ! -name '*-live.spec.ts' | sort)
          # Fail loud if the glob matches nothing — otherwise `playwright test`
          # with no files would silently pass and re-introduce the #2124 gap.
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::No mocked-RBAC specs matched e2e/rbac/*.spec.ts (excluding *-live). Check the glob."
            exit 1
          fi
          echo "Running ${#specs[@]} mocked-RBAC spec files."
          npx playwright test "${specs[@]}" --config=playwright.rbac.config.ts

      - name: Upload Playwright artifacts
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-rbac-regression
          path: |
            ui/test-results/
            ui/playwright-report/
          retention-days: 7

      - name: Stop CAIPE UI dev server
        if: always()
        run: |
          if [ -f /tmp/caipe-ui-dev.pid ]; then
            kill "$(cat /tmp/caipe-ui-dev.pid)" 2>/dev/null || true
          fi

      - name: Fail if Playwright tests failed
        if: steps.playwright.outcome == 'failure'
        run: |
          echo "❌ Mocked RBAC Playwright regression failed. Review the errors above."
          exit 1

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run TypeScript type checking
        working-directory: ui
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run ESLint
        working-directory: ui
        run: npm run lint
