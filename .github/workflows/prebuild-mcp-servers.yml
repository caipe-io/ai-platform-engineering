name: "[Prebuild][MCP] MCP Servers Docker Build and Push"
description: "Build and push MCP server Docker images"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ai_platform_engineering/mcp/**'
      - '.github/**'
      - 'build/agents/Dockerfile.mcp'
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to publish prebuild for'
        required: true
        type: number
      head_ref:
        description: 'PR head branch ref'
        required: true
        type: string
      head_sha:
        description: 'PR head commit SHA'
        required: true
        type: string
      base_ref:
        description: 'PR base branch ref'
        required: true
        type: string
      base_sha:
        description: 'PR base commit SHA'
        required: false
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  load-config:
    runs-on: ubuntu-latest
    if: |
      (github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]') &&
      (
        startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
        github.event.action != 'closed'
      )
    outputs:
      all_agents: ${{ steps.read-config.outputs.all_agents }}
      mcp_build_args: ${{ steps.read-config.outputs.mcp_build_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          sparse-checkout: .github/agents.json
          sparse-checkout-cone-mode: false

      - name: Read agents config
        id: read-config
        run: |
          ALL_AGENTS=$(jq -c '.mcp_agents' .github/agents.json)
          MCP_BUILD_ARGS=$(jq -c '.mcp_build_args // {}' .github/agents.json)
          echo "all_agents=$ALL_AGENTS" >> $GITHUB_OUTPUT
          echo "mcp_build_args=$MCP_BUILD_ARGS" >> $GITHUB_OUTPUT

  determine-agents:
    runs-on: ubuntu-latest
    needs: load-config
    if: |
      startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
      github.event.action != 'closed'
    outputs:
      agents: ${{ steps.set-matrix.outputs.agents }}
      should_build: ${{ steps.set-matrix.outputs.should_build }}
      mcp_build_args: ${{ needs.load-config.outputs.mcp_build_args }}
    env:
      ALL_AGENTS: ${{ needs.load-config.outputs.all_agents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Generate path filters
        id: generate-filters
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const agents = JSON.parse(process.env.ALL_AGENTS);
            let filters = 'shared_inputs:\n';
            filters += '  - \'build/agents/Dockerfile.mcp\'\n';
            filters += '  - \'ai_platform_engineering/mcp/common/**\'\n';
            filters += '  - \'.github/agents.json\'\n';
            filters += '  - \'.github/workflows/prebuild-mcp-servers.yml\'\n';
            filters += '  - \'.github/actions/prebuild-status/**\'\n';
            filters += '  - \'.github/actions/publish-prebuild-manifest/**\'\n';
            agents.forEach(agent => {
              filters += `${agent}:\n`;
              filters += `  - 'ai_platform_engineering/mcp/${agent}/**'\n`;
            });
            core.setOutput('filters', filters);

      - name: Detect changed paths (MCP)
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          filters: ${{ steps.generate-filters.outputs.filters }}

      - name: Set matrix based on changes (MCP)
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_ALL: ${{ steps.filter.outputs.shared_inputs == 'true' }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
        with:
          script: |
            const allAgents = JSON.parse(process.env.ALL_AGENTS);
            const buildAll = process.env.BUILD_ALL === 'true';
            const filterOutputs = JSON.parse(process.env.FILTER_OUTPUTS);
            let selected;
            if (buildAll) {
              selected = allAgents;
            } else {
              selected = allAgents.filter(a => filterOutputs[a] === 'true');
            }
            core.setOutput('agents', JSON.stringify(selected));
            core.setOutput('should_build', String(selected.length > 0));

  build:
    runs-on: ${{ matrix.runner }}
    needs: determine-agents
    if: |
      needs.determine-agents.outputs.should_build == 'true' &&
      startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
      github.event.action != 'closed'
    permissions:
      contents: write
      packages: write
      pull-requests: write

    strategy:
      matrix:
        agent: ${{ fromJson(needs.determine-agents.outputs.agents) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
      fail-fast: false

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/mcp-${{ matrix.agent }}

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute prebuild tag
        id: compute_tag
        shell: bash
        env:
          BRANCH: ${{ inputs.head_ref || github.head_ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          BRANCH_NO_PREFIX="${BRANCH#prebuild/}"
          BRANCH_SANITIZED="${BRANCH_NO_PREFIX//\//-}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BASE_SHA"
          else
            BASE_COMMIT="origin/${BASE_REF}"
          fi
          COMMIT_COUNT=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          PREBUILD_TAG="${BRANCH_SANITIZED}-${COMMIT_COUNT}"
          echo "BRANCH_BARE=${BRANCH_SANITIZED}" >> $GITHUB_ENV
          echo "PREBUILD_TAG=${PREBUILD_TAG}" >> $GITHUB_ENV
          echo "prebuild_tag=${PREBUILD_TAG}" >> $GITHUB_OUTPUT

      - name: Upload building prebuild status
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.head_ref }}
          source: mcp-agent
          type: docker
          name: mcp-${{ matrix.agent }}
          repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tag: ${{ steps.compute_tag.outputs.prebuild_tag }}
          ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          status: building
          artifact_suffix: start

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.PREBUILD_TAG }}

      - name: Resolve per-agent MCP build args
        id: mcp_build_args
        env:
          MCP_BUILD_ARGS: ${{ needs.determine-agents.outputs.mcp_build_args }}
          AGENT: ${{ matrix.agent }}
        run: |
          EXTRA=$(jq -r --arg a "$AGENT" '.[$a] // {} | to_entries | map("\(.key)=\(.value)") | .[]' <<< "$MCP_BUILD_ARGS")
          {
            echo 'extra<<EOF'
            echo "$EXTRA"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push MCP image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: build/agents/Dockerfile.mcp
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.cnoe.prebuild.branch=${{ env.BRANCH_BARE }}
          build-args: |
            AGENT_NAME=${{ matrix.agent }}
            ${{ steps.mcp_build_args.outputs.extra }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=prebuild-${{ matrix.agent }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prebuild-${{ matrix.agent }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.agent }}--${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [determine-agents, build]
    if: |
      always() &&
      needs.determine-agents.result == 'success' &&
      needs.determine-agents.outputs.should_build == 'true' &&
      startsWith(inputs.head_ref || github.head_ref, 'prebuild/') &&
      github.event.action != 'closed'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    strategy:
      matrix:
        agent: ${{ fromJson(needs.determine-agents.outputs.agents) }}
      fail-fast: false
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/mcp-${{ matrix.agent }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.head_sha || github.ref }}
          fetch-depth: 0

      - name: Compute prebuild tag
        id: compute_tag
        shell: bash
        env:
          HEAD_REF: ${{ inputs.head_ref || github.head_ref }}
          BASE_REF: ${{ inputs.base_ref || github.event.pull_request.base.ref }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
        run: |
          BRANCH_NO_PREFIX="${HEAD_REF#prebuild/}"
          BRANCH_SANITIZED="${BRANCH_NO_PREFIX//\//-}"
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_COMMIT="$BASE_SHA"
          else
            BASE_COMMIT="origin/${BASE_REF}"
          fi
          COMMIT_COUNT=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          echo "prebuild_tag=${BRANCH_SANITIZED}-${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Publish multi-architecture image
        id: publish
        uses: ./.github/actions/publish-prebuild-manifest
        with:
          artifact_pattern: digests-${{ matrix.agent }}--*
          image_repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ github.token }}

      - name: Upload final prebuild status
        if: ${{ always() && steps.compute_tag.outputs.prebuild_tag != '' }}
        uses: ./.github/actions/prebuild-status
        with:
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          head_sha: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          head_ref: ${{ inputs.head_ref || github.head_ref }}
          source: mcp-agent
          type: docker
          name: mcp-${{ matrix.agent }}
          repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tag: ${{ steps.compute_tag.outputs.prebuild_tag }}
          ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.compute_tag.outputs.prebuild_tag }}
          status: ${{ steps.publish.outcome == 'success' && 'published' || 'failed' }}
          artifact_suffix: final
