name: "[CI] PR Version Bump"
description: "PR flow labeling, mergeability/staleness checks, and release/*→main version preparation"

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Check PR eligibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: 🔍 Check changed paths or release merge
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;

            // A release/*→main PR commits release preparation directly onto
            // the PR's own branch, which needs the CI_BUILD_APP_ID/PRIVATE_KEY
            // secrets to mint a push-capable token. Fork-triggered
            // pull_request runs never receive repo secrets (GitHub security
            // boundary) and the default GITHUB_TOKEN is forced read-only for
            // them too, so there is no token here that could push to someone
            // else's fork anyway. Skip cleanly instead of failing every
            // external contributor's PR.
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const isFork = pr.head.repo?.full_name !== repoFullName;
            if (isFork) {
              core.setOutput('should_run', 'false');
              core.setOutput('reason', `fork PR from ${pr.head.repo?.full_name ?? 'unknown'} — release preparation only applies to release/*→main PRs on this repo`);
              core.notice(`should_run=false: fork PR (${pr.head.repo?.full_name}) — skipping.`);
              return;
            }

            // Dependabot-triggered pull_request runs are on a branch of this
            // same repo (not a fork), but GitHub Actions still denies them
            // repo secrets by default — same CI_BUILD_APP_ID/PRIVATE_KEY gap
            // as the fork case above, just a different trigger for it.
            const isDependabot = context.actor === 'dependabot[bot]' || pr.user?.login === 'dependabot[bot]';
            if (isDependabot) {
              core.setOutput('should_run', 'false');
              core.setOutput('reason', 'Dependabot PR — GitHub Actions denies repo secrets to Dependabot-triggered pull_request runs');
              core.notice('should_run=false: Dependabot PR — skipping.');
              return;
            }

            const supportedBase = pr.base.ref === 'main' || pr.base.ref.startsWith('release/');
            if (!supportedBase) {
              core.setOutput('should_run', 'false');
              core.setOutput('reason', `unsupported base branch ${pr.base.ref}`);
              core.info(`should_run=false: unsupported base branch ${pr.base.ref}`);
              return;
            }

            const releaseMergeRe = /^release\/\d+\.\d+\.\d+(?:-hotfix)?$/;
            const isReleaseMerge = pr.base.ref === 'main' && releaseMergeRe.test(pr.head.ref);

            const watchedPrefixes = [
              'charts/',
              'ai_platform_engineering/',
              'build/',
              'ui/'
            ];
            const watchedFiles = new Set([
              'pyproject.toml',
              'uv.lock'
            ]);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const matchedFile = files.find(({ filename }) =>
              watchedPrefixes.some(prefix => filename.startsWith(prefix)) ||
              watchedFiles.has(filename)
            );

            const shouldRun = isReleaseMerge || Boolean(matchedFile);
            const reason = isReleaseMerge
              ? `release merge ${pr.head.ref} -> ${pr.base.ref}`
              : matchedFile
                ? `matched path ${matchedFile.filename}`
                : 'no watched path changes';

            core.setOutput('should_run', String(shouldRun));
            core.setOutput('reason', reason);
            core.info(`should_run=${shouldRun}: ${reason}`);

  version-bump:
    name: Bump version files on PR
    runs-on: ubuntu-latest
    needs: eligibility
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    # Don't run on commits made by the bot (avoid infinite loop)
    if: needs.eligibility.outputs.should_run == 'true' && github.actor != 'github-actions[bot]' && github.actor != 'caipe-ci-release[bot]'
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🔍 Check if PR branch is up to date
        id: branch-status
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          BASE_SHA=$(git rev-parse "origin/${BASE_REF}")
          MERGE_BASE=$(git merge-base HEAD "origin/${BASE_REF}")

          NEEDS_UPDATE=false
          if [[ "$MERGE_BASE" != "$BASE_SHA" ]]; then
            NEEDS_UPDATE=true
            echo "⚠️ $HEAD_REF does not contain latest $BASE_REF ($BASE_SHA)"
          else
            echo "✅ $HEAD_REF contains latest $BASE_REF"
          fi

          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "merge_base=$MERGE_BASE" >> $GITHUB_OUTPUT
          echo "needs_update=$NEEDS_UPDATE" >> $GITHUB_OUTPUT

      - name: 🔍 Check PR mergeability
        id: mergeability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            let pr;
            for (let attempt = 0; attempt < 3; attempt++) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = response.data;

              if (pr.mergeable !== null) {
                break;
              }

              await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
            }

            const mergeableState = pr.mergeable_state || '';
            const hasConflicts = mergeableState === 'dirty';

            core.setOutput('mergeable', String(pr.mergeable));
            core.setOutput('mergeable_state', mergeableState);
            core.setOutput('has_conflicts', String(hasConflicts));

            console.log(`mergeable=${pr.mergeable}, mergeable_state=${mergeableState}`);

      - name: 🏷️ Apply PR flow label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const baseRef = process.env.BASE_REF;
            const headRef = process.env.HEAD_REF;
            const releaseBranchRe = /^release\/(\d+\.\d+\.\d+(?:-hotfix)?)$/;

            const baseRelease = baseRef.match(releaseBranchRe);
            const headRelease = headRef.match(releaseBranchRe);

            let label;
            if (baseRelease) {
              label = {
                name: baseRelease[1],
                color: baseRelease[1].endsWith('-hotfix') ? 'd93f0b' : '0e8a16',
                description: `PR targets ${baseRef}`
              };
            } else if (baseRef === 'main' && headRelease) {
              label = {
                name: headRef,
                color: headRelease[1].endsWith('-hotfix') ? 'fbca04' : '1d76db',
                description: `Release branch merge from ${headRef} to main`
              };
            } else if (baseRef === 'main') {
              label = {
                name: 'dev',
                color: 'c5def5',
                description: 'Normal PR to main'
              };
            } else {
              core.info(`No PR flow label configured for ${headRef} -> ${baseRef}`);
              return;
            }

            async function ensureLabel({ name, color, description }) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                core.info(`Creating missing label: ${name}`);
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                  core.info(`Label already exists after concurrent create: ${name}`);
                }
              }
            }

            await ensureLabel(label);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [label.name]
            });

            core.info(`Applied PR flow label: ${label.name}`);

      - name: 💬 Comment if branch needs update
        id: branch-update-comment
        if: steps.branch-status.outputs.needs_update == 'true' || steps.mergeability.outputs.has_conflicts == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HAS_CONFLICTS: ${{ steps.mergeability.outputs.has_conflicts }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const baseRef = process.env.BASE_REF;
            const headRef = process.env.HEAD_REF;
            const headSha = process.env.HEAD_SHA;
            const headRepo = process.env.HEAD_REPO;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const markerPrefix = '<!-- pr-version-bump:update-branch';
            const marker = `<!-- pr-version-bump:update-branch sha=${headSha} -->`;
            const isFork = headRepo !== repo;
            const isPrebuild = headRef.startsWith('prebuild/');
            const hasConflicts = process.env.HAS_CONFLICTS === 'true';

            const commands = isFork
              ? [
                  `git fetch https://github.com/${repo}.git ${baseRef}`,
                  `git checkout ${headRef}`,
                  `git merge FETCH_HEAD`,
                  `git push`
                ]
              : [
                  `git fetch origin ${baseRef}`,
                  `git checkout ${headRef}`,
                  `git merge FETCH_HEAD`,
                  `git push`
                ];

            let body = `${marker}\n`;
            if (hasConflicts) {
              body += `## ❗ Merge conflicts with \`${baseRef}\`\n\n`;
              body += `**Commit:** \`${headSha.slice(0, 8)}\`\n\n`;
              body += `This PR has merge conflicts with \`${baseRef}\` that must be resolved before it can merge. Resolve them by running:\n\n`;
            } else {
              body += `## ℹ️ Branch is behind \`${baseRef}\` (advisory, non-blocking)\n\n`;
              body += `**Commit:** \`${headSha.slice(0, 8)}\`\n\n`;
              body += `This branch does not yet contain the latest \`${baseRef}\`. This does **not** fail this check — GitHub branch protection still requires the branch to be up to date before merge. Use the **Update branch** button on this PR, or run:\n\n`;
            }
            body += '```bash\n';
            body += commands.join('\n');
            body += '\n```\n\n';

            if (isPrebuild) {
              body += `This is a \`prebuild/*\` branch — Helm prebuild publishing runs independently of this check, so you can keep testing chart changes while the branch is being updated.\n`;
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100
              });

              const existing = comments.filter(comment =>
                comment.user?.type === 'Bot' && (comment.body || '').includes(markerPrefix)
              );

              for (const comment of existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id
                });
              }

              const response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
              const commentUrl = response.data.html_url || '';
              const result = existing.length > 0 ? 'recreated' : 'created';
              core.setOutput('result', result);
              core.setOutput('comment_url', commentUrl);
              core.notice(`Branch update PR comment ${result}: ${commentUrl}`);
            } catch (error) {
              core.setOutput('result', 'failed');
              core.setOutput('error', error.message);
              core.warning(`Failed to replace branch update PR comment: ${error.message}`);
            }

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # ── Detect release/* → main PR ─────────────────────────────────────
      - name: 🔍 Check if release merge PR
        id: release-check
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)(-hotfix)?$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "is_release_merge=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "🚀 Release merge PR detected: $HEAD_REF → main"

            RAW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            if [[ "$RAW_VERSION" == "$VERSION" ]]; then
              echo "needs_prepare=false" >> $GITHUB_OUTPUT
              echo "✅ Release merge PR already prepared at $VERSION"
            else
              echo "needs_prepare=true" >> $GITHUB_OUTPUT
              echo "📦 Release merge PR needs final version bump: $RAW_VERSION → $VERSION"
            fi
          else
            echo "is_release_merge=false" >> $GITHUB_OUTPUT
            echo "needs_prepare=false" >> $GITHUB_OUTPUT
          fi

      # ── Release merge path: prepare-release action ─────────────────────
      - name: 📦 Prepare release (update files + changelog)
        if: ${{ steps.release-check.outputs.is_release_merge == 'true' && steps.release-check.outputs.needs_prepare == 'true' && steps.branch-status.outputs.needs_update != 'true' && steps.mergeability.outputs.has_conflicts != 'true' }}
        uses: ./.github/actions/prepare-release
        with:
          version: ${{ steps.release-check.outputs.version }}

      # ── Commit release preparation onto release/*→main PR branch ───────
      - name: 📤 Commit release preparation
        if: steps.release-check.outputs.is_release_merge == 'true' && steps.release-check.outputs.needs_prepare == 'true' && steps.branch-status.outputs.needs_update != 'true' && steps.mergeability.outputs.has_conflicts != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml uv.lock CHANGELOG.md docs/docusaurus.config.ts docs/src/pages/index.tsx || true
          find charts -name "Chart.yaml" -type f -exec git add {} +

          if git diff --cached --quiet; then
            echo "ℹ️ Already prepared at $RELEASE_VERSION — nothing to commit"
          else
            git commit -m "chore: bump version to $RELEASE_VERSION"
            git push
            echo "✅ Committed version bump to $RELEASE_VERSION"
          fi

      # Don't double-gate on staleness: GitHub branch protection's "Require
      # branches to be up to date before merging" already enforces freshness at
      # merge time. Failing here too just flips every open PR red whenever main
      # advances. Being behind base is advisory; only real conflicts hard-fail.
      - name: ℹ️ Branch behind base (non-blocking)
        if: steps.branch-status.outputs.needs_update == 'true' && steps.mergeability.outputs.has_conflicts != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "::notice::This PR branch is behind ${BASE_REF}. Not failing this check — branch protection enforces up-to-date at merge time."

      - name: ❌ Require conflict resolution before merge
        if: steps.mergeability.outputs.has_conflicts == 'true'
        env:
          COMMENT_RESULT: ${{ steps.branch-update-comment.outputs.result }}
          COMMENT_URL: ${{ steps.branch-update-comment.outputs.comment_url }}
          COMMENT_ERROR: ${{ steps.branch-update-comment.outputs.error }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$COMMENT_RESULT" == "created" || "$COMMENT_RESULT" == "recreated" ]]; then
            echo "::error::This PR has merge conflicts with $BASE_REF that must be resolved before it can merge. A PR comment with the exact commands is available: $COMMENT_URL"
          else
            echo "::error::This PR has merge conflicts with $BASE_REF that must be resolved before it can merge, but CI could not create a fresh PR comment: ${COMMENT_ERROR:-unknown error}"
            echo "Run:"
            if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
              echo "git fetch https://github.com/${BASE_REPO}.git ${BASE_REF}"
            else
              echo "git fetch origin ${BASE_REF}"
            fi
            echo "git checkout ${HEAD_REF}"
            echo "git merge FETCH_HEAD"
            echo "git push"
          fi
          exit 1
