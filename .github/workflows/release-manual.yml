name: "[Release] Manual Version Release"
description: "Manually trigger a new release by specifying the version"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to release (e.g., 1.0.0 or 1.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Commit version bump (pyproject.toml + Chart.yaml), changelog, and tag
  commit-release:
    name: Commit Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    outputs:
      current_version: ${{ steps.validate.outputs.current_version }}
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: ✅ Validate version format and monotonicity
        uses: ./.github/actions/validate-release-tag
        with:
          version: ${{ env.RELEASE_VERSION }}

      - name: 📰 Require a release post for the minor series
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"

          # Release candidates ship before their series post is written; only a
          # final release must have published notes to link to.
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "⏭️  $VERSION is a release candidate — series post not required yet"
            exit 0
          fi

          BASE_VERSION="${VERSION%%-*}"
          SERIES_MAJOR_MINOR="${BASE_VERSION%.*}"
          SERIES_SLUG="release-${SERIES_MAJOR_MINOR//./-}-0"

          if compgen -G "docs/releases/*${SERIES_SLUG}.md" > /dev/null; then
            echo "✅ Found release post for the ${SERIES_MAJOR_MINOR}.0 series"
            exit 0
          fi

          echo "❌ ERROR: no release post for the ${SERIES_MAJOR_MINOR}.0 series"
          echo "   Expected a file matching: docs/releases/*${SERIES_SLUG}.md"
          echo "   Release notes are published once per minor series and are what"
          echo "   the in-app About dialog and GitHub Release link to, so the post"
          echo "   must land before $VERSION is tagged."
          exit 1

      - name: 🔍 Read current version
        id: validate
        run: |
          set -euo pipefail

          RAW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "📋 Current version: $RAW_VERSION"
          echo "current_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: 📦 Prepare release (update files + changelog + verify)
        uses: ./.github/actions/prepare-release
        with:
          version: ${{ github.event.inputs.version }}

      - name:  Commit, tag, and push
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage changes (pyproject.toml, uv.lock, Chart.yaml files, changelog)
          git add pyproject.toml CHANGELOG.md uv.lock
          find charts -name "Chart.yaml" -type f -exec git add {} +

          # Commit — may be a no-op if pr-version-bump already prepared everything
          if git diff --cached --quiet; then
            echo "ℹ️ No file changes needed — files already at $NEW_VERSION"
          else
            CURRENT_VERSION="${{ steps.validate.outputs.current_version }}"
            if [[ -n "$CURRENT_VERSION" ]]; then
              git commit -m "bump: version $CURRENT_VERSION → $NEW_VERSION"
            else
              git commit -m "bump: release $NEW_VERSION"
            fi
            echo "✅ Committed version file updates"
          fi

          # Create annotated tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"

          # Push commit and tag
          git push origin main
          git push origin "$NEW_VERSION"

          echo "✅ Committed and pushed release $NEW_VERSION"
          echo ""
          echo "🏷️ Tag '$NEW_VERSION' created and pushed"

  # Then: create draft release. The tag push triggers CI builds automatically.
  publish-release:
    name: Create Draft Release
    needs: commit-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 🚀 Create GitHub Release (Draft)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_INITIATOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"
          echo "🔄 Creating DRAFT GitHub Release for $NEW_VERSION..."

          # Release notes live once per minor series on the docs site; the release
          # body points there instead of carrying a second hand-written narrative.
          BASE_VERSION="${NEW_VERSION%%-*}"
          SERIES_MAJOR_MINOR="${BASE_VERSION%.*}"
          SERIES_URL="https://caipe.io/releases/release-${SERIES_MAJOR_MINOR}.0"

          NOTES=$(printf '%s\n\n%s\n' \
            "<!-- release-initiator:$RELEASE_INITIATOR -->" \
            "📖 Release notes: [${SERIES_MAJOR_MINOR}.0 release notes]($SERIES_URL)")

          gh release create "$NEW_VERSION" \
            --repo "${{ github.repository }}" \
            --title "Release $NEW_VERSION" \
            --generate-notes \
            --notes "$NOTES" \
            --draft

          echo "✅ Draft release created"
          echo "📋 Tag push triggers CI builds; release will be published automatically when required CI builds pass"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/$NEW_VERSION"

      - name: 📊 Summary
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"
          CURRENT_VERSION="${{ needs.commit-release.outputs.current_version }}"

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$CURRENT_VERSION" ]]; then
            echo "| Previous Version | \`$CURRENT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| New Version | \`$NEW_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$NEW_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Modified" >> $GITHUB_STEP_SUMMARY
          echo "- \`charts/**/Chart.yaml\` - versions synced" >> $GITHUB_STEP_SUMMARY
          echo "- \`pyproject.toml\` - version updated" >> $GITHUB_STEP_SUMMARY
          echo "- \`CHANGELOG.md\` - changelog generated (commitizen)" >> $GITHUB_STEP_SUMMARY
          echo "- \`uv.lock\` - lock file regenerated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CI (triggered by tag push) ⏳" >> $GITHUB_STEP_SUMMARY
          echo "CI workflows run from the pushed \`$NEW_VERSION\` tag and publish matching artifacts when complete:" >> $GITHUB_STEP_SUMMARY
          echo "- Dynamic agents" >> $GITHUB_STEP_SUMMARY
          echo "- MCP servers" >> $GITHUB_STEP_SUMMARY
          echo "- RAG components" >> $GITHUB_STEP_SUMMARY
          echo "- CAIPE UI" >> $GITHUB_STEP_SUMMARY
          echo "- Slack bot" >> $GITHUB_STEP_SUMMARY
          echo "- Webex bot" >> $GITHUB_STEP_SUMMARY
          echo "- Helm charts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release (Draft) 📝" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Release $NEW_VERSION](https://github.com/${{ github.repository }}/releases/tag/$NEW_VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Release is in DRAFT state** — it will be published automatically when all CI builds pass." >> $GITHUB_STEP_SUMMARY
          echo "If any CI fails, the release will remain as a draft for investigation." >> $GITHUB_STEP_SUMMARY
