name: "[Release] Manual Version Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote: x.y.z, x.y.z-rc.N, or x.y.z-hotfix.N'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Commit version bump (pyproject.toml + Chart.yaml), changelog, and tag
  commit-release:
    name: Commit Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    outputs:
      current_version: ${{ steps.validate.outputs.current_version }}
      previous_stable: ${{ steps.validate.outputs.previous_stable }}
      is_final_release: ${{ steps.channel.outputs.is_final_release }}
      release_notes_url: ${{ steps.release-post.outputs.url }}
      release_notes_version: ${{ steps.release-post.outputs.version }}
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: Validate manual release ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != refs/heads/main ]]; then
            echo "::error::Run Manual Version Release from main (--ref main). Use Pre-release Build for release-branch candidates."
            exit 1
          fi

      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: ✅ Validate version format and monotonicity
        uses: ./.github/actions/validate-release-tag
        with:
          version: ${{ env.RELEASE_VERSION }}
          allow_prerelease: 'true'

      - name: Classify promotion channel
        id: channel
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ env.RELEASE_VERSION }}

      - name: 📰 Resolve the release post and canonical URL
        id: release-post
        if: steps.channel.outputs.is_final_release == 'true'
        run: python3 scripts/resolve_release_blog.py "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"

      - name: 🔍 Read current version
        id: validate
        run: |
          set -euo pipefail

          RAW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "📋 Current version: $RAW_VERSION"
          echo "current_version=$RAW_VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS_STABLE=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              PREVIOUS_STABLE="$tag"
              break
            fi
          done < <(git tag --sort=-version:refname)
          echo "previous_stable=$PREVIOUS_STABLE" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: 📦 Prepare release (update files + changelog + verify)
        uses: ./.github/actions/prepare-release
        with:
          version: ${{ github.event.inputs.version }}
          allow_prerelease: 'true'

      - name:  Commit, tag, and push
        env:
          CURRENT_VERSION: ${{ steps.validate.outputs.current_version }}
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage changes (pyproject.toml, uv.lock, Chart.yaml files, changelog)
          git add pyproject.toml CHANGELOG.md uv.lock
          find charts -name "Chart.yaml" -type f -exec git add {} +

          # Commit — may be a no-op if pr-version-bump already prepared everything
          if git diff --cached --quiet; then
            echo "ℹ️ No file changes needed — files already at $NEW_VERSION"
          else
            if [[ -n "$CURRENT_VERSION" ]]; then
              git commit -m "bump: version $CURRENT_VERSION → $NEW_VERSION"
            else
              git commit -m "bump: release $NEW_VERSION"
            fi
            echo "✅ Committed version file updates"
          fi

          # Create annotated tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"

          # Push commit and tag
          git push origin main
          git push origin "$NEW_VERSION"

          if [[ "$NEW_VERSION" == *-rc.* || "$NEW_VERSION" == *-hotfix.* ]]; then
            echo "Build-only tag $NEW_VERSION pushed; candidate CI publishes versioned images and charts." >> "$GITHUB_STEP_SUMMARY"
            echo "RC tags receive a GitHub pre-release after required builds pass; hotfix tags remain artifacts only." >> "$GITHUB_STEP_SUMMARY"
            echo "Candidate promotion does not update the stable changelog or latest alias." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "✅ Committed and pushed release $NEW_VERSION"
          echo ""
          echo "🏷️ Tag '$NEW_VERSION' created and pushed"

  # Stable promotions create a release; candidate tag pushes only build artifacts.
  publish-release:
    name: Create Draft Release
    needs: commit-release
    if: needs.commit-release.outputs.is_final_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ secrets.CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 🚀 Create GitHub Release (Draft)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_INITIATOR: ${{ github.actor }}
          PREVIOUS_STABLE: ${{ needs.commit-release.outputs.previous_stable }}
          RELEASE_NOTES_URL: ${{ needs.commit-release.outputs.release_notes_url }}
          RELEASE_NOTES_VERSION: ${{ needs.commit-release.outputs.release_notes_version }}
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"
          echo "🔄 Creating DRAFT GitHub Release for $NEW_VERSION..."

          # Use the same post validated before tagging, including its actual slug.
          NOTES="<!-- release-initiator:$RELEASE_INITIATOR -->"
          if [[ -n "$RELEASE_NOTES_URL" ]]; then
            NOTES=$(printf '%s\n\n%s\n' "$NOTES" \
              "📖 Release notes: [$RELEASE_NOTES_VERSION release notes]($RELEASE_NOTES_URL)")
          fi

          # Published RCs must not shorten the stable release's change set.
          NOTES_ARGS=()
          if [[ -n "$PREVIOUS_STABLE" ]]; then
            NOTES_ARGS+=(--notes-start-tag "$PREVIOUS_STABLE")
          fi
          gh release create "$NEW_VERSION" \
            --repo "${{ github.repository }}" \
            --title "Release $NEW_VERSION" \
            --generate-notes \
            "${NOTES_ARGS[@]}" \
            --notes "$NOTES" \
            --draft

          echo "✅ Draft release created"
          echo "📋 Tag push triggers CI builds; release will be published automatically when required CI builds pass"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/$NEW_VERSION"

      - name: 📊 Summary
        env:
          CURRENT_VERSION: ${{ needs.commit-release.outputs.current_version }}
        run: |
          set -euo pipefail

          NEW_VERSION="$RELEASE_VERSION"

          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$CURRENT_VERSION" ]]; then
            echo "| Previous Version | \`$CURRENT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| New Version | \`$NEW_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$NEW_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Modified" >> $GITHUB_STEP_SUMMARY
          echo "- \`charts/**/Chart.yaml\` - versions synced" >> $GITHUB_STEP_SUMMARY
          echo "- \`pyproject.toml\` - version updated" >> $GITHUB_STEP_SUMMARY
          echo "- \`CHANGELOG.md\` - changelog generated (commitizen)" >> $GITHUB_STEP_SUMMARY
          echo "- \`uv.lock\` - lock file regenerated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CI (triggered by tag push) ⏳" >> $GITHUB_STEP_SUMMARY
          echo "CI workflows run from the pushed \`$NEW_VERSION\` tag and publish matching artifacts when complete:" >> $GITHUB_STEP_SUMMARY
          echo "- Dynamic agents" >> $GITHUB_STEP_SUMMARY
          echo "- MCP servers" >> $GITHUB_STEP_SUMMARY
          echo "- RAG components" >> $GITHUB_STEP_SUMMARY
          echo "- CAIPE UI" >> $GITHUB_STEP_SUMMARY
          echo "- Slack bot" >> $GITHUB_STEP_SUMMARY
          echo "- Webex bot" >> $GITHUB_STEP_SUMMARY
          echo "- Helm charts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release (Draft) 📝" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Release $NEW_VERSION](https://github.com/${{ github.repository }}/releases/tag/$NEW_VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Release is in DRAFT state** — it will be published automatically when all CI builds pass." >> $GITHUB_STEP_SUMMARY
          echo "If any CI fails, the release will remain as a draft for investigation." >> $GITHUB_STEP_SUMMARY
