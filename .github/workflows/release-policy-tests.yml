name: "[Tests] Release Policy"

on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci-*.yml'
      - '.github/workflows/prebuild-*.yml'
      - '.github/workflows/release-*.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/pr-version-bump.yml'
      - '.github/workflows/auto-tag.yml'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'tests/test_release_finalization.py'
      - 'tests/test_harness_release_workflow.py'
      - 'tests/test_release_blog_links.py'
      - 'scripts/resolve_release_blog.py'
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/ci-*.yml'
      - '.github/workflows/prebuild-*.yml'
      - '.github/workflows/release-*.yml'
      - '.github/workflows/docs-release.yml'
      - '.github/workflows/pr-version-bump.yml'
      - '.github/workflows/auto-tag.yml'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'tests/test_release_finalization.py'
      - 'tests/test_harness_release_workflow.py'
      - 'tests/test_release_blog_links.py'
      - 'scripts/resolve_release_blog.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
      - name: Test release validation, image channels, and changelog rollups
        run: >-
          uv run --no-project --with pytest==9.1.1 --with PyYAML==6.0.3
          --with commitizen==4.19.3 pytest -q .github/actions/tests/test_release_policy.py
          tests/test_release_finalization.py tests/test_harness_release_workflow.py
          tests/test_release_blog_links.py
      - name: Checkout pinned Docker metadata action for offline verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: docker/metadata-action
          ref: dc802804100637a589fabce1cb79ff13a1411302 # v6
          path: .metadata-action
          sparse-checkout: dist/index.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify actual Docker tags for release channels
        run: >-
          uv run --no-project --with PyYAML==6.0.3 python
          .github/actions/tests/verify_metadata_action.py .metadata-action/dist/index.cjs
