name: "[CI] CAIPE RAG Build and Push"
description: "Build and push CAIPE RAG Docker image"

on:
  push:
    tags:
      - '**'
  pull_request:
    paths:
      - 'ai_platform_engineering/knowledge_bases/rag/**'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag to apply (e.g., 0.3.0-dev.5)'
        required: false
        type: string
      force_build:
        description: 'Force a fresh build of all components (bypass change-detection). Use for coordinated releases.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      rag_components: ${{ steps.read-config.outputs.rag_components }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/agents.json
          sparse-checkout-cone-mode: false

      - name: Read config
        id: read-config
        run: |
          RAG_COMPONENTS=$(jq -c '.rag_components' .github/agents.json)
          echo "rag_components=$RAG_COMPONENTS" >> $GITHUB_OUTPUT

  determine-changes:
    runs-on: ubuntu-latest
    needs: load-config
    outputs:
      should_build: ${{ steps.set-matrix.outputs.should_build }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      build_matrix: ${{ steps.set-matrix.outputs.build_matrix }}
      build_groups: ${{ steps.set-matrix.outputs.build_groups }}
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: version
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}
          # assisted-by Codex Codex-sonnet-4-6
          # Pull request runs, including Dependabot, do not receive repository
          # app secrets. They only need read access for tag detection.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            shared:
              - 'ai_platform_engineering/knowledge_bases/rag/common/**'
            agent-ontology:
              - 'ai_platform_engineering/knowledge_bases/rag/agent_ontology/**'
              - 'ai_platform_engineering/knowledge_bases/rag/build/Dockerfile.agent-ontology'
            server:
              - 'ai_platform_engineering/knowledge_bases/rag/server/**'
              - 'ai_platform_engineering/knowledge_bases/rag/build/Dockerfile.server'
            ingestors:
              - 'ai_platform_engineering/knowledge_bases/rag/ingestors/**'
              - 'ai_platform_engineering/knowledge_bases/rag/build/Dockerfile.ingestors'

      # Build only the components whose own sources (or the shared `common/`
      # library) changed, instead of rebuilding all three on any rag/** edit.
      # Tag pushes, manual dispatch, and force_build still build everything.
      - name: Compute build matrix
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          FORCE_BUILD: ${{ inputs.force_build }}
          ALL_COMPONENTS: ${{ needs.load-config.outputs.rag_components }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          CHANGED_AGENT_ONTOLOGY: ${{ steps.filter.outputs.agent-ontology }}
          CHANGED_SERVER: ${{ steps.filter.outputs.server }}
          CHANGED_INGESTORS: ${{ steps.filter.outputs.ingestors }}
        with:
          script: |
            const allComponents = JSON.parse(process.env.ALL_COMPONENTS);
            // Prebuild publishes the default variants on prebuild/* PRs, so CI
            // validates only variants that do not have a prebuild image.
            const isPrebuildPr = process.env.EVENT_NAME === 'pull_request' &&
              (process.env.HEAD_REF || '').startsWith('prebuild/');
            const variantMap = isPrebuildPr ? {
              'agent-ontology': [],
              'server': ['huggingface'],
              'ingestors': ['slim'],
            } : {
              'agent-ontology': ['default'],
              'server': ['default', 'huggingface'],
              'ingestors': ['default', 'slim'],
            };
            // Native GitHub-hosted runners per target platform. Building arm64
            // natively (instead of emulating it under QEMU on an amd64 runner)
            // avoids the slowdowns/OOMs that QEMU causes for Chromium-heavy
            // images (e.g. ingestors/default) once the Wolfi chromium package
            // grows past what emulation can push through in a runner's
            // memory/time budget.
            const platforms = [
              { platform: 'linux/amd64', runner: 'ubuntu-latest', arch: 'amd64' },
              { platform: 'linux/arm64', runner: 'ubuntu-24.04-arm', arch: 'arm64' },
            ];
            const expand = (comps) =>
              comps.flatMap(c => (variantMap[c] || ['default']).map(v => ({ component: c, variant: v })));
            // Same as expand(), but split further per platform — one native
            // runner build per (component, variant, platform). The resulting
            // per-arch images are pushed by digest only; merge-manifests later
            // combines them into the final tagged multi-arch manifest list.
            const expandPlatforms = (comps) =>
              expand(comps).flatMap(cv => platforms.map(p => ({ ...cv, ...p })));

            const tag = process.env.TAG_VERSION || '';
            const event = process.env.EVENT_NAME || '';
            const forceBuild = process.env.FORCE_BUILD === 'true';
            const sharedChanged = process.env.SHARED_CHANGED === 'true';
            const changed = allComponents.filter(
              c => process.env['CHANGED_' + c.toUpperCase().replace(/-/g, '_')] === 'true'
            );
            // A change in the shared common/ library forces all components.
            const changedSet = sharedChanged ? allComponents : changed;

            let buildComponents = [];
            if (/-chart\.\d+$/.test(tag)) {
              console.log('📊 Chart-only tag: skipping image builds');
            } else if (forceBuild) {
              buildComponents = allComponents;
              console.log('🔁 force_build requested: building all');
            } else if (tag) {
              buildComponents = allComponents;
              console.log('🏷️ Tag push: building all');
            } else if (event === 'workflow_dispatch') {
              buildComponents = allComponents;
              console.log('🔧 Manual trigger: building all');
            } else {
              // PR / push without a tag: build only changed components.
              buildComponents = changedSet;
              console.log(`📦 Changed components: [${buildComponents}]`);
            }

            const buildMatrix = expandPlatforms(buildComponents);
            const buildGroups = expand(buildComponents);
            core.setOutput('build_matrix', JSON.stringify({ include: buildMatrix }));
            core.setOutput('build_groups', JSON.stringify({ include: buildGroups }));
            core.setOutput('should_build', String(buildGroups.length > 0));

  # Build each component/variant natively per-platform (no QEMU emulation) and
  # push by digest only. merge-manifests (below) then stitches the per-arch
  # digests into the final tagged multi-arch manifest list. Splitting per
  # platform lets arm64 run on a native ubuntu-24.04-arm runner instead of
  # amd64-under-QEMU, which was slow enough to time out or OOM/hang the runner
  # for Chromium-heavy images (ingestors/default) once Wolfi's chromium
  # package grew (see incident: runs 29759351020, 29844566189).
  build-and-push:
    runs-on: ${{ matrix.runner }}
    needs: [determine-changes, load-config]
    if: needs.determine-changes.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJson(needs.determine-changes.outputs.build_matrix) }}
      fail-fast: false

    env:
      REGISTRY: ghcr.io
      # For slim variant, append -slim to image name suffix in tags (not the image name itself)
      IMAGE_NAME: ${{ github.repository_owner }}/caipe-rag-${{ matrix.component }}
      DOCKERFILE: ai_platform_engineering/knowledge_bases/rag/build/Dockerfile.${{ matrix.component }}

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-packages: write

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          # Remove unnecessary packages and files
          sudo apt-get remove -y '^ghc-*' || true
          sudo apt-get remove -y '^dotnet-*' || true
          sudo apt-get remove -y '^llvm-*' || true
          sudo apt-get remove -y 'php*' || true
          sudo apt-get remove -y azure-cli google-cloud-cli hhvm google-chrome-stable firefox powershell mono-devel || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Remove large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean Docker system
          docker system prune -af --volumes || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # For non-default variants, append variant name as suffix to all tags
          flavor: |
            suffix=${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Clean up before build
        run: |
          echo "Cleaning up Docker system before build..."
          docker system prune -f --volumes || true
          echo "Current disk usage:"
          df -h

      # Native single-platform build (matrix.platform), no QEMU involved.
      # Pushed by digest only — merge-manifests combines the per-arch
      # digests into the final tagged multi-arch manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ai_platform_engineering/knowledge_bases/rag
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ matrix.component != 'server' && format('type=gha,mode=min,scope={0}-{1}-{2}', matrix.component, matrix.variant, matrix.arch) || '' }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.variant }}--${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests pushed by build-and-push into a single
  # tagged multi-arch manifest list, one job per (component, variant) —
  # unlike build-and-push, this is not split per-platform since it only
  # manipulates registry metadata (no image content is built here).
  merge-manifests:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: [determine-changes, build-and-push]
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    strategy:
      matrix: ${{ fromJson(needs.determine-changes.outputs.build_groups) }}
      fail-fast: false

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/caipe-rag-${{ matrix.component }}

    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-${{ matrix.component }}-${{ matrix.variant }}--*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # For non-default variants, append variant name as suffix to all tags
          flavor: |
            suffix=${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Notify release-finalize workflow when this CI completes (for final release builds only)
  notify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for repository_dispatch via gh api
    needs: [determine-changes, build-and-push, merge-manifests]
    if: |
      always() &&
      needs.determine-changes.outputs.tag_version != '' &&
      !contains(needs.determine-changes.outputs.tag_version, '-')
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CI_BUILD_APP_ID }}
          private-key: ${{ secrets.CI_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: 🔔 Notify release finalize
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_VERSION: ${{ needs.determine-changes.outputs.tag_version }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          # Determine overall conclusion
          BUILD_RESULT="${{ needs.build-and-push.result }}"
          MERGE_RESULT="${{ needs.merge-manifests.result }}"

          # Consider skipped as success (job conditions not met)
          if [[ "$BUILD_RESULT" == "skipped" ]]; then BUILD_RESULT="success"; fi
          if [[ "$MERGE_RESULT" == "skipped" ]]; then MERGE_RESULT="success"; fi

          if [[ "$BUILD_RESULT" == "success" && "$MERGE_RESULT" == "success" ]]; then
            CONCLUSION="success"
          else
            CONCLUSION="failure"
          fi

          echo "🔔 Notifying release-finalize: tag=$TAG_VERSION, conclusion=$CONCLUSION"

          gh api --method POST /repos/${{ github.repository }}/dispatches --input - <<EOF
          {
            "event_type": "ci-completed",
            "client_payload": {
              "tag": "$TAG_VERSION",
              "workflow": "$WORKFLOW_NAME",
              "conclusion": "$CONCLUSION"
            }
          }
          EOF
